  '/api/dashboard/incidents/{incidentId}/notes':
    post:
      operationId: addIncidentNote
      security: [{coordinatorBearer: []}]
      summary: Сохранить заметку смены в хронологии INC (KAN-43)
      description: |
        Координатор добавляет заметку к INC. Автор — локальная идентичность проверенного
        токена; необязательное `authorId` в теле должно совпадать с ней, чужой автор —
        `403 INCIDENT_NOTE_AUTHOR_MISMATCH` без записи и без продвижения `eventSeq`.
        `observedAt` — время наблюдения, по умолчанию текущее время сервера. Событие заметки
        получает собственный `eventSeq` из общей последовательности хронологии KAN-28;
        опубликованный `revision` снимка ITSM не меняется.
      parameters:
        - {name: incidentId, in: path, required: true, schema: {$ref: '#/components/schemas/IncidentId'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentNoteRequest'
            examples:
              shiftObservation:
                summary: Заметка со временем наблюдения и эхом автора
                value:
                  text: 'Связка восстановлена, деградация не подтверждена'
                  observedAt: '2026-11-21T09:15:00Z'
                  authorId: 7
              defaultTime:
                summary: Заметка со временем наблюдения по умолчанию
                value:
                  text: 'Передано смене: следить за очередью платежей'
      responses:
        '201':
          description: 'Заметка сохранена; `eventSeq` — позиция события в общей хронологии.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentNote'
              examples:
                savedNote:
                  summary: Сохранённая заметка с автором из токена
                  value:
                    noteId: 3f2c1b9e-6a43-4c1a-9a37-0e5d7b2d4c11
                    incidentId: INC000021095532
                    authorId: 7
                    authorLogin: operator
                    authorDisplayName: 'Dashboard Operator'
                    observedAt: '2026-11-21T09:15:00Z'
                    eventSeq: 44
                    text: 'Связка восстановлена, деградация не подтверждена'
        '400':
          description: Некорректный текст или идентификатор INC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyText:
                  summary: Пустой текст заметки
                  value: {"code": "INCIDENT_NOTE_TEXT_INVALID", "message": "Note text must contain 1-4000 non-whitespace characters"}
                invalidIncidentId:
                  summary: Идентификатор не вида INC
                  value: {"code": "INVALID_INCIDENT_ID", "message": "incidentId must be an INC identifier such as INC000021095531"}
        '401':
          description: Требуется Bearer JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authRequired:
                  summary: Нет Bearer JWT
                  value: {"code": "HUMAN_AUTH_REQUIRED", "message": "Human access token is required"}
        '403':
          description: Нет локального допуска или заявлен чужой автор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                coordinatorAccessDenied:
                  summary: Токен без локального допуска координатора
                  value: {"code": "COORDINATOR_ACCESS_DENIED", "message": "Coordinator access is not granted"}
                authorMismatch:
                  summary: В теле заявлен чужой автор
                  value: {"code": "INCIDENT_NOTE_AUTHOR_MISMATCH", "message": "Note author must be the authenticated coordinator"}
        '404':
          description: Инцидент неизвестен дашборду.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                incidentNotFound:
                  summary: Неизвестный INC
                  value: {"code": "INCIDENT_NOT_FOUND", "message": "Incident INC000021099999 not found"}
    get:
      operationId: listIncidentNotes
      security: [{coordinatorBearer: []}]
      summary: История заметок INC (KAN-43)
      description: |
        Заметки одного INC в порядке возрастания `eventSeq`, по страницам: `afterEventSeq` —
        курсор (`lastEventSeq` предыдущей страницы), `limit` — размер страницы (1-100).
        Следующая смена видит все заметки с авторами и временами наблюдения; параллельные
        заметки с одной отметкой времени получают разные `eventSeq` и помещаются в один ответ.
        INC, исчезнувший из источника, остаётся читаемым; неизвестный дашборду INC — `404`.
      parameters:
        - {name: incidentId, in: path, required: true, schema: {$ref: '#/components/schemas/IncidentId'}}
        - name: afterEventSeq
          in: query
          required: false
          description: 'Курсор: вернуть заметки с `eventSeq > afterEventSeq`.'
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Размер страницы, 1-100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: 'Страница истории заметок; `lastEventSeq` — следующий курсор.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentNotesPage'
              examples:
                twoCoordinators:
                  summary: 'Две заметки двух координаторов с одной отметкой времени (fixture notes-two-coordinators)'
                  x-fixture: notes-two-coordinators
                  value:
                    incidentId: INC000021095532
                    notes:
                      - noteId: 3f2c1b9e-6a43-4c1a-9a37-0e5d7b2d4c11
                        incidentId: INC000021095532
                        authorId: 7
                        authorLogin: operator
                        authorDisplayName: 'Dashboard Operator'
                        observedAt: '2026-11-21T09:15:00Z'
                        eventSeq: 44
                        text: 'Связка восстановлена, деградация не подтверждена'
                      - noteId: 8d1e2f0a-7b4c-4d2e-8a0f-9c3b1a2e3f45
                        incidentId: INC000021095532
                        authorId: 8
                        authorLogin: reliever
                        authorDisplayName: 'Shift Reliever'
                        observedAt: '2026-11-21T09:15:00Z'
                        eventSeq: 45
                        text: 'Принято; очередь платежей под наблюдением до 18:00'
                    hasMore: false
                    lastEventSeq: 45
                emptyHistory:
                  summary: У известного INC заметок ещё нет
                  value:
                    incidentId: INC000021095539
                    notes: []
                    hasMore: false
                    lastEventSeq: 0
        '400':
          description: Некорректный курсор или размер страницы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCursor:
                  summary: afterEventSeq отрицательный
                  value: {"code": "INVALID_EVENT_SEQ", "message": "afterEventSeq/sinceEventSeq must be a non-negative 64-bit integer"}
                invalidLimit:
                  summary: limit вне 1-100
                  value: {"code": "INVALID_LIMIT", "message": "limit must be between 1 and 100"}
        '401':
          description: Требуется Bearer JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authRequired:
                  summary: Нет Bearer JWT
                  value: {"code": "HUMAN_AUTH_REQUIRED", "message": "Human access token is required"}
        '404':
          description: Инцидент неизвестен дашборду.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                incidentNotFound:
                  summary: Неизвестный INC
                  value: {"code": "INCIDENT_NOT_FOUND", "message": "Incident INC000021099999 not found"}
  /api/incidents/{incidentId}/investigations:
    post:
      operationId: launchIncidentInvestigation
      security: [{coordinatorBearer: []}]
      summary: Запустить AI-расследование инцидента (KAN-40)
      description: |
        Асинхронный запуск расследования по карточке одного INC. Backend читает
        опубликованную карточку и свидетельства источников KAN-39 за последнее окно
        наблюдения, привязывает запуск к опубликованной `revision`, сохраняет факты
        (каждый со своим `evidenceId`), явные пробелы и запрос к модели, и только после
        этого ставит ответ модели в очередь. Тело ответа — текущее состояние запуска;
        результат читается через `GET /api/incidents/{incidentId}/investigations/{runId}`.

        У активного INC (`Assigned`, `WorkInProgress`) решение (`solution`) никогда не
        уходит модели. Реальный вызов модели включается профилем `ai` с ключом; без
        модели запуск отклоняется явным `503 AI_MODEL_NOT_CONFIGURED`, карточка INC
        остаётся доступной. Один и тот же INC можно расследовать повторно: запуски не
        переиспользуются и не перезаписываются.
      parameters:
        - {name: incidentId, in: path, required: true, schema: {$ref: '#/components/schemas/IncidentId'}}
      responses:
        '202':
          description: 'Запуск принят; модель отвечает асинхронно. Читай статус через `runId`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiInvestigationRun'
