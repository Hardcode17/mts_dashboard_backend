        '400':
          description: Неверные настройки или некорректный JSON.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalidSettings:
                  summary: Неподдерживаемый приоритет
                  value: { code: INVALID_NOTIFICATION_CONNECTION, message: Invalid notification connection settings }
                invalidJson:
                  summary: Неверный синтаксис запроса
                  value: { code: INVALID_REQUEST_BODY, message: Request body is malformed or missing }
        '401':
          description: Нужен токен координатора.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                authenticationRequired:
                  summary: Нет действительного токена
                  value: { code: HUMAN_AUTH_REQUIRED, message: Human access token is required }
        '403':
          description: У пользователя нет локального допуска.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                coordinatorAccessDenied:
                  summary: Нет допуска
                  value: { code: COORDINATOR_ACCESS_DENIED, message: Coordinator access is not granted }
  /api/dashboard/notification-connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      operationId: getNotificationConnection
      summary: Получить личное подключение (KAN-36)
      security:
        - coordinatorBearer: []
      responses:
        '200':
          description: Настройки подключения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationConnection'
              examples:
                emailP4:
                  summary: Текущее подключение для P4
                  value: { id: 12, channel: email, address: coordinator@example.test, active: true, priorityIds: [4] }
        '401':
          description: Нужен токен координатора.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                authenticationRequired:
                  summary: Нет действительного токена
                  value: { code: HUMAN_AUTH_REQUIRED, message: Human access token is required }
        '403':
          description: У пользователя нет локального допуска.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                coordinatorAccessDenied:
                  summary: Нет допуска
                  value: { code: COORDINATOR_ACCESS_DENIED, message: Coordinator access is not granted }
        '404':
          description: Личное подключение не найдено.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                connectionNotFound:
                  summary: Чужой или неизвестный ID
                  value: { code: NOTIFICATION_CONNECTION_NOT_FOUND, message: Notification connection not found }
    put:
      operationId: updateNotificationConnection
      summary: Сохранить настройки личного подключения (KAN-36)
      description: |
        Заменяет настройки и список приоритетов. При `active: false` подключение остаётся
        в настройках, но исключается из маршрутизации. Пустой список приоритетов также
        исключает его из маршрутизации. Опущенный `secretRef` сохраняет прежнюю ссылку,
        если тип канала тот же. `secretRef: null` удаляет ссылку.
