                $ref: '#/components/schemas/IncidentNotFound'
              examples:
                notFound:
                  summary: INC отсутствует в опубликованной версии
                  value:
                    code: INCIDENT_NOT_FOUND
                    message: Incident INC000021095599 not found
                    eventSeq: 43
                    revision: 42
  /api/dashboard/monitoring/summary:
    get:
      operationId: monitoringSummary
      summary: Сводка режима мониторинга (KAN-62)
      description: |
        Read-only снимок для большого экрана: текущие счётчики четырёх независимых категорий,
        распределение активных инцидентов по приоритетам, нагрузка на координаторов и
        таймлайн фактических публикаций за последние 24 часа. Категории могут пересекаться.
        `activeCount` — только `Assigned` и `WorkInProgress`; `research` в него не входит.
        Таймлайн отсортирован по `at`, затем по порядку публикации. Точки не синтезируются:
        без опубликованных снимков за окно возвращается `[]`, а `updatedAt` = `null`, пока
        не было ни одной успешной публикации. `priorities` содержит только встреченные
        приоритеты активных инцидентов; `coordinatorLoad` — только назначенных координаторов,
        по убыванию нагрузки, затем по имени.
      security:
        - humanBearer: []
        - cookieAuth: []
        - localBasic: []
      responses:
        '200':
          description: Текущая сводка и ограниченная 24-часовой таймлайн-историей.
          headers:
            Cache-Control:
              description: '`no-store`: экран опрашивает маршрут каждые 5 секунд.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringSummary'
              examples:
                active:
                  summary: Сводка с пересекающимися категориями и двумя точками истории
                  value:
                    updatedAt: '2026-11-21T09:05:01.000000Z'
                    activeCount: 4
                    counts:
                      critical: 2
                      high: 1
                      coordinators: 2
                      research: 1
                    timeline:
                      - at: '2026-11-21T09:04:31.000000Z'
                        critical: 2
                        high: 1
                        coordinators: 2
                        research: 1
                      - at: '2026-11-21T09:05:01.000000Z'
                        critical: 2
                        high: 1
                        coordinators: 2
                        research: 1
                    priorities:
                      - priorityId: 1
                        count: 1
                      - priorityId: 3
                        count: 1
                      - priorityId: 4
                        count: 2
                    coordinatorLoad:
                      - name: Буратино (buratino)
                        count: 1
                      - name: Дядя Фёдор (unclefedor)
                        count: 1
                beforeFirstSuccess:
                  summary: Публикаций ещё не было — история пуста, ничего не выдумываем
                  value:
                    updatedAt: null
                    activeCount: 0
                    counts:
                      critical: 0
                      high: 0
                      coordinators: 0
                      research: 0
                    timeline: []
                    priorities: []
                    coordinatorLoad: []
        '401':
          description: Нет допустимой сессии или человеческого токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
  '/api/incidents/{id}/relationships':
    get:
      operationId: getIncidentRelationships
      summary: Связи инцидента для графа карточки (KAN-66)
      description: |
        Один шаг в обе стороны от `focusId`: сам инцидент, его непосредственный родитель и
        непосредственные дети. `nodes` не содержит соседей другого уровня; `edges` содержит
        только рёбра между `focusId` и его прямым родителем/детьми. Известный INC без связей
        возвращает один узел и пустой `edges`. Неизвестный опубликованный INC — `404`.
        Для существующих узлов `title`, `stateEnum` и `priorityId` могут быть `null`; `id` — нет.
      security:
        - humanBearer: []
        - cookieAuth: []
        - localBasic: []
      parameters:
        - name: id
          in: path
          required: true
          description: 'Строковый INC фокуса, URL-кодируется; числовой вид не принимается.'
          schema:
            $ref: '#/components/schemas/IncidentId'
          examples:
            parent:
              value: "INC000021095531"
      responses:
        '200':
          description: 'Граф глубины один: фокус, прямой родитель и прямые дети.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentRelationships'
              examples:
                parentWithChildren:
                  summary: 'Фокус — родитель двух дочерних INC'
                  value:
                    focusId: INC000021095531
                    nodes:
                      - id: INC000021095531
                        title: Оплата · Отказ камеры
                        stateEnum: Assigned
                        priorityId: 4
                      - id: INC000021095532
                        title: Оплата · Очередь платежей
                        stateEnum: WorkInProgress
                        priorityId: 4
                      - id: INC000021095533
                        title: Оплата · Повторные списания
                        stateEnum: Assigned
                        priorityId: 3
                    edges:
                      - parentId: INC000021095531
                        childId: INC000021095532
                      - parentId: INC000021095531
                        childId: INC000021095533
                childWithParent:
                  summary: 'Фокус — дочерний INC; виден только прямой родитель'
                  value:
                    focusId: INC000021095532
                    nodes:
                      - id: INC000021095532
                        title: Оплата · Очередь платежей
                        stateEnum: WorkInProgress
                        priorityId: 4
                      - id: INC000021095531
                        title: Оплата · Отказ камеры
                        stateEnum: Assigned
                        priorityId: 4
                    edges:
                      - parentId: INC000021095531
                        childId: INC000021095532
                unrelated:
                  summary: 'Известный INC без связей: один узел и пустой список рёбер'
                  value:
                    focusId: INC000021095540
                    nodes:
                      - id: INC000021095540
                        title: null
                        stateEnum: Research
                        priorityId: null
                    edges: []
        '400':
          description: Идентификатор не в формате INC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidIncidentId:
                  summary: Идентификатор не в формате INC
                  value: {"code": "INVALID_INCIDENT_ID", "message": "incidentId must be an INC identifier such as INC000021095531"}
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
        '403':
          description: Токен или сессия без нужного права.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                coordinatorAccessDenied:
                  summary: Нет локального допуска координатора
                  value: {"code": "COORDINATOR_ACCESS_DENIED", "message": "Coordinator access is not granted"}
        '404':
          description: Инцидент отсутствует в опубликованной версии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentNotFound'
              examples:
                notFound:
                  summary: INC отсутствует в опубликованной версии
                  value:
                    code: INCIDENT_NOT_FOUND
                    message: Incident INC000021095599 not found
                    eventSeq: 43
                    revision: 42
  /api/dashboard/sources:
    get:
      operationId: listSources
      summary: Статус источников и свежесть публикации (KAN-7)
      description: |
        Все источники, включая stale. `revision` — опубликованная ревизия изменений,
        `sourceVersion` — последняя доставка (не путать ни с `revision`, ни с `eventSeq`). `stale` —
        `true`, пока последняя доставка не опубликована, или последний приём старше
        `staleAfterSeconds` (при снимке каждые 30 с — пропуск до трёх тиков).
      responses:
        '200':
          description: Источники.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'
              examples:
                published:
                  summary: Свежий опубликованный снимок (fixture sources-published)
                  x-fixture: sources-published
                  value:
                    eventSeq: 43
                    revision: 42
                    sources:
                      - sourceId: itcs-prod
                        kind: ITCS
                        revision: 42
                        sourceVersion: 42
                        lastReceivedAt: '2026-11-21T09:05:00.123456Z'
                        lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                        batchStatus: SUCCEEDED
                        stale: false
                        staleAfterSeconds: 90
                stale:
                  summary: 'Снимок принят, успеха воркера нет — stale (fixture sources-stale)'
                  x-fixture: sources-stale
                  value:
                    eventSeq: 43
                    revision: 42
                    sources:
                      - sourceId: itcs-prod
                        kind: ITCS
                        revision: 42
                        sourceVersion: 43
                        lastReceivedAt: '2026-11-21T09:08:35.250000Z'
                        lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                        batchStatus: RECEIVED
                        stale: true
                        staleAfterSeconds: 90
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                machineAuthRequired:
                  summary: Нет или невалиден машинный Bearer
                  value: {"code": "MACHINE_AUTH_REQUIRED", "message": "Machine bearer token is required"}
  /api/dashboard/events:
    get:
      operationId: pollEvents
      summary: Polling изменений по eventSeq (KAN-7)
      description: |
        События с `eventSeq > sinceEventSeq`, по возрастанию. Два события одного INC
        (обновление и удаление) приходят разными `eventId` и `eventSeq`.
      parameters:
        - name: sinceEventSeq
          in: query
          required: true
          description: 'Последний обработанный `eventSeq`; `0` — с начала.'
          schema:
            $ref: '#/components/schemas/EventSeq'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Изменения.
          headers:
            ETag:
              description: '`eventSeq` выборки; `If-None-Match` с ним даёт `304`, когда новых событий нет.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatch'
              examples:
                twoEventsSameIncident:
                  summary: Обновление и удаление одного INC — два eventId (fixture events-poll-two-events)
                  x-fixture: events-poll-two-events
                  value:
                    eventSeq: 43
                    nextEventSeq: 43
                    stale: false
                    source:
                      sourceId: itcs-prod
                      kind: ITCS
                      revision: 42
                      sourceVersion: 42
                      lastReceivedAt: '2026-11-21T09:05:00.123456Z'
                      lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                      batchStatus: SUCCEEDED
                      stale: false
                      staleAfterSeconds: 90
                    events:
                      - eventId: evt-0002
                        type: upserted
                        eventSeq: 43
                        occurredAt: '2026-11-21T09:05:00.500000Z'
                        incident:
                          id: INC000021095533
                          groupMemberships:
                            - group: high
                              matchedRule: priorityId = 3
                      - eventId: evt-0003
                        type: removed
                        eventSeq: 43
                        occurredAt: '2026-11-21T09:05:00.500000Z'
                        incident:
                          id: INC000021095533
                          groupMemberships:
                            - group: high
                              matchedRule: priorityId = 3
                heartbeat:
                  summary: 'Изменений нет, событие-сердцебиение (fixture events-heartbeat)'
                  x-fixture: events-heartbeat
                  value:
                    eventSeq: 43
                    nextEventSeq: 43
                    stale: false
                    source:
                      sourceId: itcs-prod
                      kind: ITCS
                      revision: 42
                      sourceVersion: 42
                      lastReceivedAt: '2026-11-21T09:05:00.123456Z'
                      lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                      batchStatus: SUCCEEDED
                      stale: false
                      staleAfterSeconds: 90
                    events:
                      - eventId: evt-0004
                        type: heartbeat
                        eventSeq: 43
                        occurredAt: '2026-11-21T09:05:00.500000Z'
                        incident: null
        '304':
          description: 'С указанного `eventSeq` изменений не было.'
        '400':
          description: Некорректный запрос.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSinceEventSeq:
                  summary: Обязательный sinceEventSeq отсутствует
                  value: {"code": "INVALID_EVENT_SEQ", "message": "sinceEventSeq is required"}
                eventSeqOverflow:
                  summary: sinceEventSeq вне int64
                  value: {"code": "INVALID_EVENT_SEQ", "message": "sinceEventSeq must be in [0, 9223372036854775807]"}
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
  /api/dashboard/events/ack:
    post:
      operationId: acknowledgeEvents
      summary: Подтвердить точный набор eventId (KAN-7)
      description: |
        Идемпотентно: повтор того же набора — тот же `200` и `eventSeq`. Порядок не
        важен. Набор сравнивается целиком: неизвестный, чужой или уже вытесненный `eventId` —
        `400 ACK_EVENT_UNKNOWN`, и ничего не подтверждается.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventAckRequest'
            examples:
              twoEvents:
                summary: Оба события INC000021095533 (fixture events-ack-request)
                x-fixture: events-ack-request
                value:
                  eventIds:
                    - evt-0002
                    - evt-0003
      responses:
        '200':
          description: 'Набор подтверждён; `eventSeq` — подтверждённая позиция.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAck'
              examples:
                twoEvents:
                  summary: Подтверждены evt-0002 и evt-0003 (fixture events-ack-response)
                  x-fixture: events-ack-response
                  value:
                    eventSeq: 43
                    confirmedEventIds:
                      - evt-0002
                      - evt-0003
                    status: acknowledged
        '400':
          description: Некорректный набор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownEvent:
                  summary: eventId не входит в журнал
                  value: {"code": "ACK_EVENT_UNKNOWN", "message": "Unknown eventId evt-0009"}
                emptySet:
                  summary: Пустой набор eventId
                  value: {"code": "ACK_EVENTS_INVALID", "message": "eventIds must contain 1-1000 unique ids"}
                duplicateIds:
                  summary: Повтор внутри набора eventId
                  value: {"code": "ACK_EVENTS_INVALID", "message": "eventIds must contain no duplicates"}
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
components:
  securitySchemes:
    coordinatorBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Токен координатора Keycloak (`azp=dashboard-web`); после проверки подписи требуется локальный допуск (KAN-16, KAN-22). Токен импорта не подходит.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: 'Сессия интерфейса координатора; неаутентифицированный браузер перенаправляется на форму входа (`302`).'
    machineBearer:
      type: http
      scheme: bearer
      x-prospective: true
      description: |
        Предлагается, не развёрнуто: JWT Keycloak для машинного мониторинга.
        Проверяются `iss`, подпись JWKS, `exp`, `aud`; остальное — как `machineBearer` в
        `itsm-ingest.openapi.yaml`.
  schemas:
    IncidentId:
      type: string
      pattern: '^INC[0-9]{6,18}$'
      description: 'Строковый INC. Числовой JSON `id` недопустим.'
    UtcInstant:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|\+00:00)$'
      description: 'UTC, ISO-8601: `YYYY-MM-DDTHH:MM:SS[.ffffff]Z`. Иные смещения и локальное время не допускаются.'
    EventSeq:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
      description: 'Счётчик публикаций, версия блока статуса. Растёт на каждой применённой публикации, даже если состав INC не изменился.'
    PublishedRevision:
      type: integer
      format: int64
      minimum: 0
      description: 'Опубликованная версия источника из последнего успешного пакета. `0` — публикации ещё нет.'
    IncidentGroupKey:
      type: string
      enum:
        - critical
        - coordinator
        - high
        - research
      description: |
        `critical` — активный P4; `high` — активный P3; `coordinator` — активный или
        Research с назначением на координаторов массовых инцидентов; `research` —
        `stateEnum = Research` при любой дате устранения.
    ItsmIncidentState:
      type: string
      enum:
        - Assigned
        - WorkInProgress
        - Resolved
        - Closed
        - Research
    IncidentGroupMembership:
      type: object
      required:
        - group
        - matchedRule
      properties:
        group:
          $ref: '#/components/schemas/IncidentGroupKey'
        matchedRule:
          type: string
          description: 'Правило, по которому INC попал в группу.'
      additionalProperties: false
    MonitoringCounts:
      type: object
      description: 'Независимые счётчики категорий; категории могут пересекаться.'
      required:
        - critical
        - high
        - coordinators
        - research
      properties:
        critical:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        coordinators:
          type: integer
          minimum: 0
        research:
          type: integer
          minimum: 0
      additionalProperties: false
    MonitoringTimelinePoint:
      type: object
      description: 'Фактическое наблюдение опубликованного снимка, без синтетических нулей.'
      required:
        - at
        - critical
        - high
        - coordinators
        - research
      properties:
        at:
          $ref: '#/components/schemas/UtcInstant'
        critical:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        coordinators:
          type: integer
          minimum: 0
        research:
          type: integer
          minimum: 0
      additionalProperties: false
    MonitoringPriority:
      type: object
      required:
        - priorityId
        - count
      properties:
        priorityId:
          type: integer
          format: int32
        count:
          type: integer
          minimum: 0
      additionalProperties: false
    MonitoringCoordinatorLoad:
      type: object
      required:
        - name
        - count
      properties:
        name:
          type: string
          minLength: 1
        count:
          type: integer
          minimum: 0
      additionalProperties: false
    MonitoringSummary:
      type: object
      required:
        - updatedAt
        - activeCount
        - counts
        - timeline
        - priorities
        - coordinatorLoad
      properties:
        updatedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: 'Время последней успешной публикации; `null` до первой публикации.'
        activeCount:
          type: integer
          minimum: 0
          description: 'Инциденты в `Assigned` или `WorkInProgress`.'
        counts:
          $ref: '#/components/schemas/MonitoringCounts'
        timeline:
          type: array
          description: 'Публикации за последние 24 часа, по возрастанию `at`.'
          items:
            $ref: '#/components/schemas/MonitoringTimelinePoint'
        priorities:
          type: array
          description: 'Активные инциденты по исходному `priorityId`; только встреченные значения.'
          items:
            $ref: '#/components/schemas/MonitoringPriority'
        coordinatorLoad:
          type: array
          description: 'Активные инциденты на координаторах по назначенному сотруднику.'
          items:
            $ref: '#/components/schemas/MonitoringCoordinatorLoad'
      additionalProperties: false
    IncidentSummary:
      type: object
      required:
        - id
        - stateEnum
        - priorityId
        - submitDate
        - deadline
        - groupMemberships
      description: Строка списка групп.
      properties:
        assignedEmployeeLogin: {type: [string, 'null']}
        assignedEmployee: {type: [string, 'null']}
        id:
          $ref: '#/components/schemas/IncidentId'
        productName:
          type:
            - string
            - 'null'
        assignedGroupName:
          type:
            - string
            - 'null'
        stateEnum:
          $ref: '#/components/schemas/ItsmIncidentState'
        priorityId:
          type: integer
          format: int32
          description: 'Исходный приоритет ITSM. Только P4 и P3 влияют на группы `critical` и `high`.'
        submitDate:
          $ref: '#/components/schemas/UtcInstant'
        deadline:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: '`null` — срока нет.'
        completionDate:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        groupMemberships:
          type: array
          description: 'Все группы INC, отсортированы по `group`.'
          items:
            $ref: '#/components/schemas/IncidentGroupMembership'
      additionalProperties: false
    IncidentCard:
      type: object
      description: Карточка INC (карточка в ITSM).
      required:
        - id
        - stateEnum
        - priorityId
        - submitDate
        - deadline
        - assignedEmployee
        - remainingSeconds
        - overdue
        - itsmUrl
        - itsmDemo
        - groupMemberships
        - deadlineRisk
        - eventSeq
        - revision
      properties:
        itsmUrl: {type: string, format: uri}
        remainingSeconds: {type: [integer, 'null']}
        overdue: {type: boolean}
        assignedEmployeeLogin: {type: [string, 'null']}
        assignedEmployee: {type: [string, 'null']}
        id:
          $ref: '#/components/schemas/IncidentId'
        header:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        productName:
          type:
            - string
            - 'null'
        productMasterId:
          type:
            - string
            - 'null'
        service:
          type:
            - string
            - 'null'
        serviceType:
          type:
            - string
            - 'null'
        assignedGroupName:
          type:
            - string
            - 'null'
        assignedEmployee:
          type:
            - string
            - 'null'
          description: 'Официальный исполнитель по данным ITSM, не внутреннее назначение дашборда.'
        stateEnum:
          $ref: '#/components/schemas/ItsmIncidentState'
        stateReason:
          type:
            - string
            - 'null'
        priorityId:
          type: integer
          format: int32
          description: 'Исходный приоритет ITSM без подмены.'
        submitDate:
          $ref: '#/components/schemas/UtcInstant'
        lastAssignmentToTeamDateTime:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        deadline:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: '`null` — срока нет; отсутствие или `0001-01-01T00:00:00Z` в снимке.'
        completionDate:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: 'Только у завершённых (`Resolved`, `Closed`, `Research`); у активных — `null`.'
        solution:
          type:
            - string
            - 'null'
          description: 'Только у завершённых; у активных — `null`.'
        remainingSeconds:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Срок минус серверное время, в секундах с округлением вниз. Без срока и вне Assigned/WorkInProgress — `null`.'
        overdue:
          type: boolean
          description: 'Только для Assigned/WorkInProgress со сроком, когда серверное время строго больше срока. Ровно в срок — `false`.'
        itsmUrl:
          type: string
          format: uri
          description: 'Абсолютный HTTP(S) URL этого INC в ITSM; не productUrl.'
        itsmDemo:
          type: boolean
          description: 'Показывать явную пометку демоцели, если `true`.'
        groupMemberships:
          type: array
          items:
            $ref: '#/components/schemas/IncidentGroupMembership'
        deadlineRisk:
          $ref: '#/components/schemas/DeadlineRisk'
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
      additionalProperties: false
    DeadlineRisk:
      type: object
      description: |
        Риск нарушения дедлайна (KAN-82). Пересчитывается фоново при каждой публикации снимка
        ITSM для активных инцидентов со сроком; отдельного сервиса нет, модель — константы в
        конфигурации бэкенда. По умолчанию работает регрессия KAN-81. Приоритет P4 (критический) соответствует
        рангу UCI 1. Пока в ITSM нет истории группы, берётся обучающая медиана этого приоритета. Режим threshold
        оценивает оставшееся время до дедлайна. Оценка только читает данные и не меняет дедлайн, приоритет и
        статус; предупреждение о приближении срока (KAN-46) показывается рядом и отдельно.
        `risk: unknown` — срока нет, карточка завершена или оценка недоступна; карточку не
        блокирует. `score` — взвешенная сумма признаков (не вероятность), только для
        отладки, в UI не показывать.
      required:
        - risk
        - evaluatedAt
        - reasons
        - score
      properties:
        risk:
          type: string
          enum:
            - low
            - medium
            - high
            - unknown
        evaluatedAt:
          $ref: '#/components/schemas/UtcInstant'
        reasons:
          type: array
          description: 'Основания оценки с конкретными числами; у `unknown` — причина недоступности.'
          items:
            type: object
            required:
              - code
              - text
            additionalProperties: false
            properties:
              code:
                type: string
                description: 'Стабильный код основания: `training_priority_median`, `unsupported_priority`, `remaining_below_threshold`, `remaining_in_buffer`, `group_median`, `group_median_exceeds`, `deadline_extended`, `reassigned`, `reopened`, `status_stale`, `assignee_overloaded`, `no_deadline`, `no_history`, `not_active`, `not_evaluated`.'
              text:
                type: string
        score:
          type:
            - number
            - 'null'
          description: 'Взвешенная сумма признаков `w0 + w1*x1 + … + w7*x7`; `null` для `unknown` и режима threshold.'
      additionalProperties: false
    IncidentList:
      type: object
      required:
        - eventSeq
        - revision
        - beforeFirstSuccess
        - groups
        - items
        - nextCursor
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
        beforeFirstSuccess:
          type: boolean
          description: '`true`, пока нет ни одной опубликованной версии: списки пусты, группы пусты.'
        groups:
          type: array
          description: 'Группы дашборда в порядке отображения; при `beforeFirstSuccess` — `[]`.'
          items:
            $ref: '#/components/schemas/IncidentGroup'
        items:
          type: array
          items:
            $ref: '#/components/schemas/IncidentSummary'
        nextCursor:
          type:
            - string
            - 'null'
          description: '`null` — страниц больше нет.'
      additionalProperties: false
    IncidentGroup:
      type: object
      required:
        - key
        - title
        - rule
        - active
        - incidentCount
        - incidents
        - fixed
      description: 'Группа дашборда. Пустая группа — `incidents: []` и `incidentCount: 0`.'
      properties:
        key:
          $ref: '#/components/schemas/IncidentGroupKey'
        title:
          type: string
        rule:
          type: string
        active:
          type: boolean
          description: 'Активные — `critical`, `high`, `coordinator`; `research` — завершённая.'
        incidentCount:
          type: integer
          minimum: 0
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/IncidentSummary'
        fixed:
          anyOf:
            - $ref: '#/components/schemas/EventSeq'
            - type: 'null'
          description: '`null`: состав групп меняется с событиями, поэтому не фиксируется.'
      additionalProperties: false
    IncidentRelationshipNode:
      type: object
      required:
        - id
        - title
        - stateEnum
        - priorityId
      description: 'Узел графа: фокус, его прямой родитель или прямой дочерний INC.'
      properties:
        id:
          $ref: '#/components/schemas/IncidentId'
        title:
          type:
            - string
            - 'null'
          description: 'Заголовок из опубликованного снимка; `null`, если его нет.'
        stateEnum:
          anyOf:
            - $ref: '#/components/schemas/ItsmIncidentState'
            - type: 'null'
          description: 'Статус может быть недоступен только у существующего узла; `id` всегда заполнен.'
        priorityId:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          description: 'Исходный приоритет ITSM или `null`, если значение недоступно.'
      additionalProperties: false
    IncidentRelationshipEdge:
      type: object
      required:
        - parentId
        - childId
      properties:
        parentId:
          $ref: '#/components/schemas/IncidentId'
        childId:
          $ref: '#/components/schemas/IncidentId'
      additionalProperties: false
    IncidentRelationships:
      type: object
      required:
        - focusId
        - nodes
        - edges
      description: 'Один шаг в обе стороны от фокуса; рёбра ведут только от фокуса к родителю или детям.'
      properties:
        focusId:
          $ref: '#/components/schemas/IncidentId'
        nodes:
          type: array
          description: 'Фокус, прямой родитель (если есть) и прямые дети (если есть).'
          items:
            $ref: '#/components/schemas/IncidentRelationshipNode'
        edges:
          type: array
          description: 'Пустой список для известного INC без связей.'
          items:
            $ref: '#/components/schemas/IncidentRelationshipEdge'
      additionalProperties: false
    IncidentNotFound:
      type: object
      required:
        - code
        - message
        - eventSeq
        - revision
      properties:
        code:
          type: string
          const: INCIDENT_NOT_FOUND
        message:
          type: string
          minLength: 1
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
      additionalProperties: false
    SourceList:
      type: object
      required:
        - eventSeq
        - revision
        - sources
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
          description: Глобальная опубликованная ревизия изменений для интерфейса.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceStatus'
      additionalProperties: false
    SourceStatus:
      type: object
      required:
        - sourceId
        - kind
        - revision
        - sourceVersion
        - lastReceivedAt
        - lastSuccessAt
        - batchStatus
        - stale
        - staleAfterSeconds
      properties:
        sourceId:
          type: string
        kind:
          type: string
          enum:
            - ITCS
        revision:
          $ref: '#/components/schemas/PublishedRevision'
        sourceVersion:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: 'Последняя доставка. Не `revision` и не `eventSeq`.'
        lastReceivedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        lastSuccessAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        batchStatus:
          type:
            - string
            - 'null'
          enum:
            - RECEIVED
            - PROCESSING
            - SUCCEEDED
            - FAILED
            - null
          description: Статус последнего принятого пакета.
        stale:
          type: boolean
        staleAfterSeconds:
          type: integer
          minimum: 1
      additionalProperties: false
    IncidentChange:
      type: object
      required:
        - id
        - groupMemberships
      properties:
        id:
          $ref: '#/components/schemas/IncidentId'
        groupMemberships:
          type: array
          description: 'Группы INC после изменения; для `removed` — группы, в которых он был.'
          items:
            $ref: '#/components/schemas/IncidentGroupMembership'
      additionalProperties: false
    DashboardEvent:
      type: object
      required:
        - eventId
        - type
        - eventSeq
        - occurredAt
        - incident
      properties:
        eventId:
          type: string
          pattern: '^evt-[0-9]{4,}$'
        type:
          type: string
          enum:
            - upserted
            - removed
            - heartbeat
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Метка события; следующий опрос — с `nextEventSeq`.'
        occurredAt:
          $ref: '#/components/schemas/UtcInstant'
        incident:
          anyOf:
            - $ref: '#/components/schemas/IncidentChange'
            - type: 'null'
          description: '`null` только для `heartbeat`.'
      additionalProperties: false
    EventBatch:
      type: object
      required:
        - eventSeq
        - nextEventSeq
        - stale
        - source
        - events
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Текущий `eventSeq` публикации на момент ответа.'
        nextEventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Курсор следующего опроса (`0`, если продолжать нечем).'
        stale:
          type: boolean
          description: '`true` — данных нет давно; клиент показывает публикацию как устаревшую.'
        source:
          anyOf:
            - $ref: '#/components/schemas/SourceStatus'
            - type: 'null'
        events:
          type: array
          items:
            $ref: '#/components/schemas/DashboardEvent'
      additionalProperties: false
    EventAckRequest:
      type: object
      required:
        - eventIds
      properties:
        eventIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            pattern: '^evt-[0-9]{4,}$'
          description: 'Точный набор `eventId` из ответа `events`.'
      additionalProperties: false
    EventAck:
      type: object
      required:
        - eventSeq
        - confirmedEventIds
        - status
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Наивысший полностью подтверждённый `eventSeq`.'
        confirmedEventIds:
          type: array
          items:
            type: string
            pattern: '^evt-[0-9]{4,}$'
        status:
          type: string
          enum:
            - acknowledged
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
          minLength: 1
      additionalProperties: false
    SimilarIncidentSuggestions:
      type: object
      description: |
        Похожие INC для выбранного инцидента. Кандидаты упорядочены по убыванию оценки,
        при равенстве — по номеру; каждый номер встречается один раз. Чтение не создаёт
        связей между инцидентами.
      required:
        - incidentId
        - eventSeq
        - revision
        - candidates
      properties:
        incidentId:
          $ref: '#/components/schemas/IncidentId'
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
        candidates:
          type: array
          description: 'Пуст, когда у INC нет известного сервиса или совпадений в окне.'
          items:
            $ref: '#/components/schemas/SimilarIncidentCandidate'
      additionalProperties: false
    SimilarIncidentCandidate:
      type: object
      description: Один кандидат с объяснением совпадения.
      required:
        - incidentId
        - score
        - reasons
        - sharedAttributes
        - stateEnum
        - priorityId
        - submitDate
        - submitDifferenceSeconds
        - isDouble
        - isMaster
      properties:
        incidentId:
          $ref: '#/components/schemas/IncidentId'
        score:
          type: integer
          format: int32
          minimum: 0
          description: 'Сумма весов совпавших признаков: сервис 50, сценарий 20, код ошибки 30, близость времени 10 или 5.'
        reasons:
          type: array
          minItems: 1
          description: 'Человекочитаемые основания предложения, по одному на совпавший признак.'
          items:
            type: string
            minLength: 1
        sharedAttributes:
          $ref: '#/components/schemas/SimilarIncidentSharedAttributes'
        header:
          type:
            - string
            - 'null'
          description: Заголовок кандидата для быстрой оценки без открытия карточки.
        stateEnum:
          $ref: '#/components/schemas/ItsmIncidentState'
        priorityId:
          type: integer
          format: int32
        submitDate:
          $ref: '#/components/schemas/UtcInstant'
        submitDifferenceSeconds:
          type: integer
          format: int64
          minimum: 0
          description: 'Абсолютная разница регистраций кандидата и выбранного INC в секундах.'
        isDouble:
          type:
            - boolean
            - 'null'
          description: 'Флаг ITSM «дубль»; контекст, оценка его не использует.'
        isMaster:
          type:
            - boolean
            - 'null'
          description: 'Флаг ITSM «мастер для дублей»; контекст, оценка его не использует.'
      additionalProperties: false
    SimilarIncidentSharedAttributes:
      type: object
      description: 'Совпавшие признаки, использованные оценкой; признак без вклада — null.'
      required:
        - productName
        - service
        - scenarioName
        - errorCode
      properties:
        productName:
          type: string
        service:
          type: string
        scenarioName:
          type:
            - string
            - 'null'
        errorCode:
          type:
            - string
            - 'null'
          description: 'Значение атрибута `errorCode`, заданное и равное в обеих записях.'
      additionalProperties: false
