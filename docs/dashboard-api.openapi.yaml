openapi: 3.1.0
info:
  title: Dashboard — чтения координатора (KAN-7)
  version: 1.0.0
  description: |
    Канонический контракт чтений дашборда для KAN-7: список и группы инцидентов,
    карточка, статус источника, polling по `eventSeq` и подтверждение точного набора `eventId`.
    Согласован в KAN-20 с приёмом снимков (`itsm-ingest.openapi.yaml`, KAN-27/KAN-53).
    Контроллеров этих чтений пока нет: публикуются **примеры**, а не работающие маршруты.
    Примеры синтетические (INC `INC0000210955xx` не пересекаются с реальной выгрузкой),
    валидируются схемами и пригодны фронту до готовности БД.

    ## Один канонический маршрут для каждого чтения

    | Чтение | Маршрут | Следствие |
    | --- | --- | --- |
    | Список | `GET /api/dashboard/incidents` | группы через `group`; отдельного маршрута групп нет |
    | Карточка | `GET /api/dashboard/incidents/{incidentId}` | `incidentId` — строковый INC, URL-кодируется |
    | Статус источника | `GET /api/dashboard/sources` | все источники, включая stale |
    | Polling | `GET /api/dashboard/events?sinceEventSeq=` | события с `eventSeq > sinceEventSeq` |
    | Подтверждение | `POST /api/dashboard/events/ack` | точный набор `eventId`, без `since` и «до» |

    Статус снимка приёма (`GET /api/snapshot/status`, KAN-27) — отдельное операционное
    чтение; здесь не дублируется.

    ## Общие правила

    - **`id` — строка**: `INC000021095531`. Число в `id` — ошибка модели.
    - **Даты — UTC**, ISO-8601 с `Z`, до микросекунд. Исходные `YYYY-MM-DD HH:MM:SS` без зоны
      ITCS считает UTC (как парсер KAN-21).
    - **Nullable-поля** объявлены явно: `deadline` (карточка без срока), `completionDate` и
      `solution` (только у завершённых), `stateReason`, `lastAssignmentToTeamDateTime`,
      `group.fixed`, а также `revision` у источника до первой публикации.
    - **`revision`** — опубликованная версия источника, то же значение, что в
      `GET /api/snapshot/status`. «Снимок revision 42» означает, что блок ответа построен ровно
      из этой публикации.
    - **`eventSeq`** — счётчик изменений опубликованных данных, версия блока статуса. Его
      возвращают все чтения, в том числе `404`.
    - **`sourceVersion`** вида `X-Source-Version` — версия доставки отправителя. Не `revision`
      и не `eventSeq`: `202` не публикует данные, а несколько версий между опросами
      сворачиваются в одно изменение `eventSeq`.

    ## polling и ack

    `events` возвращает изменения с `eventSeq > sinceEventSeq` в порядке возрастания.
    `nextEventSeq` события: `upserted` — `revision`, после которой появилось изменение;
    `removed` — `eventSeq`, после которого INC исчез из полного снимка. `heartbeat`
    (пустой `changes`, `nextEventSeq` текущий) приходит раз в 30 с, чтобы соединение было
    видно как живое.

    Новая публикация revision N+1 увеличивает `eventSeq`, даже если набор INC не изменился:
    `eventSeq` версионирует блок статуса, а не содержимое снимка. Два изменения одного INC
    (например, обновление и удаление) — два разных `eventId` с разными `eventSeq`.

    `POST /events/ack` принимает **точный** список `eventId`, полученный в `events`.
    Подтверждённый `eventSeq` — наибольший `eventSeq`, при котором все события до него входят
    в подтверждённый набор; `confirmedEventIds` эхом повторяет принятый набор. Повторный `ack`
    с тем же набором — `200` без побочных эффектов. Неизвестный, чужой или уже вытесненный из
    журнала `eventId` — `400 ACK_EVENT_UNKNOWN`, ничего не подтверждается. «Подтвердить всё до
    N» не предусмотрено: клиент подтверждает только увиденное.

    ## Источник и свежесть

    `GET /api/dashboard/sources` описывает подключённый ITCS: `revision` опубликованной версии,
    `sourceVersion` последней доставки, `lastReceivedAt`/`lastSuccessAt`, `staleAfterSeconds`
    (по умолчанию 90 — три полных снимка по 30 с) и `stale`. Пока воркер не опубликовал снимок,
    `stale` остаётся `true`.

    ## Чтения и авторизация

    Оператор (интерфейс координатора) — сессия `cookieAuth`; машинный мониторинг источников —
    `machineBearer` (предлагается). В KAN-27 машинная цепочка с правом импорта действует
    только на `/api/integrations/itsm/**`.

    ## Ошибки

    JSON-ошибки — `ErrorResponse` (`code`, `message`), как во всём приложении. Развёрнутая
    цепочка UI для неаутентифицированного браузера отвечает редиректом формы (`302`); API-клиент
    с `Accept: application/json` получает `401 AUTH_REQUIRED`. Машинный Bearer без прав —
    `401 MACHINE_AUTH_REQUIRED` с `WWW-Authenticate: Bearer`.

security:
  - cookieAuth: []
  - machineBearer: []
paths:
  /api/dashboard/incidents:
    get:
      operationId: listIncidents
      summary: Список инцидентов и групп (KAN-7)
      description: |
        Единственный маршрут списка. `group` повторяется; без него — активные
        инциденты с группами. `includeCompleted=false` скрывает завершённые (`Resolved`, `Closed`,
        `Research`) строки, но группа «Исследование ситуации» остаётся. P4, назначенный
        координаторам, входит одновременно в `critical` и `coordinator`: объект в `items` один,
        `groupMemberships` перечисляет все группы.
      parameters:
        - name: group
          in: query
          description: 'Группа дашборда; повторяется для выбора нескольких. Неизвестная группа — `400 INVALID_GROUP`.'
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/IncidentGroupKey'
        - name: includeCompleted
          in: query
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          required: false
          description: 'Непрозрачный курсор из предыдущего `nextCursor`; без курсора — первая страница.'
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: Accept
          in: header
          required: false
          description: |
            `application/json` (по умолчанию). `text/csv` — плоская выгрузка: INC по
            строке без курсора и среза.
          schema:
            type: string
            enum:
              - application/json
              - text/csv
      responses:
        '200':
          description: Страница инцидентов с группами.
          headers:
            ETag:
              description: '`eventSeq` страницы; `If-None-Match` с ним даёт `304` без тела.'
