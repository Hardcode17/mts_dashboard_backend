  /api/dashboard/monitoring/summary:
    get:
      operationId: monitoringSummary
      summary: Сводка режима мониторинга (KAN-62)
      description: |
        Read-only снимок для большого экрана: текущие счётчики четырёх независимых категорий,
        распределение активных инцидентов по приоритетам, нагрузка на координаторов и
        таймлайн фактических публикаций за последние 24 часа. Категории могут пересекаться.
        `activeCount` — только `Assigned` и `WorkInProgress`; `research` в него не входит.
        Таймлайн отсортирован по `at`, затем по порядку публикации. Точки не синтезируются:
        без опубликованных снимков за окно возвращается `[]`, а `updatedAt` = `null`, пока
        не было ни одной успешной публикации. `priorities` содержит только встреченные
        приоритеты активных инцидентов; `coordinatorLoad` — только назначенных координаторов,
        по убыванию нагрузки, затем по имени.
      security:
        - humanBearer: []
        - cookieAuth: []
        - localBasic: []
      responses:
        '200':
          description: Текущая сводка и ограниченная 24-часовой таймлайн-историей.
          headers:
            Cache-Control:
              description: '`no-store`: экран опрашивает маршрут каждые 5 секунд.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringSummary'
              examples:
                active:
                  summary: Сводка с пересекающимися категориями и двумя точками истории
                  value:
                    updatedAt: '2026-11-21T09:05:01.000000Z'
                    activeCount: 4
                    counts:
                      critical: 2
                      high: 1
                      coordinators: 2
                      research: 1
                    timeline:
                      - at: '2026-11-21T09:04:31.000000Z'
                        critical: 2
                        high: 1
                        coordinators: 2
                        research: 1
                      - at: '2026-11-21T09:05:01.000000Z'
                        critical: 2
                        high: 1
                        coordinators: 2
                        research: 1
                    priorities:
                      - priorityId: 1
                        count: 1
                      - priorityId: 3
                        count: 1
                      - priorityId: 4
                        count: 2
                    coordinatorLoad:
                      - name: Буратино (buratino)
                        count: 1
                      - name: Дядя Фёдор (unclefedor)
                        count: 1
                beforeFirstSuccess:
                  summary: Публикаций ещё не было — история пуста, ничего не выдумываем
                  value:
                    updatedAt: null
                    activeCount: 0
                    counts:
                      critical: 0
                      high: 0
                      coordinators: 0
                      research: 0
                    timeline: []
                    priorities: []
                    coordinatorLoad: []
        '401':
          description: Нет допустимой сессии или человеческого токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
  '/api/incidents/{id}/relationships':
    get:
      operationId: getIncidentRelationships
      summary: Связи инцидента для графа карточки (KAN-66)
      description: |
        Один шаг в обе стороны от `focusId`: сам инцидент, его непосредственный родитель и
        непосредственные дети. `nodes` не содержит соседей другого уровня; `edges` содержит
        только рёбра между `focusId` и его прямым родителем/детьми. Известный INC без связей
        возвращает один узел и пустой `edges`. Неизвестный опубликованный INC — `404`.
        Для существующих узлов `title`, `stateEnum` и `priorityId` могут быть `null`; `id` — нет.
      security:
        - humanBearer: []
        - cookieAuth: []
        - localBasic: []
      parameters:
        - name: id
          in: path
          required: true
          description: 'Строковый INC фокуса, URL-кодируется; числовой вид не принимается.'
          schema:
            $ref: '#/components/schemas/IncidentId'
          examples:
            parent:
              value: "INC000021095531"
      responses:
        '200':
          description: 'Граф глубины один: фокус, прямой родитель и прямые дети.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentRelationships'
              examples:
                parentWithChildren:
                  summary: 'Фокус — родитель двух дочерних INC'
                  value:
                    focusId: INC000021095531
                    nodes:
                      - id: INC000021095531
                        title: Оплата · Отказ камеры
                        stateEnum: Assigned
                        priorityId: 4
                      - id: INC000021095532
                        title: Оплата · Очередь платежей
                        stateEnum: WorkInProgress
                        priorityId: 4
                      - id: INC000021095533
                        title: Оплата · Повторные списания
                        stateEnum: Assigned
                        priorityId: 3
                    edges:
                      - parentId: INC000021095531
                        childId: INC000021095532
                      - parentId: INC000021095531
                        childId: INC000021095533
                childWithParent:
                  summary: 'Фокус — дочерний INC; виден только прямой родитель'
                  value:
                    focusId: INC000021095532
                    nodes:
                      - id: INC000021095532
                        title: Оплата · Очередь платежей
                        stateEnum: WorkInProgress
                        priorityId: 4
                      - id: INC000021095531
                        title: Оплата · Отказ камеры
                        stateEnum: Assigned
                        priorityId: 4
                    edges:
                      - parentId: INC000021095531
                        childId: INC000021095532
                unrelated:
                  summary: 'Известный INC без связей: один узел и пустой список рёбер'
                  value:
                    focusId: INC000021095540
                    nodes:
                      - id: INC000021095540
                        title: null
                        stateEnum: Research
                        priorityId: null
                    edges: []
        '400':
          description: Идентификатор не в формате INC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidIncidentId:
                  summary: Идентификатор не в формате INC
                  value: {"code": "INVALID_INCIDENT_ID", "message": "incidentId must be an INC identifier such as INC000021095531"}
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
        '403':
          description: Токен или сессия без нужного права.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                coordinatorAccessDenied:
                  summary: Нет локального допуска координатора
                  value: {"code": "COORDINATOR_ACCESS_DENIED", "message": "Coordinator access is not granted"}
        '404':
          description: Инцидент отсутствует в опубликованной версии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentNotFound'
              examples:
                notFound:
                  summary: INC отсутствует в опубликованной версии
                  value:
                    code: INCIDENT_NOT_FOUND
                    message: Incident INC000021095599 not found
                    eventSeq: 43
                    revision: 42
  /api/dashboard/sources:
    get:
      operationId: listSources
      summary: Статус источников и свежесть публикации (KAN-7)
      description: |
        Все источники, включая stale. `revision` — опубликованная ревизия изменений,
        `sourceVersion` — последняя доставка (не путать ни с `revision`, ни с `eventSeq`). `stale` —
        `true`, пока последняя доставка не опубликована, или последний приём старше
        `staleAfterSeconds` (при снимке каждые 30 с — пропуск до трёх тиков).
      responses:
        '200':
          description: Источники.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'
              examples:
                published:
                  summary: Свежий опубликованный снимок (fixture sources-published)
                  x-fixture: sources-published
                  value:
                    eventSeq: 43
                    revision: 42
                    sources:
                      - sourceId: itcs-prod
                        kind: ITCS
                        revision: 42
                        sourceVersion: 42
                        lastReceivedAt: '2026-11-21T09:05:00.123456Z'
                        lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                        batchStatus: SUCCEEDED
                        stale: false
                        staleAfterSeconds: 90
                stale:
                  summary: 'Снимок принят, успеха воркера нет — stale (fixture sources-stale)'
                  x-fixture: sources-stale
                  value:
                    eventSeq: 43
                    revision: 42
                    sources:
                      - sourceId: itcs-prod
                        kind: ITCS
                        revision: 42
                        sourceVersion: 43
                        lastReceivedAt: '2026-11-21T09:08:35.250000Z'
                        lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                        batchStatus: RECEIVED
                        stale: true
                        staleAfterSeconds: 90
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                machineAuthRequired:
                  summary: Нет или невалиден машинный Bearer
                  value: {"code": "MACHINE_AUTH_REQUIRED", "message": "Machine bearer token is required"}
  /api/dashboard/events:
    get:
      operationId: pollEvents
      summary: Polling изменений по eventSeq (KAN-7)
      description: |
        События с `eventSeq > sinceEventSeq`, по возрастанию. Два события одного INC
        (обновление и удаление) приходят разными `eventId` и `eventSeq`.
      parameters:
        - name: sinceEventSeq
          in: query
          required: true
          description: 'Последний обработанный `eventSeq`; `0` — с начала.'
          schema:
            $ref: '#/components/schemas/EventSeq'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Изменения.
          headers:
            ETag:
              description: '`eventSeq` выборки; `If-None-Match` с ним даёт `304`, когда новых событий нет.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatch'
              examples:
                twoEventsSameIncident:
                  summary: Обновление и удаление одного INC — два eventId (fixture events-poll-two-events)
                  x-fixture: events-poll-two-events
                  value:
                    eventSeq: 43
                    nextEventSeq: 43
                    stale: false
                    source:
                      sourceId: itcs-prod
                      kind: ITCS
                      revision: 42
                      sourceVersion: 42
                      lastReceivedAt: '2026-11-21T09:05:00.123456Z'
                      lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                      batchStatus: SUCCEEDED
                      stale: false
                      staleAfterSeconds: 90
                    events:
                      - eventId: evt-0002
                        type: upserted
                        eventSeq: 43
                        occurredAt: '2026-11-21T09:05:00.500000Z'
                        incident:
                          id: INC000021095533
                          groupMemberships:
                            - group: high
                              matchedRule: priorityId = 3
                      - eventId: evt-0003
                        type: removed
                        eventSeq: 43
                        occurredAt: '2026-11-21T09:05:00.500000Z'
                        incident:
                          id: INC000021095533
                          groupMemberships:
                            - group: high
                              matchedRule: priorityId = 3
                heartbeat:
                  summary: 'Изменений нет, событие-сердцебиение (fixture events-heartbeat)'
                  x-fixture: events-heartbeat
                  value:
                    eventSeq: 43
                    nextEventSeq: 43
                    stale: false
                    source:
                      sourceId: itcs-prod
                      kind: ITCS
                      revision: 42
                      sourceVersion: 42
                      lastReceivedAt: '2026-11-21T09:05:00.123456Z'
                      lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                      batchStatus: SUCCEEDED
                      stale: false
                      staleAfterSeconds: 90
                    events:
                      - eventId: evt-0004
                        type: heartbeat
                        eventSeq: 43
                        occurredAt: '2026-11-21T09:05:00.500000Z'
                        incident: null
        '304':
          description: 'С указанного `eventSeq` изменений не было.'
        '400':
          description: Некорректный запрос.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSinceEventSeq:
                  summary: Обязательный sinceEventSeq отсутствует
                  value: {"code": "INVALID_EVENT_SEQ", "message": "sinceEventSeq is required"}
                eventSeqOverflow:
                  summary: sinceEventSeq вне int64
                  value: {"code": "INVALID_EVENT_SEQ", "message": "sinceEventSeq must be in [0, 9223372036854775807]"}
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
  /api/dashboard/events/ack:
    post:
      operationId: acknowledgeEvents
      summary: Подтвердить точный набор eventId (KAN-7)
      description: |
        Идемпотентно: повтор того же набора — тот же `200` и `eventSeq`. Порядок не
        важен. Набор сравнивается целиком: неизвестный, чужой или уже вытесненный `eventId` —
        `400 ACK_EVENT_UNKNOWN`, и ничего не подтверждается.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventAckRequest'
            examples:
              twoEvents:
                summary: Оба события INC000021095533 (fixture events-ack-request)
                x-fixture: events-ack-request
                value:
                  eventIds:
                    - evt-0002
                    - evt-0003
      responses:
        '200':
          description: 'Набор подтверждён; `eventSeq` — подтверждённая позиция.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAck'
              examples:
                twoEvents:
                  summary: Подтверждены evt-0002 и evt-0003 (fixture events-ack-response)
                  x-fixture: events-ack-response
                  value:
                    eventSeq: 43
                    confirmedEventIds:
                      - evt-0002
                      - evt-0003
                    status: acknowledged
        '400':
          description: Некорректный набор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownEvent:
                  summary: eventId не входит в журнал
                  value: {"code": "ACK_EVENT_UNKNOWN", "message": "Unknown eventId evt-0009"}
                emptySet:
                  summary: Пустой набор eventId
                  value: {"code": "ACK_EVENTS_INVALID", "message": "eventIds must contain 1-1000 unique ids"}
                duplicateIds:
                  summary: Повтор внутри набора eventId
                  value: {"code": "ACK_EVENTS_INVALID", "message": "eventIds must contain no duplicates"}
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
  '/api/dashboard/coordination-tasks/{taskId}/redirect':
    post:
      operationId: redirectCoordinationTask
      security: [{coordinatorBearer: []}]
      summary: Перенаправить открытую задачу в другую группу (KAN-44)
      description: |
        Владелец из исходной группы указывает причину, группу назначения и ID действующего
        назначения. Для первого перенаправления из общего пула передаётся 0 и указывается группа
        владельца. Задача остаётся открытой, новый владелец берёт её вручную.
      parameters:
        - {$ref: '#/components/parameters/CoordinationTaskId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceGroupId, targetGroupId, expectedAssignmentId, reason]
              properties:
                sourceGroupId: {type: integer, format: int64, minimum: 1}
                targetGroupId: {type: integer, format: int64, minimum: 1}
                expectedAssignmentId: {type: integer, format: int64, minimum: 0}
                reason: {type: string, minLength: 1, maxLength: 1000}
            examples:
              redirect:
                summary: Передача из общего пула
                value: {sourceGroupId: 1, targetGroupId: 2, expectedAssignmentId: 0, reason: Передача следующей смене}
      responses:
        '200':
          description: Активное назначение на новую группу.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoordinationTaskAssignment'}
              examples:
                assigned:
                  summary: Задача в очереди новой группы
                  value: {assignmentId: 2, groupId: 2, groupName: Вторая смена, status: assigned, assignedByUserId: 10, assignedAt: '2026-11-21T12:00:00Z', endedAt: null, redirectedByUserId: null, redirectReason: null}
        '400':
          description: Некорректный запрос или группа назначения.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalid:
                  summary: Группа назначения недоступна
                  value: {code: COORDINATION_REDIRECT_INVALID, message: Invalid coordination task redirect}
        '401':
          description: Требуется токен координатора.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missing:
                  summary: Токен отсутствует
                  value: {code: HUMAN_AUTH_REQUIRED, message: Human access token is required}
        '403':
          description: Недостаточно прав для перенаправления.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                forbidden:
                  summary: Действие недоступно координатору
                  value: {code: COORDINATION_REDIRECT_FORBIDDEN, message: Coordination task is not available to this coordinator}
        '404':
          description: Открытая задача не найдена.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                notOpen:
                  summary: Задача уже закрыта
                  value: {code: COORDINATION_TASK_NOT_OPEN, message: Open coordination task not found}
        '409':
          description: Действующее назначение сменилось.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                changed:
                  summary: Повтор запроса со старым назначением
                  value: {code: COORDINATION_ASSIGNMENT_CHANGED, message: Coordination assignment has changed}
  '/api/dashboard/coordination-tasks/{taskId}/assignments':
