openapi: 3.1.0
info:
  title: Dashboard — чтения координатора (KAN-7)
  version: 1.0.0
  description: |
    Канонический контракт чтений дашборда: список и группы инцидентов, карточка и её связи,
    статус источника, polling по `eventSeq`, подтверждения и сводка мониторинга за 24 часа.
    Согласован в KAN-20 с приёмом снимков (`itsm-ingest.openapi.yaml`, KAN-27/KAN-53).
    Список, карточка и связи читаются из опубликованных снимков. Для статуса источника, polling и
    подтверждений в этой спецификации пока приведены только примеры.
    Спецификация также описывает личные подключения каналов уведомлений (KAN-36)
    и доставку уведомлений по этим каналам (KAN-35).
    Примеры синтетические (INC `INC0000210955xx` не пересекаются с реальной выгрузкой),
    валидируются схемами и пригодны фронту до готовности БД.

    ## Один канонический маршрут для каждого чтения

    | Чтение | Маршрут | Следствие |
    | --- | --- | --- |
    | Список | `GET /api/dashboard/incidents` | группы через `group`; отдельного маршрута групп нет |
    | Карточка | `GET /api/dashboard/incidents/{incidentId}` | `incidentId` — строковый INC, URL-кодируется |
    | Мониторинг | `GET /api/dashboard/monitoring/summary` | текущие счётчики + только фактические публикации за 24 ч |
    | Связи карточки | `GET /api/incidents/{id}/relationships` | `id` — строковый INC фокуса; глубина один шаг |
    | Заметки | `GET /api/dashboard/incidents/{incidentId}/notes` | хронология заметок одного INC по `eventSeq` (KAN-43) |
    | Статус источника | `GET /api/dashboard/sources` | все источники, включая stale |
    | Polling | `GET /api/dashboard/events?sinceEventSeq=` | события с `eventSeq > sinceEventSeq` |
    | Подтверждение | `POST /api/dashboard/events/ack` | точный набор `eventId`, без `since` и «до» |
    | Уведомления | `GET /api/dashboard/notifications` | свои уведомления и доставки, без адресов |
    | Чтение в приложении | `POST /api/dashboard/notifications/{id}/read` | отдельно от чтения в канале |
    | Повтор доставки | `POST /api/dashboard/notifications/deliveries/{id}/retry` | только упавшей, идемпотентно |

    Статус снимка приёма (`GET /api/snapshot/status`, KAN-27) — отдельное операционное
    чтение; здесь не дублируется.

    ## Общие правила

    - **`id` — строка**: `INC000021095531`. Число в `id` — ошибка модели.
    - **Даты — UTC**, ISO-8601 с `Z`, до микросекунд. Исходные `YYYY-MM-DD HH:MM:SS` без зоны
      ITCS считает UTC (как парсер KAN-21).
    - **Nullable-поля** объявлены явно: `deadline` (карточка без срока), `completionDate` и
      `solution` (только у завершённых), `stateReason`, `lastAssignmentToTeamDateTime`,
      `group.fixed`, а также `revision` у источника до первой публикации.
    - **`revision`** — опубликованная ревизия изменений, то же значение, что в
      `GET /api/snapshot/status`. «Снимок revision 42» означает, что блок ответа построен ровно
      из этой публикации.
    - **`eventSeq`** — счётчик публикаций, версия блока статуса. Список и карточка
      берут его из подтверждённых публикаций (в том числе без изменений содержимого);
      при приёме пакета без публикации счётчик не меняется. Его возвращают все чтения,
      в том числе `404`.
    - **`sourceVersion`** вида `X-Source-Version` — версия доставки отправителя. Не `revision`
      и не `eventSeq`: `202` не публикует данные, а несколько версий доставки между
      опросами сворачиваются в одну публикацию с новым `eventSeq`.

    ## polling и ack

    `events` возвращает изменения с `eventSeq > sinceEventSeq` в порядке возрастания.
    `nextEventSeq` события: `upserted` — `revision`, после которой появилось изменение;
    `removed` — `eventSeq`, после которого INC исчез из полного снимка. `heartbeat`
    (пустой `changes`, `nextEventSeq` текущий) приходит раз в 30 с, чтобы соединение было
    видно как живое.

    Новая публикация revision N+1 увеличивает `eventSeq`, даже если набор INC не изменился:
    `eventSeq` версионирует блок статуса, а не содержимое снимка. Два изменения одного INC
    (например, обновление и удаление) — два разных `eventId` с разными `eventSeq`.

    `POST /events/ack` принимает **точный** список `eventId`, полученный в `events`.
    Подтверждённый `eventSeq` — наибольший `eventSeq`, при котором все события до него входят
    в подтверждённый набор; `confirmedEventIds` эхом повторяет принятый набор. Повторный `ack`
    с тем же набором — `200` без побочных эффектов. Неизвестный, чужой или уже вытесненный из
    журнала `eventId` — `400 ACK_EVENT_UNKNOWN`, ничего не подтверждается. «Подтвердить всё до
    N» не предусмотрено: клиент подтверждает только увиденное.

    ## уведомления и доставка (KAN-35)

    Одно значимое событие даёт одному адресату одно уведомление и отдельную строку доставки
    на каждое разрешённое подключение (KAN-36). Состояние доставки — самый сильный известный
    сигнал: `unknown` (сигнала нет), `sent`, `delivered`, `read_in_app` (адресат прочитал
    уведомление в приложении дашборда), `read_in_channel` (канал сообщил о чтении); `failed`
    — ошибка попытки. Чтение в приложении и чтение в канале независимы и не подменяют друг
    друга. Повторить можно только `failed`: повтор любого другого состояния — идемпотентный
    no-op без новой отправки, одновременные повторы одной доставки дают одну новую попытку.
    Причина ошибки — короткий код (`channel_rejected_503` и т.п.), без адресов, токенов и URL.
    Состояние сохраняется в БД и переживает рестарт backend.

    ## Заметки смены (KAN-43)

    `POST /api/dashboard/incidents/{incidentId}/notes` сохраняет заметку координатора об INC.
    Автор берётся из проверенного токена (локальный допуск KAN-22); поле `authorId` в теле —
    необязательное эхо, при несовпадении с автором токена запись отвергается целиком
    (`403 INCIDENT_NOTE_AUTHOR_MISMATCH`), без записи и без продвижения `eventSeq`. Пустой
    текст — `400 INCIDENT_NOTE_TEXT_INVALID`, неизвестный INC — `404 INCIDENT_NOT_FOUND`.
    Событие заметки вида `NOTE_ADDED` видно в `/api/dashboard/incidents/changes` и `/history` с тем же `eventSeq`.
    Событие заметки получает собственный `eventSeq` из общей последовательности хронологии
    KAN-28 и не меняет опубликованный `revision` снимка ITSM. `GET` того же маршрута возвращает
    историю заметок INC страницами по `eventSeq` (`afterEventSeq` + `limit`), поэтому смена
    видит все заметки с авторами и временами наблюдения, а параллельные заметки с одной
    отметкой времени получают разные `eventSeq` в одном ответе.

    ## Источник и свежесть

    `GET /api/dashboard/sources` описывает подключённый ITCS: `revision` опубликованной версии,
    `sourceVersion` последней доставки, `lastReceivedAt`/`lastSuccessAt`, `staleAfterSeconds`
    (по умолчанию 90 — три полных снимка по 30 с) и `stale`. Пока воркер не опубликовал снимок,
    `stale` остаётся `true`.

    ## Чтения и авторизация

    Список, карточка и связи используют человеческий Bearer JWT (KAN-16), если он настроен;
    иначе действуют локальные форма входа и HTTP Basic. Машинный мониторинг источников —
    `machineBearer` (предлагается). В KAN-27 машинная цепочка с правом импорта действует
    только на `/api/integrations/itsm/**`.

    ## Подключение браузерного SPA (KAN-64)

    Фронтенд (React + Vite) ходит на `/api/**` со своего origin и авторизуется
    Authorization Code + PKCE через публичный клиент `dashboard-web`; полученный access
    token отправляется в `Authorization: Bearer`. Кросс-доменные запросы браузера
    обслуживает CORS-конфигурация человеческой цепочки:

    - разрешённые origins — env `APP_CORS_ALLOWED_ORIGINS` (через запятую), по умолчанию
      dev-origins `http://localhost:3000,http://localhost:5173`;
    - методы `GET/POST/PATCH/PUT/DELETE/OPTIONS`; заголовки запроса `Authorization`,
      `Content-Type`, `If-None-Match`, `X-Request-Id`; preflight `OPTIONS` проходит без
      аутентификации и кешируется на час;
    - браузеру доступны заголовки ответа `ETag`, `Location`, `X-Request-Id`;
    - чужой origin не получает `Access-Control-Allow-Origin` (403 без CORS-заголовков);
      ответ без токена — `401`.

    Машинная цепочка `/api/integrations/itsm/**` CORS не открывает: приём снимков —
    серверный маршрут вне браузера. Подробности подключения — `docs/spa-access.md`.

    ## Ошибки

    JSON-ошибки — `ErrorResponse` (`code`, `message`), как во всём приложении. Развёрнутая
    локальная цепочка UI для неаутентифицированного браузера отвечает редиректом формы (`302`);
    клиент с `Accept: application/json` получает `401 AUTH_REQUIRED`. При настроенном человеческом
    Bearer JWT отсутствие допустимого токена также даёт `401 AUTH_REQUIRED`. Машинный Bearer без прав —
    `401 MACHINE_AUTH_REQUIRED` с `WWW-Authenticate: Bearer`.

security:
  - cookieAuth: []
  - machineBearer: []
paths:
  /api/me:
    get:
      operationId: getCurrentCoordinator
      security: [{coordinatorBearer: []}]
      summary: Текущий координатор и доступность для назначений
      responses:
        '200':
          description: Текущий профиль и активные рабочие группы координатора.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentCoordinator'
              examples:
                coordinator:
                  summary: Профиль нового координатора с рабочей группой
                  value:
                    subject: demo-coordinator
                    username: coordinator
                    name: Дежурный координатор
                    email: null
                    audience: [dashboard-api]
                    id: 1
                    sub: demo-coordinator
                    login: coordinator
                    displayName: Дежурный координатор
                    availability:
                      available: false
                      availableSince: null
                      generation: 0
                      groups: [{id: 1, name: Дежурные координаторы}]
        '401':
          description: Требуется человеческий Bearer JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingBearer:
                  summary: Запрос без токена
                  value: {code: HUMAN_AUTH_REQUIRED, message: Human access token is required}
        '403':
          description: Профиль не имеет доступа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                denied:
                  summary: У аккаунта нет допуска
                  value: {code: COORDINATOR_ACCESS_DENIED, message: Coordinator access is not granted}
  /api/me/availability:
    put:
      operationId: setCurrentCoordinatorAvailability
      security: [{coordinatorBearer: []}]
      summary: Изменить собственную доступность для новых назначений (KAN-30)
      description: |
        Нужны активная учётная запись и членство хотя бы в одной активной рабочей
        группе. Выбор действует во всех активных группах координатора. Повтор той же
        команды не меняет момент последнего включения или счётчик включений.
        Выключение не влияет на допуск к приложению, членство или текущее назначение.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [available]
              properties:
                available:
                  type: boolean
            examples:
              activate:
                summary: Включение доступности
                value: {available: true}
      responses:
        '200':
          description: Сохранённая доступность текущего координатора.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinatorAvailability'
              examples:
                activated:
                  summary: Подтверждённое включение
                  value:
                    available: true
                    availableSince: '2026-11-21T14:30:00Z'
                    generation: 1
                    groups: [{id: 1, name: Дежурные координаторы}]
        '400':
          description: Тело отсутствует, содержит неверное значение или лишние поля.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                badBody:
                  summary: Недопустимое тело запроса
                  value: {code: INVALID_REQUEST_BODY, message: Request body is malformed or missing}
        '401':
          description: Требуется человеческий Bearer JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingBearer:
                  summary: Запрос без токена
                  value: {code: HUMAN_AUTH_REQUIRED, message: Human access token is required}
        '403':
          description: Профиль заблокирован либо нет активного членства в рабочей группе.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingMembership:
                  summary: Нет активной рабочей группы
                  value: {code: COORDINATOR_GROUP_REQUIRED, message: Active coordinator group membership is required}
  /api/dashboard/incidents:
    get:
      operationId: listIncidents
      security: [{coordinatorBearer: []}]
      summary: Список инцидентов и групп (KAN-7, KAN-26)
      description: |
        Единственный маршрут списка. Без `group` — все опубликованные `Assigned` и
        `WorkInProgress`, а также `Research`: он остаётся видимым в своей группе. С `group`
        (параметр повторяется) `items` содержит объединение выбранных групп без дублей.
        `includeCompleted=false` скрывает `Resolved` и `Closed`, но не `Research`. P4 на координаторах входит
        одновременно в `critical` и `coordinator`; `groupMemberships` всегда содержит все группы INC.

        Группы и все переданные фильтры пересекаются. Сортировка применяется ко всей выборке
        перед пагинацией. На первой странице счётчики групп относятся ко всей отфильтрованной
        выборке, а `incidents` — только к этой странице. Невыбранные группы пусты. На следующих
        страницах `groups` пуст. CSV применяет те же фильтры и сортировку.
      parameters:
        - name: group
          in: query
          description: 'Группа дашборда; повторяется для выбора нескольких. Неизвестная группа — `400 INVALID_GROUP`.'
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/IncidentGroupKey'
        - name: includeCompleted
          in: query
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          required: false
          description: 'Непрозрачный курсор из предыдущего `nextCursor`, действует для той же публикации и параметров. Без курсора — первая страница; после `INVALID_CURSOR` начните с неё.'
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: q
          in: query
          description: |
            Полный номер INC ищется по точному совпадению без учёта регистра.
            Для текста все слова должны встречаться в номере, заголовке, продукте
            или назначенной команде без учёта регистра.
          schema:
            type: string
        - name: priority
          in: query
          description: Числовой приоритет из снимка ITSM.
          schema:
            type: integer
            minimum: 1
            maximum: 4
        - name: product
          in: query
          description: Точное совпадение названия продукта.
          schema:
            type: string
        - name: team
          in: query
          description: Точное совпадение названия назначенной команды.
          schema:
            type: string
        - name: state
          in: query
          description: Значение `stateEnum` из ITSM. Для завершённых INC нужен `includeCompleted=true`.
          schema:
            type: string
            enum: [Assigned, WorkInProgress, Resolved, Closed, Research]
        - name: serviceType
          in: query
          description: Точное совпадение типа сервиса.
          schema:
            type: string
        - name: deadline
          in: query
          description: |
            `none` — срок отсутствует. `late` — срок активного INC строго раньше времени
            сервера. `near` — срок активного INC от времени сервера до 20 минут вперёд
            включительно. Если состав выборки изменился со временем, обновите первую страницу.
          schema:
            type: string
            enum: [none, late, near]
        - name: sort
          in: query
          description: |
            `updated` — по времени обновления, затем по `id`. Если исходное
            `updatedAt` отсутствует, учитывается время изменения на публикации,
            затем самая поздняя из дат регистрации, назначения и устранения.
            `registered` — по убыванию даты регистрации, затем по `id`.
            `deadline` — активные P4 первыми, затем по убыванию приоритета,
            сроку от ближайшего (пустые сроки в конце), дате регистрации и `id` по возрастанию.
          schema:
            type: string
            enum: [updated, registered, deadline]
            default: updated
        - name: Accept
          in: header
          required: false
          description: |
            `application/json` (по умолчанию). `text/csv` — плоская выгрузка: INC по
            строке без курсора и среза.
          schema:
            type: string
            enum:
              - application/json
              - text/csv
      responses:
        '200':
          description: Страница инцидентов с группами.
          headers:
            ETag:
              description: 'ETag учитывает `eventSeq`, параметры представления и состав выборки для `late` и `near`. Передайте его в `If-None-Match` для проверки на `304`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentList'
              examples:
                defaultList:
                  summary: 'Критические и группы. P4 в двух группах, INC без срока, research и завершённый INC (fixture list-default)'
                  x-fixture: list-default
                  value:
                    eventSeq: 43
                    revision: 42
                    beforeFirstSuccess: false
                    groups:
                      - key: critical
                        title: Критические
                        rule: Активный инцидент с priorityId = 4
                        active: true
                        incidentCount: 2
                        incidents:
                          - id: INC000021095531
                            productName: Оплата заказов
                            assignedGroupName: КЦ ИТ Координаторы Массовых Инцидентов
                            stateEnum: Assigned
                            priorityId: 4
                            submitDate: '2026-11-21T09:00:00Z'
                            deadline: '2026-11-21T12:00:00Z'
                            completionDate: null
                            groupMemberships:
                              - group: coordinator
                                matchedRule: assignedToCoordinators
                              - group: critical
                                matchedRule: priorityId = 4
                          - id: INC000021095532
                            productName: Оплата заказов
                            assignedGroupName: КЦ ИТ Координаторы Массовых Инцидентов
                            stateEnum: WorkInProgress
                            priorityId: 4
                            submitDate: '2026-11-21T09:01:00Z'
                            deadline: null
                            completionDate: null
                            groupMemberships:
                              - group: coordinator
                                matchedRule: assignedToCoordinators
                              - group: critical
                                matchedRule: priorityId = 4
                        fixed: null
                      - key: coordinator
                        title: На координаторах
                        rule: 'Активный инцидент или Research, назначенный на координаторов'
                        active: true
                        incidentCount: 3
                        incidents:
                          - id: INC000021095531
                            productName: Оплата заказов
                            assignedGroupName: КЦ ИТ Координаторы Массовых Инцидентов
                            stateEnum: Assigned
                            priorityId: 4
                            submitDate: '2026-11-21T09:00:00Z'
                            deadline: '2026-11-21T12:00:00Z'
                            completionDate: null
                            groupMemberships:
                              - group: coordinator
                                matchedRule: assignedToCoordinators
                              - group: critical
                                matchedRule: priorityId = 4
                          - id: INC000021095532
                            productName: Оплата заказов
                            assignedGroupName: КЦ ИТ Координаторы Массовых Инцидентов
                            stateEnum: WorkInProgress
                            priorityId: 4
