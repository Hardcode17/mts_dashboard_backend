  '/api/incidents/{incidentId}/investigations/{runId}':
    get:
      operationId: getIncidentInvestigation
      security: [{coordinatorBearer: []}]
      summary: Прочитать запуск AI-расследования (KAN-40)
      description: |
        Возвращает один запуск: статус, привязанную `revision`, собранные факты со
        свидетельствами, явные пробелы, а для `completed` — гипотезу и следующий шаг.
        `stale` вычисляется при чтении: `true` означает, что опубликована более новая
        ревизия и ответ описывает старое состояние INC; сам ответ при этом сохранён и
        остаётся доступным. Запуск `failed` несёт явный код и причину ошибки вместо
        выдуманного ответа. Чужой `runId` (другой INC или несуществующий) — `404
        AI_RUN_NOT_FOUND`.
