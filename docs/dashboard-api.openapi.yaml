                        code: MCP_EVIDENCE_SOURCE_UNAVAILABLE
                        reason: 'Evidence source LOG is unavailable: connection failed or no record in the evidence window'
                    errorCode: null
                    errorMessage: null
                    createdAt: '2026-11-20T10:00:31.123456Z'
                    finishedAt: '2026-11-20T10:00:33.654321Z'
        '400':
          description: Идентификатор не в формате INC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidIncidentId:
                  summary: Идентификатор не в формате INC
                  value: {"code": "INVALID_INCIDENT_ID", "message": "incidentId must be an INC identifier such as INC000021095531"}
        '401':
          description: Требуется Bearer JWT координатора.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authRequired:
                  summary: Нет Bearer JWT
                  value: {"code": "HUMAN_AUTH_REQUIRED", "message": "Human access token is required"}
        '403':
          description: Нет локального допуска.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                coordinatorAccessDenied:
                  summary: Токен без локального допуска координатора
                  value: {"code": "COORDINATOR_ACCESS_DENIED", "message": "Coordinator access is not granted"}
        '404':
          description: Запуск не найден у этого INC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                runNotFound:
                  summary: runId не существует или принадлежит другому INC
                  value: {"code": "AI_RUN_NOT_FOUND", "message": "Investigation run 00000000-0000-0000-0000-000000000000 of incident INC0000420001 not found"}
components:
  securitySchemes:
    coordinatorBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Токен координатора Keycloak (`azp=dashboard-web`); после проверки подписи требуется локальный допуск (KAN-16, KAN-22). Токен импорта не подходит.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: 'Сессия интерфейса координатора; неаутентифицированный браузер перенаправляется на форму входа (`302`).'
    machineBearer:
      type: http
      scheme: bearer
      x-prospective: true
      description: |
        Предлагается, не развёрнуто: JWT Keycloak для машинного мониторинга.
        Проверяются `iss`, подпись JWKS, `exp`, `aud`; остальное — как `machineBearer` в
        `itsm-ingest.openapi.yaml`.
  parameters:
    CoordinationTaskId:
      name: taskId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
  schemas:
    CoordinationTaskAssignment:
      type: object
      required: [assignmentId, groupId, groupName, status, assignedByUserId, assignedAt, endedAt, redirectedByUserId, redirectReason]
      properties:
        assignmentId: {type: integer, format: int64}
        groupId: {type: integer, format: int64}
        groupName: {type: string}
        status: {type: string, enum: [assigned, redirected, completed]}
        assignedByUserId: {type: integer, format: int64}
        assignedAt: {$ref: '#/components/schemas/UtcInstant'}
        endedAt:
          anyOf:
            - {$ref: '#/components/schemas/UtcInstant'}
            - {type: 'null'}
        redirectedByUserId: {type: [integer, 'null'], format: int64}
        redirectReason: {type: [string, 'null'], maxLength: 1000}
    NotificationChannel:
      type: string
      enum: [email, sms, push, telegram, mattermost, max, mts_link, mobile_hub, mts_notifica]
    NotificationAddress:
      type: string
      pattern: '^[a-zA-Z0-9@+_.-]{1,254}$'
      description: Синтетический адрес или идентификатор стенда.
      examples: [coordinator@example.test]
    NotificationPriorityIds:
      type: array
      uniqueItems: true
      maxItems: 4
      items:
        type: integer
        enum: [1, 2, 3, 4]
    NotificationConnectionSettings:
      type: object
      additionalProperties: false
      required: [channel, address, active, priorityIds]
      properties:
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        address:
          $ref: '#/components/schemas/NotificationAddress'
        active:
          type: boolean
        priorityIds:
          $ref: '#/components/schemas/NotificationPriorityIds'
        secretRef:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_]{0,99}$'
          writeOnly: true
          description: Имя секрета в окружении. В теле запроса передаётся только имя.
    NotificationConnection:
      type: object
      additionalProperties: false
      required: [id, channel, address, active, priorityIds]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        address:
          $ref: '#/components/schemas/NotificationAddress'
        active:
          type: boolean
        priorityIds:
          $ref: '#/components/schemas/NotificationPriorityIds'
    PostmortemDraft:
      type: object
      required: [incidentId, resolutionEventSeq, observedAt, resolutionText, rootCause, timeline, notes, evidence, gaps]
      properties:
        incidentId: {$ref: '#/components/schemas/IncidentId'}
        resolutionEventSeq: {$ref: '#/components/schemas/EventSeq'}
        observedAt: {$ref: '#/components/schemas/UtcInstant'}
        resolutionText: {type: [string, 'null']}
        rootCause: {type: [string, 'null']}
        timeline:
          type: array
          items:
            type: object
            required: [eventSeq, observedAt, changeKind, beforeState, afterState, href]
            properties:
              eventSeq: {$ref: '#/components/schemas/EventSeq'}
              observedAt: {$ref: '#/components/schemas/UtcInstant'}
              changeKind: {type: string}
              beforeState: {type: [string, 'null']}
              afterState: {type: [string, 'null']}
              href: {type: string}
        notes:
          type: array
          items:
            type: object
            required: [noteId, eventSeq, observedAt, text, href]
            properties:
              noteId: {type: string}
              eventSeq: {$ref: '#/components/schemas/EventSeq'}
              observedAt: {$ref: '#/components/schemas/UtcInstant'}
              text: {type: string}
              href: {type: string}
        evidence:
          type: array
          items:
            type: object
            required: [runId, evidenceId, source, serviceKey, observedAt, message, value, recordCount, serviceState, href]
            properties:
              runId: {type: string, format: uuid}
              evidenceId: {type: string}
              source: {enum: [ITSM, LOG, DATABASE]}
              serviceKey: {type: string}
              observedAt: {$ref: '#/components/schemas/UtcInstant'}
              message: {type: [string, 'null']}
              value: {type: [integer, 'null'], format: int64}
              recordCount: {type: [integer, 'null'], format: int64}
              serviceState: {type: [string, 'null']}
              href: {type: string}
        gaps:
          type: array
          items:
            enum: [EVIDENCE_UNAVAILABLE, SOURCE_UNAVAILABLE_ITSM, SOURCE_UNAVAILABLE_LOG, SOURCE_UNAVAILABLE_DATABASE]
    CurrentCoordinator:
      type: object
      required: [subject, audience, id, sub, login, displayName, availability]
      properties:
        subject: {type: string}
        username: {type: [string, 'null']}
        name: {type: [string, 'null']}
        email: {type: [string, 'null']}
        audience:
          type: array
          items: {type: string}
        id: {type: integer, format: int64}
        sub: {type: string}
        login: {type: string}
        displayName: {type: string}
        availability:
          $ref: '#/components/schemas/CoordinatorAvailability'
    CoordinatorAvailability:
      type: object
      required: [available, availableSince, generation, groups]
      properties:
        available:
          type: boolean
          description: Можно ли назначать координатору новые задачи сейчас.
        availableSince:
          type: [string, 'null']
          format: date-time
          description: Момент последнего включения в UTC. До первого включения равен null.
        generation:
          type: integer
          format: int64
          minimum: 0
          description: Увеличивается только при переходе из недоступен в доступен.
        groups:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: integer, format: int64}
              name: {type: string}
    NotificationDeliveryState:
      type: string
      enum: [unknown, sent, failed, delivered, read_in_app, read_in_channel]
      description: |
        Самый сильный известный сигнал доставки: `unknown` — сигнала нет, `sent` — канал
        принял сообщение, `delivered` — канал подтвердил доставку, `read_in_app` — адресат
        прочитал уведомление в приложении дашборда, `read_in_channel` — канал сообщил о
        чтении в канале. `failed` — ошибка попытки, единственное состояние, которое можно
        повторить. Чтение в приложении и чтение в канале не заменяют друг друга: оба
        сохраняют собственные отметки времени.
    DashboardNotification:
      type: object
      additionalProperties: false
      required: [id, title, body, createdAt, deliveries]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        incidentId:
          type: [string, 'null']
          pattern: '^INC[0-9]{6,18}$'
          description: INC события, если уведомление о нём.
        priorityId:
          type: [integer, 'null']
          enum: [1, 2, 3, 4, null]
          description: Приоритет события по подпискам KAN-36.
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        readInAppAt:
          type: [string, 'null']
          format: date-time
          description: Подтверждение чтения в приложении; `null`, пока адресат не подтвердил.
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/NotificationDelivery'
    NotificationDelivery:
      type: object
      additionalProperties: false
      required: [id, connectionId, channel, state, attempts]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        connectionId:
          type: integer
          format: int64
          minimum: 1
          description: Ссылка на личное подключение из `/notification-connections`.
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        state:
          $ref: '#/components/schemas/NotificationDeliveryState'
        failureReason:
          type: [string, 'null']
          maxLength: 200
          description: |
            Короткий код последней неудачной попытки (например `channel_rejected_503`,
            `channel_unavailable`, `channel_unconfigured`). Никогда не содержит адреса,
            токены или URL.
        attempts:
          type: integer
          minimum: 0
        sentAt:
          type: [string, 'null']
          format: date-time
          description: Время последней принятой каналом отправки; `null`, пока ни одна не принята.
        deliveredAt:
          type: [string, 'null']
          format: date-time
        readInChannelAt:
          type: [string, 'null']
          format: date-time
        readInAppAt:
          type: [string, 'null']
          format: date-time
        lastAttemptAt:
          type: [string, 'null']
          format: date-time
    IncidentPresetSettings:
      type: object
      additionalProperties: false
      required: [name, queue, filters]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        queue:
          type: string
          enum: [all, critical, coordinator, high, research]
        filters:
          $ref: '#/components/schemas/IncidentPresetFilters'
    IncidentPreset:
      type: object
      required: [id, name, queue, filters]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        queue: {type: string, enum: [all, critical, coordinator, high, research]}
        filters:
          $ref: '#/components/schemas/IncidentPresetFilters'
    IncidentPresetFilters:
      type: object
      additionalProperties: false
      description: Параметры KAN-26 и сохранённый размер страницы. sla=soon разрешён для critical.
      properties:
        q: {type: string, minLength: 1, maxLength: 300}
        priority: {type: string, enum: ['1', '2', '3', '4']}
        product: {type: string, minLength: 1, maxLength: 300}
        team: {type: string, minLength: 1, maxLength: 300}
        state: {type: string, enum: [Assigned, WorkInProgress, Resolved, Closed, Research]}
        serviceType: {type: string, minLength: 1, maxLength: 300}
        deadline: {type: string, enum: [none, late, near]}
        sort: {type: string, enum: [updated, registered, deadline]}
        size: {type: string, enum: ['5', '25', '50', '100']}
        sla: {type: string, enum: [soon]}
    IncidentChangesPage:
      type: object
      required: [events, hasMore, lastEventSeq]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/IncidentJournalEvent'}}
        hasMore: {type: boolean}
        lastEventSeq: {type: integer, format: int64, minimum: 0}
    IncidentHistory:
      type: object
      required: [incidentId, lastObservedAt, events]
      properties:
        incidentId: {$ref: '#/components/schemas/IncidentId'}
        lastObservedAt:
          anyOf:
            - {$ref: '#/components/schemas/UtcInstant'}
            - {type: 'null'}
        events: {type: array, items: {$ref: '#/components/schemas/IncidentJournalEvent'}}
    IncidentJournalEvent:
      type: object
      required: [eventSeq, incidentId, sourceId, sourceVersion, changeRevision, changeKind, observedAt, sourceTime, fields]
      properties:
        eventSeq: {type: integer, format: int64, minimum: 1}
        eventId: {type: string, pattern: '^local-[0-9]+$', description: Стабильный идентификатор локального события.}
        incidentId: {$ref: '#/components/schemas/IncidentId'}
        sourceId: {type: [string, 'null'], description: Источник ITSM. У локального события null.}
        sourceVersion: {type: [integer, 'null'], format: int64}
        changeRevision: {type: integer, format: int64, minimum: 0}
        changeKind:
          type: string
          enum: [ADDED, UPDATED, MISSING, RETURNED, NOTE_ADDED, DEADLINE_APPROACHING]
        observedAt: {$ref: '#/components/schemas/UtcInstant'}
        sourceTime:
          anyOf:
            - {$ref: '#/components/schemas/UtcInstant'}
            - {type: 'null'}
        fields:
          type: array
          description: Пусто у локальных событий.
          items:
            type: object
            required: [field, previous, current]
            properties:
              field: {type: string}
              previous: {}
              current: {}
        details:
          type: object
          description: Данные локального события. NOTE_ADDED содержит noteId, authorId и text.
          properties:
            deadline: {$ref: '#/components/schemas/UtcInstant'}
            ruleVersion: {type: integer, format: int64, minimum: 1}
            noteId: {type: string, format: uuid}
            authorId: {type: integer, format: int64, minimum: 1}
            text: {type: string, minLength: 1, maxLength: 4000}
    DeadlineWarningRule:
      type: object
      required: [thresholdSeconds, version]
      properties:
        thresholdSeconds: {type: integer, format: int32, minimum: 1}
        version: {type: integer, format: int64, minimum: 1}
    IncidentId:
      type: string
      pattern: '^INC[0-9]{6,18}$'
      description: 'Строковый INC. Числовой JSON `id` недопустим.'
    UtcInstant:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|\+00:00)$'
      description: 'UTC, ISO-8601: `YYYY-MM-DDTHH:MM:SS[.ffffff]Z`. Иные смещения и локальное время не допускаются.'
    EventSeq:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
      description: 'Счётчик публикаций, версия блока статуса. Растёт на каждой применённой публикации, даже если состав INC не изменился.'
    PublishedRevision:
      type: integer
      format: int64
      minimum: 0
      description: 'Опубликованная версия источника из последнего успешного пакета. `0` — публикации ещё нет.'
    IncidentGroupKey:
      type: string
      enum:
        - critical
        - coordinator
        - high
        - research
      description: |
        `critical` — активный P4; `high` — активный P3; `coordinator` — активный или
        Research с назначением на координаторов массовых инцидентов; `research` —
        `stateEnum = Research` при любой дате устранения.
    ItsmIncidentState:
      type: string
      enum:
        - Assigned
        - WorkInProgress
        - Resolved
        - Closed
        - Research
    IncidentGroupMembership:
      type: object
      required:
        - group
        - matchedRule
      properties:
        group:
          $ref: '#/components/schemas/IncidentGroupKey'
        matchedRule:
          type: string
          description: 'Правило, по которому INC попал в группу.'
      additionalProperties: false
    MonitoringCounts:
      type: object
      description: 'Независимые счётчики категорий; категории могут пересекаться.'
      required:
        - critical
        - high
        - coordinators
        - research
      properties:
        critical:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        coordinators:
          type: integer
          minimum: 0
        research:
          type: integer
          minimum: 0
      additionalProperties: false
    MonitoringTimelinePoint:
      type: object
      description: 'Фактическое наблюдение опубликованного снимка, без синтетических нулей.'
      required:
        - at
        - critical
        - high
        - coordinators
        - research
      properties:
        at:
          $ref: '#/components/schemas/UtcInstant'
        critical:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        coordinators:
          type: integer
          minimum: 0
        research:
          type: integer
          minimum: 0
      additionalProperties: false
    MonitoringPriority:
      type: object
      required:
        - priorityId
        - count
      properties:
        priorityId:
          type: integer
          format: int32
        count:
          type: integer
          minimum: 0
      additionalProperties: false
    MonitoringCoordinatorLoad:
      type: object
      required:
        - name
        - count
      properties:
        name:
          type: string
          minLength: 1
        count:
          type: integer
          minimum: 0
      additionalProperties: false
    MonitoringSummary:
      type: object
      required:
        - updatedAt
        - activeCount
        - counts
        - timeline
        - priorities
        - coordinatorLoad
      properties:
        updatedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: 'Время последней успешной публикации; `null` до первой публикации.'
        activeCount:
          type: integer
          minimum: 0
          description: 'Инциденты в `Assigned` или `WorkInProgress`.'
        counts:
          $ref: '#/components/schemas/MonitoringCounts'
        timeline:
          type: array
          description: 'Публикации за последние 24 часа, по возрастанию `at`.'
          items:
            $ref: '#/components/schemas/MonitoringTimelinePoint'
        priorities:
          type: array
          description: 'Активные инциденты по исходному `priorityId`; только встреченные значения.'
          items:
            $ref: '#/components/schemas/MonitoringPriority'
        coordinatorLoad:
          type: array
          description: 'Активные инциденты на координаторах по назначенному сотруднику.'
          items:
            $ref: '#/components/schemas/MonitoringCoordinatorLoad'
      additionalProperties: false
    IncidentSummary:
      type: object
      required:
        - id
        - stateEnum
        - priorityId
        - submitDate
        - deadline
        - groupMemberships
      description: Строка списка групп.
      properties:
        assignedEmployeeLogin: {type: [string, 'null']}
        assignedEmployee: {type: [string, 'null']}
        id:
          $ref: '#/components/schemas/IncidentId'
        productName:
          type:
            - string
            - 'null'
        assignedGroupName:
          type:
            - string
            - 'null'
        stateEnum:
          $ref: '#/components/schemas/ItsmIncidentState'
        priorityId:
          type: integer
          format: int32
          description: 'Исходный приоритет ITSM. Только P4 и P3 влияют на группы `critical` и `high`.'
        submitDate:
          $ref: '#/components/schemas/UtcInstant'
        deadline:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: '`null` — срока нет.'
        completionDate:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        groupMemberships:
          type: array
          description: 'Все группы INC, отсортированы по `group`.'
          items:
            $ref: '#/components/schemas/IncidentGroupMembership'
      additionalProperties: false
    IncidentLinkKind:
      type: string
      enum: [related_to, causes, duplicate_of]
    ConfirmedIncidentLink:
      type: object
      additionalProperties: false
      required: [id, sourceIncidentId, targetIncidentId, kind, confirmedByUserId, createdAt]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        sourceIncidentId: {$ref: '#/components/schemas/IncidentId'}
        targetIncidentId: {$ref: '#/components/schemas/IncidentId'}
        kind: {$ref: '#/components/schemas/IncidentLinkKind'}
        confirmedByUserId: {type: integer, format: int64, minimum: 1}
        createdAt: {$ref: '#/components/schemas/UtcInstant'}
    IncidentCard:
      type: object
      description: Карточка INC (карточка в ITSM).
      required:
        - id
        - stateEnum
        - priorityId
        - submitDate
        - deadline
        - assignedEmployee
        - remainingSeconds
        - overdue
        - itsmUrl
        - itsmDemo
        - meetingUrl
        - groupMemberships
        - deadlineRisk
        - confirmedLinks
        - eventSeq
        - revision
      properties:
        meetingUrl:
          type: [string, 'null']
          format: uri
          pattern: '^https?://'
          description: Локальная ссылка МТС Линк или null, если её ещё не сохранили.
        confirmedLinks:
          type: array
          description: Подтверждённые координаторами связи с участием этого INC по возрастанию ID.
          items: {$ref: '#/components/schemas/ConfirmedIncidentLink'}
        itsmUrl: {type: string, format: uri}
        remainingSeconds: {type: [integer, 'null']}
        overdue: {type: boolean}
        assignedEmployeeLogin: {type: [string, 'null']}
        assignedEmployee: {type: [string, 'null']}
        id:
          $ref: '#/components/schemas/IncidentId'
        header:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        productName:
          type:
            - string
            - 'null'
        productMasterId:
          type:
            - string
            - 'null'
        service:
          type:
            - string
            - 'null'
        serviceType:
          type:
            - string
            - 'null'
        assignedGroupName:
          type:
            - string
            - 'null'
        assignedEmployee:
          type:
            - string
            - 'null'
          description: 'Официальный исполнитель по данным ITSM, не внутреннее назначение дашборда.'
        stateEnum:
          $ref: '#/components/schemas/ItsmIncidentState'
        stateReason:
          type:
            - string
            - 'null'
        priorityId:
          type: integer
          format: int32
          description: 'Исходный приоритет ITSM без подмены.'
        submitDate:
          $ref: '#/components/schemas/UtcInstant'
        lastAssignmentToTeamDateTime:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        deadline:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: '`null` — срока нет; отсутствие или `0001-01-01T00:00:00Z` в снимке.'
        completionDate:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: 'Только у завершённых (`Resolved`, `Closed`, `Research`); у активных — `null`.'
        solution:
          type:
            - string
            - 'null'
          description: 'Только у завершённых; у активных — `null`.'
        remainingSeconds:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Срок минус серверное время, в секундах с округлением вниз. Без срока и вне Assigned/WorkInProgress — `null`.'
        overdue:
          type: boolean
          description: 'Только для Assigned/WorkInProgress со сроком, когда серверное время строго больше срока. Ровно в срок — `false`.'
        itsmUrl:
          type: string
          format: uri
          description: 'Абсолютный HTTP(S) URL этого INC в ITSM; не productUrl.'
        itsmDemo:
          type: boolean
          description: 'Показывать явную пометку демоцели, если `true`.'
        groupMemberships:
          type: array
          items:
            $ref: '#/components/schemas/IncidentGroupMembership'
        deadlineRisk:
          $ref: '#/components/schemas/DeadlineRisk'
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
      additionalProperties: false
    DeadlineRisk:
      type: object
      description: |
        Риск нарушения дедлайна (KAN-82). Пересчитывается фоново при каждой публикации снимка
        ITSM для активных инцидентов со сроком; отдельного сервиса нет, модель — константы в
        конфигурации бэкенда. По умолчанию работает регрессия KAN-81. Приоритет P4 (критический) соответствует
        рангу UCI 1. Пока в ITSM нет истории группы, берётся обучающая медиана этого приоритета. Режим threshold
        оценивает оставшееся время до дедлайна. Оценка только читает данные и не меняет дедлайн, приоритет и
        статус; предупреждение о приближении срока (KAN-46) показывается рядом и отдельно.
        `risk: unknown` — срока нет, карточка завершена или оценка недоступна; карточку не
        блокирует. `score` — взвешенная сумма признаков (не вероятность), только для
        отладки, в UI не показывать.
      required:
        - risk
        - evaluatedAt
        - reasons
        - score
      properties:
        risk:
          type: string
          enum:
            - low
            - medium
            - high
            - unknown
        evaluatedAt:
          $ref: '#/components/schemas/UtcInstant'
        reasons:
          type: array
          description: 'Основания оценки с конкретными числами; у `unknown` — причина недоступности.'
          items:
            type: object
            required:
              - code
              - text
            additionalProperties: false
            properties:
              code:
                type: string
                description: 'Стабильный код основания: `training_priority_median`, `unsupported_priority`, `remaining_below_threshold`, `remaining_in_buffer`, `group_median`, `group_median_exceeds`, `deadline_extended`, `reassigned`, `reopened`, `status_stale`, `assignee_overloaded`, `no_deadline`, `no_history`, `not_active`, `not_evaluated`.'
              text:
                type: string
        score:
          type:
            - number
            - 'null'
          description: 'Взвешенная сумма признаков `w0 + w1*x1 + … + w7*x7`; `null` для `unknown` и режима threshold.'
      additionalProperties: false
    IncidentList:
      type: object
      required:
        - eventSeq
        - revision
        - beforeFirstSuccess
        - groups
        - items
        - nextCursor
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
        beforeFirstSuccess:
          type: boolean
          description: '`true`, пока нет ни одной опубликованной версии: списки пусты, группы пусты.'
        groups:
          type: array
          description: 'Группы дашборда в порядке отображения; при `beforeFirstSuccess` — `[]`.'
          items:
            $ref: '#/components/schemas/IncidentGroup'
        items:
          type: array
          items:
            $ref: '#/components/schemas/IncidentSummary'
        nextCursor:
          type:
            - string
            - 'null'
          description: '`null` — страниц больше нет.'
      additionalProperties: false
    IncidentGroup:
      type: object
      required:
        - key
        - title
        - rule
        - active
        - incidentCount
        - incidents
        - fixed
      description: 'Группа дашборда. Пустая группа — `incidents: []` и `incidentCount: 0`.'
      properties:
        key:
          $ref: '#/components/schemas/IncidentGroupKey'
        title:
          type: string
        rule:
          type: string
        active:
          type: boolean
          description: 'Активные — `critical`, `high`, `coordinator`; `research` — завершённая.'
        incidentCount:
          type: integer
          minimum: 0
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/IncidentSummary'
        fixed:
          anyOf:
            - $ref: '#/components/schemas/EventSeq'
            - type: 'null'
          description: '`null`: состав групп меняется с событиями, поэтому не фиксируется.'
      additionalProperties: false
    IncidentRelationshipNode:
      type: object
      required:
        - id
        - title
        - stateEnum
        - priorityId
      description: 'Узел графа: фокус, его прямой родитель или прямой дочерний INC.'
      properties:
        id:
          $ref: '#/components/schemas/IncidentId'
        title:
          type:
            - string
            - 'null'
          description: 'Заголовок из опубликованного снимка; `null`, если его нет.'
        stateEnum:
          anyOf:
            - $ref: '#/components/schemas/ItsmIncidentState'
            - type: 'null'
          description: 'Статус может быть недоступен только у существующего узла; `id` всегда заполнен.'
        priorityId:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          description: 'Исходный приоритет ITSM или `null`, если значение недоступно.'
      additionalProperties: false
    IncidentRelationshipEdge:
      type: object
      required:
        - parentId
        - childId
      properties:
        parentId:
          $ref: '#/components/schemas/IncidentId'
        childId:
          $ref: '#/components/schemas/IncidentId'
      additionalProperties: false
    IncidentRelationships:
      type: object
      required:
        - focusId
        - nodes
        - edges
      description: 'Один шаг в обе стороны от фокуса; рёбра ведут только от фокуса к родителю или детям.'
      properties:
        focusId:
          $ref: '#/components/schemas/IncidentId'
        nodes:
          type: array
          description: 'Фокус, прямой родитель (если есть) и прямые дети (если есть).'
          items:
            $ref: '#/components/schemas/IncidentRelationshipNode'
        edges:
          type: array
          description: 'Пустой список для известного INC без связей.'
          items:
            $ref: '#/components/schemas/IncidentRelationshipEdge'
      additionalProperties: false
    IncidentNotFound:
      type: object
      required:
        - code
        - message
        - eventSeq
        - revision
      properties:
        code:
          type: string
          const: INCIDENT_NOT_FOUND
        message:
          type: string
          minLength: 1
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
      additionalProperties: false
    SourceList:
      type: object
      required:
        - eventSeq
        - revision
        - sources
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
          description: Глобальная опубликованная ревизия изменений для интерфейса.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceStatus'
      additionalProperties: false
    SourceStatus:
      type: object
      required:
        - sourceId
        - kind
        - revision
        - sourceVersion
        - lastReceivedAt
        - lastSuccessAt
        - batchStatus
        - stale
        - staleAfterSeconds
      properties:
        sourceId:
          type: string
        kind:
          type: string
          enum:
            - ITCS
        revision:
          $ref: '#/components/schemas/PublishedRevision'
        sourceVersion:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: 'Последняя доставка. Не `revision` и не `eventSeq`.'
        lastReceivedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        lastSuccessAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        batchStatus:
          type:
            - string
            - 'null'
          enum:
            - RECEIVED
            - PROCESSING
            - SUCCEEDED
            - FAILED
            - null
          description: Статус последнего принятого пакета.
        stale:
          type: boolean
        staleAfterSeconds:
          type: integer
          minimum: 1
      additionalProperties: false
    IncidentChange:
      type: object
      required:
        - id
        - groupMemberships
      properties:
        id:
          $ref: '#/components/schemas/IncidentId'
        groupMemberships:
          type: array
          description: 'Группы INC после изменения; для `removed` — группы, в которых он был.'
          items:
            $ref: '#/components/schemas/IncidentGroupMembership'
      additionalProperties: false
    DashboardEvent:
      type: object
      required:
        - eventId
        - type
        - eventSeq
        - occurredAt
        - incident
      properties:
        eventId:
          type: string
          pattern: '^evt-[0-9]{4,}$'
        type:
          type: string
          enum:
            - upserted
            - removed
            - heartbeat
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Метка события; следующий опрос — с `nextEventSeq`.'
        occurredAt:
          $ref: '#/components/schemas/UtcInstant'
        incident:
          anyOf:
            - $ref: '#/components/schemas/IncidentChange'
            - type: 'null'
          description: '`null` только для `heartbeat`.'
      additionalProperties: false
    EventBatch:
      type: object
      required:
        - eventSeq
        - nextEventSeq
        - stale
        - source
        - events
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Текущий `eventSeq` публикации на момент ответа.'
        nextEventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Курсор следующего опроса (`0`, если продолжать нечем).'
        stale:
          type: boolean
          description: '`true` — данных нет давно; клиент показывает публикацию как устаревшую.'
        source:
          anyOf:
            - $ref: '#/components/schemas/SourceStatus'
            - type: 'null'
        events:
          type: array
          items:
            $ref: '#/components/schemas/DashboardEvent'
      additionalProperties: false
    EventAckRequest:
      type: object
      required:
        - eventIds
      properties:
        eventIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            pattern: '^evt-[0-9]{4,}$'
          description: 'Точный набор `eventId` из ответа `events`.'
      additionalProperties: false
    EventAck:
      type: object
      required:
        - eventSeq
        - confirmedEventIds
        - status
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Наивысший полностью подтверждённый `eventSeq`.'
        confirmedEventIds:
          type: array
          items:
            type: string
            pattern: '^evt-[0-9]{4,}$'
        status:
          type: string
          enum:
            - acknowledged
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
          minLength: 1
      additionalProperties: false
    SimilarIncidentSuggestions:
      type: object
      description: |
        Похожие INC для выбранного инцидента. Кандидаты упорядочены по убыванию оценки,
        при равенстве — по номеру; каждый номер встречается один раз. Чтение не создаёт
        связей между инцидентами.
      required:
        - incidentId
        - eventSeq
        - revision
        - candidates
      properties:
        incidentId:
          $ref: '#/components/schemas/IncidentId'
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
        candidates:
          type: array
          description: 'Пуст, когда у INC нет известного сервиса или совпадений в окне.'
          items:
            $ref: '#/components/schemas/SimilarIncidentCandidate'
      additionalProperties: false
    SimilarIncidentCandidate:
      type: object
      description: Один кандидат с объяснением совпадения.
      required:
        - incidentId
        - score
        - reasons
        - sharedAttributes
        - stateEnum
        - priorityId
        - submitDate
        - submitDifferenceSeconds
        - isDouble
        - isMaster
      properties:
        incidentId:
          $ref: '#/components/schemas/IncidentId'
        score:
          type: integer
          format: int32
          minimum: 0
          description: 'Сумма весов совпавших признаков: сервис 50, сценарий 20, код ошибки 30, близость времени 10 или 5.'
        reasons:
          type: array
          minItems: 1
          description: 'Человекочитаемые основания предложения, по одному на совпавший признак.'
          items:
            type: string
            minLength: 1
        sharedAttributes:
          $ref: '#/components/schemas/SimilarIncidentSharedAttributes'
        header:
          type:
            - string
            - 'null'
          description: Заголовок кандидата для быстрой оценки без открытия карточки.
        stateEnum:
          $ref: '#/components/schemas/ItsmIncidentState'
        priorityId:
          type: integer
          format: int32
        submitDate:
          $ref: '#/components/schemas/UtcInstant'
        submitDifferenceSeconds:
          type: integer
          format: int64
          minimum: 0
          description: 'Абсолютная разница регистраций кандидата и выбранного INC в секундах.'
        isDouble:
          type:
            - boolean
            - 'null'
          description: 'Флаг ITSM «дубль»; контекст, оценка его не использует.'
        isMaster:
          type:
            - boolean
            - 'null'
          description: 'Флаг ITSM «мастер для дублей»; контекст, оценка его не использует.'
      additionalProperties: false
    SimilarIncidentSharedAttributes:
      type: object
      description: 'Совпавшие признаки, использованные оценкой; признак без вклада — null.'
      required:
        - productName
        - service
        - scenarioName
        - errorCode
      properties:
        productName:
          type: string
        service:
          type: string
        scenarioName:
          type:
            - string
            - 'null'
        errorCode:
          type:
            - string
            - 'null'
          description: 'Значение атрибута `errorCode`, заданное и равное в обеих записях.'
      additionalProperties: false
    CreateIncidentNoteRequest:
      type: object
      description: 'Заметка смены (KAN-43): текст обязателен; `observedAt` — необязательное время наблюдения (по умолчанию текущее время сервера); `authorId` — необязательное эхо локального идентификатора координатора, при несовпадении с автором токена запись отвергается целиком.'
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: 'Текст заметки: 1-4000 символов, не только пробелы.'
        observedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: 'Время наблюдения; опущено — текущее время сервера.'
        authorId:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Локальный идентификатор координатора из `GET /api/me`; при передаче должен совпадать с автором токена.'
      additionalProperties: false
    IncidentNote:
      type: object
      description: 'Сохранённая заметка (KAN-43): автор всегда из проверенного токена, `eventSeq` — позиция события в общей хронологии KAN-28; опубликованный `revision` снимка ITSM заметкой не меняется.'
      required:
        - noteId
        - incidentId
        - authorId
        - authorLogin
        - authorDisplayName
        - observedAt
        - eventSeq
        - text
      properties:
        noteId:
          type: string
          minLength: 1
          description: 'Стабильный идентификатор заметки; он же ключ дедупликации события записи.'
        incidentId:
          $ref: '#/components/schemas/IncidentId'
        authorId:
          type: integer
          format: int64
          description: 'Локальный идентификатор автора заметки.'
        authorLogin:
          type: string
          minLength: 1
          description: 'Логин автора из локального допуска координатора.'
        authorDisplayName:
          type: string
          minLength: 1
          description: 'Отображаемое имя автора из локального допуска координатора.'
        observedAt:
          $ref: '#/components/schemas/UtcInstant'
        eventSeq:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: 'Позиция события заметки в общей последовательности хронологии KAN-28; растёт независимо от `revision` снимка.'
        text:
          type: string
          minLength: 1
      additionalProperties: false
    IncidentNotesPage:
      type: object
      description: 'Одна страница истории заметок INC (KAN-43), в порядке возрастания `eventSeq`.'
      required:
        - incidentId
        - notes
        - hasMore
        - lastEventSeq
      properties:
        incidentId:
          $ref: '#/components/schemas/IncidentId'
        notes:
          type: array
          description: 'Заметки с `eventSeq` больше курсора, в порядке возрастания `eventSeq`.'
          items:
            $ref: '#/components/schemas/IncidentNote'
        hasMore:
          type: boolean
          description: 'Есть ли заметки за пределами страницы.'
        lastEventSeq:
          type: integer
          format: int64
          minimum: 0
          description: 'Наибольший `eventSeq` страницы или курсор запроса при пустой странице; передаётся обратно как следующий курсор.'
      additionalProperties: false
    AiInvestigationRunStatus:
      type: string
      enum:
        - running
        - completed
        - failed
      description: |
        `running` — модель ещё отвечает; `completed` — есть гипотеза и следующий шаг;
        `failed` — явная ошибка вместо ответа.
    AiInvestigationEvidenceSource:
      type: string
      enum:
        - ITSM
        - LOG
        - DATABASE
      description: Стендовый источник свидетельства KAN-39.
    AiInvestigationFact:
      type: object
      required:
        - evidenceId
        - source
        - serviceKey
        - observedAt
      description: |
        Один факт запуска: ограниченное свидетельство стендового источника. Факт всегда
        называет `evidenceId` записи источника; поля наблюдения заполняет только сам
        источник, остальные — `null`. Факт без источника не существует.
      properties:
        evidenceId:
          type: string
          minLength: 1
          maxLength: 128
          description: 'Идентификатор записи источника, например `log:log-rec-1`.'
        source:
          $ref: '#/components/schemas/AiInvestigationEvidenceSource'
        serviceKey:
          type: string
          minLength: 1
          maxLength: 128
        observedAt:
          $ref: '#/components/schemas/UtcInstant'
        message:
          type:
            - string
            - 'null'
        messageTruncated:
          type:
            - boolean
            - 'null'
        level:
          type:
            - string
            - 'null'
        assignedCommand:
          type:
            - string
            - 'null'
        recordCount:
          type:
            - integer
            - 'null'
          format: int64
          description: Записей источника в окне свидетельств.
        value:
          type:
            - integer
            - 'null'
          format: int64
          description: Последнее значение диагностической метрики.
        serviceState:
          type:
            - string
            - 'null'
      additionalProperties: false
    AiInvestigationUnavailableSource:
      type: object
      required:
        - source
        - serviceKey
        - code
      description: |
        Источник, не давший свидетельства при запуске. Пробел хранится вместе с фактом
        отдельным списком и никогда не превращается в факт или выдуманное свидетельство.
      properties:
        source:
          $ref: '#/components/schemas/AiInvestigationEvidenceSource'
        serviceKey:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 1
          pattern: '^[A-Z][A-Z0-9_]*$'
        reason:
          type:
            - string
            - 'null'
      additionalProperties: false
    AiInvestigationRun:
      type: object
      required:
        - runId
        - incidentId
        - status
        - revision
        - stale
        - windowFrom
        - windowTo
        - facts
        - unavailableSources
        - createdAt
      description: |
        Один запуск AI-расследования (KAN-40). `revision` — ревизия публикации, против
        которой запуск сделан; `stale` вычисляется при чтении: `true`, если опубликована
        более новая ревизия. Факты и пробелы собраны при запуске и не меняются;
        `hypothesis` и `nextStep` появляются только в `completed`, а в `failed` вместо
        них — явные `errorCode` и `errorMessage`. Окно свидетельств — те же границы,
        которые запрашивались у источников KAN-39.
      properties:
        runId:
          type: string
          format: uuid
        incidentId:
          $ref: '#/components/schemas/IncidentId'
        status:
          $ref: '#/components/schemas/AiInvestigationRunStatus'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
        stale:
          type: boolean
          description: 'Опубликована более новая ревизия: ответ описывает старое состояние INC.'
        windowFrom:
          $ref: '#/components/schemas/UtcInstant'
        windowTo:
          $ref: '#/components/schemas/UtcInstant'
        hypothesis:
          type:
            - string
            - 'null'
          description: 'Гипотеза модели; присутствует только для `completed`.'
        nextStep:
          type:
            - string
            - 'null'
          description: 'Следующий шаг координатора; присутствует только для `completed`.'
        facts:
          type: array
          items:
            $ref: '#/components/schemas/AiInvestigationFact'
        unavailableSources:
          type: array
          items:
            $ref: '#/components/schemas/AiInvestigationUnavailableSource'
        errorCode:
          type:
            - string
            - 'null'
          description: 'Явный код ошибки; присутствует только для `failed`.'
        errorMessage:
          type:
            - string
            - 'null'
        createdAt:
          $ref: '#/components/schemas/UtcInstant'
        finishedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: 'Момент ответа модели или явной ошибки; `null`, пока `running`.'
      additionalProperties: false
