  '/api/dashboard/incidents/{incidentId}/similar':
    get:
      operationId: suggestSimilarIncidents
      security: [{coordinatorBearer: []}]
      summary: Похожие инциденты с объяснением совпадения (KAN-42)
      description: |
        Детерминированные подсказки похожих INC, построенные только из опубликованного
        снимка: кандидат делит с выбранным INC один сервис каталога и зарегистрирован в
        включающем окне ±72 ч от его `submitDate`. Оценка — сумма совпавших признаков:
        сервис 50, сценарий 20, код ошибки 30 (когда атрибут `errorCode` задан и равен в
        обеих записях), близость времени 10 при разнице ≤ 6 ч и 5 при ≤ 24 ч. Равные
        оценки упорядочиваются по номеру, каждый INC встречается один раз. Флаги
        `isDouble`/`isMaster` показываются как контекст и никогда не создают подсказку;
        подтверждение связи — отдельное действие координатора, чтение ничего не пишет.
        Без известного сервиса или совпадений список пуст.
      parameters:
        - name: incidentId
          in: path
          required: true
          description: 'Строковый INC, URL-кодируется; числовой вид не принимается.'
          schema:
            $ref: '#/components/schemas/IncidentId'
          examples:
            withKnownService:
              value: "INC000021095532"
        - name: limit
          in: query
          required: false
          description: 'Максимум кандидатов в ответе, 1–100; по умолчанию 10.'
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: 'Кандидаты по убыванию оценки; пустой список — сведений недостаточно.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarIncidentSuggestions'
              examples:
                matchedPair:
                  summary: 'Тот же сервис, окно 72 ч: сильный кандидат и кандидат только по сервису'
