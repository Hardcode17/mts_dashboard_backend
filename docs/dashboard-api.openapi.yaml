                    eventSeq: 0
                    revision: 0
  /api/dashboard/sources:
    get:
      operationId: listSources
      summary: Статус источников и свежесть публикации (KAN-7)
      description: |
        Все источники, включая stale. `revision` — опубликованная версия,
        `sourceVersion` — последняя доставка (не путать ни с `revision`, ни с `eventSeq`). `stale` —
        `true`, пока последняя доставка не опубликована, или последний приём старше
        `staleAfterSeconds` (при снимке каждые 30 с — пропуск до трёх тиков).
      responses:
        '200':
          description: Источники.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'
              examples:
                published:
                  summary: Свежий опубликованный снимок (fixture sources-published)
                  x-fixture: sources-published
                  value:
                    eventSeq: 43
                    revision: 42
                    sources:
                      - sourceId: itcs-prod
                        kind: ITCS
                        revision: 42
                        sourceVersion: 42
                        lastReceivedAt: '2026-11-21T09:05:00.123456Z'
                        lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                        batchStatus: SUCCEEDED
                        stale: false
                        staleAfterSeconds: 90
                stale:
                  summary: 'Снимок принят, успеха воркера нет — stale (fixture sources-stale)'
                  x-fixture: sources-stale
                  value:
                    eventSeq: 43
                    revision: 42
                    sources:
                      - sourceId: itcs-prod
                        kind: ITCS
                        revision: 42
                        sourceVersion: 43
                        lastReceivedAt: '2026-11-21T09:08:35.250000Z'
                        lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                        batchStatus: RECEIVED
                        stale: true
                        staleAfterSeconds: 90
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                machineAuthRequired:
                  summary: Нет или невалиден машинный Bearer
                  value: {"code": "MACHINE_AUTH_REQUIRED", "message": "Machine bearer token is required"}
  /api/dashboard/events:
    get:
      operationId: pollEvents
      summary: Polling изменений по eventSeq (KAN-7)
      description: |
        События с `eventSeq > sinceEventSeq`, по возрастанию. Два события одного INC
        (обновление и удаление) приходят разными `eventId` и `eventSeq`.
      parameters:
        - name: sinceEventSeq
          in: query
          required: true
          description: 'Последний обработанный `eventSeq`; `0` — с начала.'
          schema:
            $ref: '#/components/schemas/EventSeq'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Изменения.
          headers:
            ETag:
              description: '`eventSeq` выборки; `If-None-Match` с ним даёт `304`, когда новых событий нет.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatch'
              examples:
                twoEventsSameIncident:
                  summary: Обновление и удаление одного INC — два eventId (fixture events-poll-two-events)
                  x-fixture: events-poll-two-events
                  value:
                    eventSeq: 43
                    nextEventSeq: 43
                    stale: false
                    source:
                      sourceId: itcs-prod
                      kind: ITCS
                      revision: 42
                      sourceVersion: 42
                      lastReceivedAt: '2026-11-21T09:05:00.123456Z'
                      lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                      batchStatus: SUCCEEDED
                      stale: false
                      staleAfterSeconds: 90
                    events:
                      - eventId: evt-0002
                        type: upserted
                        eventSeq: 43
                        occurredAt: '2026-11-21T09:05:00.500000Z'
                        incident:
                          id: INC000021095533
                          groupMemberships:
                            - group: high
                              matchedRule: priorityId = 3
                      - eventId: evt-0003
                        type: removed
                        eventSeq: 43
                        occurredAt: '2026-11-21T09:05:00.500000Z'
                        incident:
                          id: INC000021095533
                          groupMemberships:
                            - group: high
                              matchedRule: priorityId = 3
                heartbeat:
                  summary: 'Изменений нет, событие-сердцебиение (fixture events-heartbeat)'
                  x-fixture: events-heartbeat
                  value:
                    eventSeq: 43
                    nextEventSeq: 43
                    stale: false
                    source:
                      sourceId: itcs-prod
                      kind: ITCS
                      revision: 42
                      sourceVersion: 42
                      lastReceivedAt: '2026-11-21T09:05:00.123456Z'
                      lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                      batchStatus: SUCCEEDED
                      stale: false
                      staleAfterSeconds: 90
                    events:
                      - eventId: evt-0004
                        type: heartbeat
                        eventSeq: 43
                        occurredAt: '2026-11-21T09:05:00.500000Z'
                        incident: null
        '304':
          description: 'С указанного `eventSeq` изменений не было.'
        '400':
          description: Некорректный запрос.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSinceEventSeq:
                  summary: Обязательный sinceEventSeq отсутствует
                  value: {"code": "INVALID_EVENT_SEQ", "message": "sinceEventSeq is required"}
                eventSeqOverflow:
                  summary: sinceEventSeq вне int64
                  value: {"code": "INVALID_EVENT_SEQ", "message": "sinceEventSeq must be in [0, 9223372036854775807]"}
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
  /api/dashboard/events/ack:
    post:
      operationId: acknowledgeEvents
      summary: Подтвердить точный набор eventId (KAN-7)
      description: |
        Идемпотентно: повтор того же набора — тот же `200` и `eventSeq`. Порядок не
        важен. Набор сравнивается целиком: неизвестный, чужой или уже вытесненный `eventId` —
        `400 ACK_EVENT_UNKNOWN`, и ничего не подтверждается.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventAckRequest'
            examples:
              twoEvents:
                summary: Оба события INC000021095533 (fixture events-ack-request)
                x-fixture: events-ack-request
                value:
                  eventIds:
                    - evt-0002
                    - evt-0003
      responses:
        '200':
          description: 'Набор подтверждён; `eventSeq` — подтверждённая позиция.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAck'
              examples:
                twoEvents:
                  summary: Подтверждены evt-0002 и evt-0003 (fixture events-ack-response)
                  x-fixture: events-ack-response
                  value:
                    eventSeq: 43
                    confirmedEventIds:
                      - evt-0002
                      - evt-0003
                    status: acknowledged
        '400':
          description: Некорректный набор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownEvent:
                  summary: eventId не входит в журнал
                  value: {"code": "ACK_EVENT_UNKNOWN", "message": "Unknown eventId evt-0009"}
                emptySet:
                  summary: Пустой набор eventId
                  value: {"code": "ACK_EVENTS_INVALID", "message": "eventIds must contain 1-1000 unique ids"}
                duplicateIds:
                  summary: Повтор внутри набора eventId
                  value: {"code": "ACK_EVENTS_INVALID", "message": "eventIds must contain no duplicates"}
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: 'Сессия интерфейса координатора; неаутентифицированный браузер перенаправляется на форму входа (`302`).'
    machineBearer:
      type: http
      scheme: bearer
      x-prospective: true
      description: |
        Предлагается, не развёрнуто: JWT Keycloak для машинного мониторинга.
        Проверяются `iss`, подпись JWKS, `exp`, `aud`; остальное — как `machineBearer` в
        `itsm-ingest.openapi.yaml`.
  schemas:
    IncidentId:
      type: string
      pattern: '^INC[0-9]{6,18}$'
      description: 'Строковый INC. Числовой JSON `id` недопустим.'
    UtcInstant:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|\+00:00)$'
      description: 'UTC, ISO-8601: `YYYY-MM-DDTHH:MM:SS[.ffffff]Z`. Иные смещения и локальное время не допускаются.'
    EventSeq:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
      description: 'Счётчик изменений опубликованных данных. Версия блока статуса, не снимка.'
    PublishedRevision:
      type: integer
      format: int64
      minimum: 0
      description: 'Опубликованная версия источника из последнего успешного пакета. `0` — публикации ещё нет.'
    IncidentGroupKey:
      type: string
      enum:
        - critical
        - high
        - coordinator
        - research
      description: |
        `critical` — активный P4; `high` — активный P3; `coordinator` — активный или
        Research с назначением на координаторов массовых инцидентов; `research` —
        `stateEnum = Research` при любой дате устранения.
    ItsmIncidentState:
      type: string
      enum:
        - Assigned
        - WorkInProgress
        - Resolved
        - Closed
        - Research
    IncidentGroupMembership:
      type: object
      required:
        - group
        - matchedRule
      properties:
        group:
          $ref: '#/components/schemas/IncidentGroupKey'
        matchedRule:
          type: string
          description: 'Правило, по которому INC попал в группу.'
      additionalProperties: false
    IncidentSummary:
      type: object
      required:
        - id
        - stateEnum
        - priorityId
        - submitDate
        - deadline
        - groupMemberships
      description: Строка списка групп.
      properties:
        id:
          $ref: '#/components/schemas/IncidentId'
        productName:
          type:
            - string
            - 'null'
        assignedGroupName:
          type:
            - string
            - 'null'
        stateEnum:
          $ref: '#/components/schemas/ItsmIncidentState'
        priorityId:
          type: integer
          minimum: 1
          maximum: 4
        submitDate:
          $ref: '#/components/schemas/UtcInstant'
        deadline:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: '`null` — срока нет.'
        completionDate:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        groupMemberships:
          type: array
          description: 'Все группы INC, отсортированы по `group`.'
          items:
            $ref: '#/components/schemas/IncidentGroupMembership'
      additionalProperties: false
    IncidentCard:
      type: object
      description: Карточка INC (карточка в ITSM).
      required:
        - id
        - stateEnum
        - priorityId
        - submitDate
        - deadline
        - groupMemberships
        - eventSeq
        - revision
      properties:
        id:
          $ref: '#/components/schemas/IncidentId'
        header:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        productName:
          type:
            - string
            - 'null'
        productMasterId:
          type:
            - string
            - 'null'
        service:
          type:
            - string
            - 'null'
        serviceType:
          type:
            - string
            - 'null'
        assignedGroupName:
          type:
            - string
            - 'null'
        stateEnum:
          $ref: '#/components/schemas/ItsmIncidentState'
        stateReason:
          type:
            - string
            - 'null'
        priorityId:
          type: integer
          minimum: 1
          maximum: 4
        submitDate:
          $ref: '#/components/schemas/UtcInstant'
        lastAssignmentToTeamDateTime:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        deadline:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: '`null` — срока нет; отсутствие или `0001-01-01T00:00:00Z` в снимке.'
        completionDate:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: 'Только у завершённых (`Resolved`, `Closed`, `Research`); у активных — `null`.'
        solution:
          type:
            - string
            - 'null'
          description: 'Только у завершённых; у активных — `null`.'
        groupMemberships:
          type: array
          items:
            $ref: '#/components/schemas/IncidentGroupMembership'
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
      additionalProperties: false
    IncidentList:
      type: object
      required:
        - eventSeq
        - revision
        - beforeFirstSuccess
        - groups
        - items
        - nextCursor
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
        beforeFirstSuccess:
          type: boolean
          description: '`true`, пока нет ни одной опубликованной версии: списки пусты, группы пусты.'
        groups:
          type: array
          description: 'Группы дашборда в порядке отображения; при `beforeFirstSuccess` — `[]`.'
          items:
            $ref: '#/components/schemas/IncidentGroup'
        items:
          type: array
          items:
            $ref: '#/components/schemas/IncidentSummary'
        nextCursor:
          type:
            - string
            - 'null'
          description: '`null` — страниц больше нет.'
      additionalProperties: false
    IncidentGroup:
      type: object
      required:
        - key
        - title
        - rule
        - active
        - incidentCount
        - incidents
        - fixed
      description: 'Группа дашборда. Пустая группа — `incidents: []` и `incidentCount: 0`.'
      properties:
        key:
          $ref: '#/components/schemas/IncidentGroupKey'
        title:
          type: string
        rule:
          type: string
        active:
          type: boolean
          description: 'Активные — `critical`, `high`, `coordinator`; `research` — завершённая.'
        incidentCount:
          type: integer
          minimum: 0
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/IncidentSummary'
        fixed:
          anyOf:
            - $ref: '#/components/schemas/EventSeq'
            - type: 'null'
          description: '`null`: состав групп меняется с событиями, поэтому не фиксируется.'
      additionalProperties: false
    IncidentNotFound:
      type: object
      required:
        - code
        - message
        - eventSeq
        - revision
      properties:
        code:
          type: string
          const: INCIDENT_NOT_FOUND
        message:
          type: string
          minLength: 1
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
      additionalProperties: false
    SourceList:
      type: object
      required:
        - eventSeq
        - revision
        - sources
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
          description: Глобальная опубликованная версия для интерфейса.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceStatus'
      additionalProperties: false
    SourceStatus:
      type: object
      required:
        - sourceId
        - kind
        - revision
        - sourceVersion
        - lastReceivedAt
        - lastSuccessAt
        - batchStatus
        - stale
        - staleAfterSeconds
      properties:
        sourceId:
          type: string
        kind:
          type: string
          enum:
            - ITCS
        revision:
          $ref: '#/components/schemas/PublishedRevision'
        sourceVersion:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: 'Последняя доставка. Не `revision` и не `eventSeq`.'
        lastReceivedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        lastSuccessAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        batchStatus:
          type:
            - string
            - 'null'
          enum:
            - RECEIVED
            - PROCESSING
            - SUCCEEDED
            - FAILED
            - null
          description: Статус последнего принятого пакета.
        stale:
          type: boolean
        staleAfterSeconds:
          type: integer
          minimum: 1
      additionalProperties: false
    IncidentChange:
      type: object
      required:
        - id
        - groupMemberships
      properties:
        id:
          $ref: '#/components/schemas/IncidentId'
        groupMemberships:
          type: array
          description: 'Группы INC после изменения; для `removed` — группы, в которых он был.'
          items:
            $ref: '#/components/schemas/IncidentGroupMembership'
      additionalProperties: false
    DashboardEvent:
      type: object
      required:
        - eventId
        - type
        - eventSeq
        - occurredAt
        - incident
      properties:
        eventId:
          type: string
          pattern: '^evt-[0-9]{4,}$'
        type:
          type: string
          enum:
            - upserted
            - removed
            - heartbeat
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Метка события; следующий опрос — с `nextEventSeq`.'
        occurredAt:
          $ref: '#/components/schemas/UtcInstant'
        incident:
          anyOf:
            - $ref: '#/components/schemas/IncidentChange'
            - type: 'null'
          description: '`null` только для `heartbeat`.'
      additionalProperties: false
    EventBatch:
      type: object
      required:
        - eventSeq
        - nextEventSeq
        - stale
        - source
        - events
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Текущий `eventSeq` публикации на момент ответа.'
        nextEventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Курсор следующего опроса (`0`, если продолжать нечем).'
        stale:
          type: boolean
          description: '`true` — данных нет давно; клиент показывает публикацию как устаревшую.'
        source:
          anyOf:
            - $ref: '#/components/schemas/SourceStatus'
            - type: 'null'
        events:
          type: array
          items:
            $ref: '#/components/schemas/DashboardEvent'
      additionalProperties: false
    EventAckRequest:
      type: object
      required:
        - eventIds
      properties:
        eventIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            pattern: '^evt-[0-9]{4,}$'
          description: 'Точный набор `eventId` из ответа `events`.'
      additionalProperties: false
    EventAck:
      type: object
      required:
        - eventSeq
        - confirmedEventIds
        - status
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Наивысший полностью подтверждённый `eventSeq`.'
        confirmedEventIds:
          type: array
          items:
            type: string
            pattern: '^evt-[0-9]{4,}$'
        status:
          type: string
          enum:
            - acknowledged
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
          minLength: 1
      additionalProperties: false
