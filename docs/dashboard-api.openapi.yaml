openapi: 3.1.0
info:
  title: Dashboard — чтения координатора (KAN-7)
  version: 1.0.0
  description: |
    Канонический контракт чтений дашборда: список и группы инцидентов, карточка и её связи,
    статус источника, polling по `eventSeq`, подтверждения и сводка мониторинга за 24 часа.
    Согласован в KAN-20 с приёмом снимков (`itsm-ingest.openapi.yaml`, KAN-27/KAN-53).
    Список, карточка и связи читаются из опубликованных снимков. Для статуса источника, polling и
    подтверждений в этой спецификации пока приведены только примеры.
    Примеры синтетические (INC `INC0000210955xx` не пересекаются с реальной выгрузкой),
    валидируются схемами и пригодны фронту до готовности БД.

    ## Один канонический маршрут для каждого чтения

    | Чтение | Маршрут | Следствие |
    | --- | --- | --- |
    | Список | `GET /api/dashboard/incidents` | группы через `group`; отдельного маршрута групп нет |
    | Карточка | `GET /api/dashboard/incidents/{incidentId}` | `incidentId` — строковый INC, URL-кодируется |
    | Мониторинг | `GET /api/dashboard/monitoring/summary` | текущие счётчики + только фактические публикации за 24 ч |
    | Связи карточки | `GET /api/incidents/{id}/relationships` | `id` — строковый INC фокуса; глубина один шаг |
    | Статус источника | `GET /api/dashboard/sources` | все источники, включая stale |
    | Polling | `GET /api/dashboard/events?sinceEventSeq=` | события с `eventSeq > sinceEventSeq` |
    | Подтверждение | `POST /api/dashboard/events/ack` | точный набор `eventId`, без `since` и «до» |

    Статус снимка приёма (`GET /api/snapshot/status`, KAN-27) — отдельное операционное
    чтение; здесь не дублируется.

    ## Общие правила

    - **`id` — строка**: `INC000021095531`. Число в `id` — ошибка модели.
    - **Даты — UTC**, ISO-8601 с `Z`, до микросекунд. Исходные `YYYY-MM-DD HH:MM:SS` без зоны
      ITCS считает UTC (как парсер KAN-21).
    - **Nullable-поля** объявлены явно: `deadline` (карточка без срока), `completionDate` и
      `solution` (только у завершённых), `stateReason`, `lastAssignmentToTeamDateTime`,
      `group.fixed`, а также `revision` у источника до первой публикации.
    - **`revision`** — опубликованная ревизия изменений, то же значение, что в
      `GET /api/snapshot/status`. «Снимок revision 42» означает, что блок ответа построен ровно
      из этой публикации.
    - **`eventSeq`** — счётчик публикаций, версия блока статуса. Список и карточка
      берут его из подтверждённых публикаций (в том числе без изменений содержимого);
      при приёме пакета без публикации счётчик не меняется. Его возвращают все чтения,
      в том числе `404`.
    - **`sourceVersion`** вида `X-Source-Version` — версия доставки отправителя. Не `revision`
      и не `eventSeq`: `202` не публикует данные, а несколько версий доставки между
      опросами сворачиваются в одну публикацию с новым `eventSeq`.

    ## polling и ack

    `events` возвращает изменения с `eventSeq > sinceEventSeq` в порядке возрастания.
    `nextEventSeq` события: `upserted` — `revision`, после которой появилось изменение;
    `removed` — `eventSeq`, после которого INC исчез из полного снимка. `heartbeat`
    (пустой `changes`, `nextEventSeq` текущий) приходит раз в 30 с, чтобы соединение было
    видно как живое.

    Новая публикация revision N+1 увеличивает `eventSeq`, даже если набор INC не изменился:
    `eventSeq` версионирует блок статуса, а не содержимое снимка. Два изменения одного INC
    (например, обновление и удаление) — два разных `eventId` с разными `eventSeq`.

    `POST /events/ack` принимает **точный** список `eventId`, полученный в `events`.
    Подтверждённый `eventSeq` — наибольший `eventSeq`, при котором все события до него входят
    в подтверждённый набор; `confirmedEventIds` эхом повторяет принятый набор. Повторный `ack`
    с тем же набором — `200` без побочных эффектов. Неизвестный, чужой или уже вытесненный из
    журнала `eventId` — `400 ACK_EVENT_UNKNOWN`, ничего не подтверждается. «Подтвердить всё до
    N» не предусмотрено: клиент подтверждает только увиденное.

    ## Источник и свежесть

    `GET /api/dashboard/sources` описывает подключённый ITCS: `revision` опубликованной версии,
    `sourceVersion` последней доставки, `lastReceivedAt`/`lastSuccessAt`, `staleAfterSeconds`
    (по умолчанию 90 — три полных снимка по 30 с) и `stale`. Пока воркер не опубликовал снимок,
    `stale` остаётся `true`.

    ## Чтения и авторизация

    Список, карточка и связи используют человеческий Bearer JWT (KAN-16), если он настроен;
    иначе действуют локальные форма входа и HTTP Basic. Машинный мониторинг источников —
    `machineBearer` (предлагается). В KAN-27 машинная цепочка с правом импорта действует
    только на `/api/integrations/itsm/**`.

    ## Подключение браузерного SPA (KAN-64)

    Фронтенд (React + Vite) ходит на `/api/**` со своего origin и авторизуется
    Authorization Code + PKCE через публичный клиент `dashboard-web`; полученный access
    token отправляется в `Authorization: Bearer`. Кросс-доменные запросы браузера
    обслуживает CORS-конфигурация человеческой цепочки:

    - разрешённые origins — env `APP_CORS_ALLOWED_ORIGINS` (через запятую), по умолчанию
      dev-origins `http://localhost:3000,http://localhost:5173`;
    - методы `GET/POST/PATCH/PUT/DELETE/OPTIONS`; заголовки запроса `Authorization`,
      `Content-Type`, `If-None-Match`, `X-Request-Id`; preflight `OPTIONS` проходит без
      аутентификации и кешируется на час;
    - браузеру доступны заголовки ответа `ETag`, `Location`, `X-Request-Id`;
    - чужой origin не получает `Access-Control-Allow-Origin` (403 без CORS-заголовков);
      ответ без токена — `401`.

    Машинная цепочка `/api/integrations/itsm/**` CORS не открывает: приём снимков —
    серверный маршрут вне браузера. Подробности подключения — `docs/spa-access.md`.

    ## Ошибки

    JSON-ошибки — `ErrorResponse` (`code`, `message`), как во всём приложении. Развёрнутая
    локальная цепочка UI для неаутентифицированного браузера отвечает редиректом формы (`302`);
    клиент с `Accept: application/json` получает `401 AUTH_REQUIRED`. При настроенном человеческом
    Bearer JWT отсутствие допустимого токена также даёт `401 AUTH_REQUIRED`. Машинный Bearer без прав —
    `401 MACHINE_AUTH_REQUIRED` с `WWW-Authenticate: Bearer`.

security:
  - cookieAuth: []
  - machineBearer: []
paths:
  /api/dashboard/incidents:
    get:
      operationId: listIncidents
      security: [{coordinatorBearer: []}]
      summary: Список инцидентов и групп (KAN-7)
      description: |
        Единственный маршрут списка. Без `group` — все опубликованные `Assigned` и
        `WorkInProgress`, а также `Research`: он остаётся видимым в своей группе. С `group`
        (параметр повторяется) `items` содержит объединение выбранных групп без дублей.
        `includeCompleted=false` скрывает `Resolved` и `Closed`, но не `Research`. P4 на координаторах входит
        одновременно в `critical` и `coordinator`; `groupMemberships` всегда содержит все группы INC.
        Порядок: по `updatedAt` (если передан), иначе по времени последнего изменения на публикации,
        а для исходной карточки — по наиболее поздней дате регистрации, назначения или устранения.
        При равном времени — по строковому `id` по возрастанию. На первой странице счётчики
        выбранных групп относятся ко всей выборке, а `incidents` — только к этой странице;
        невыбранные группы пусты. На следующих страницах `groups` пуст.
      parameters:
        - name: group
          in: query
          description: 'Группа дашборда; повторяется для выбора нескольких. Неизвестная группа — `400 INVALID_GROUP`.'
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/IncidentGroupKey'
        - name: includeCompleted
          in: query
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          required: false
          description: 'Непрозрачный курсор из предыдущего `nextCursor`, действует для той же публикации и параметров. Без курсора — первая страница; после `INVALID_CURSOR` начните с неё.'
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: Accept
          in: header
          required: false
          description: |
            `application/json` (по умолчанию). `text/csv` — плоская выгрузка: INC по
            строке без курсора и среза.
          schema:
            type: string
            enum:
              - application/json
              - text/csv
      responses:
        '200':
          description: Страница инцидентов с группами.
          headers:
            ETag:
              description: 'ETag на основе `eventSeq` и параметров представления; верните его в `If-None-Match` для проверки на `304`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentList'
              examples:
                defaultList:
                  summary: 'Критические и группы. P4 в двух группах, INC без срока, research и завершённый INC (fixture list-default)'
