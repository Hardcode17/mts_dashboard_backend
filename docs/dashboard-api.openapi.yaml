  /api/dashboard/events/ack:
    post:
      operationId: acknowledgeEvents
      summary: Подтвердить точный набор eventId (KAN-7)
      description: |
        Идемпотентно: повтор того же набора — тот же `200` и `eventSeq`. Порядок не
        важен. Набор сравнивается целиком: неизвестный, чужой или уже вытесненный `eventId` —
        `400 ACK_EVENT_UNKNOWN`, и ничего не подтверждается.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventAckRequest'
            examples:
              twoEvents:
                summary: Оба события INC000021095533 (fixture events-ack-request)
                x-fixture: events-ack-request
                value:
                  eventIds:
                    - evt-0002
                    - evt-0003
      responses:
        '200':
          description: 'Набор подтверждён; `eventSeq` — подтверждённая позиция.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAck'
              examples:
                twoEvents:
                  summary: Подтверждены evt-0002 и evt-0003 (fixture events-ack-response)
                  x-fixture: events-ack-response
                  value:
                    eventSeq: 43
                    confirmedEventIds:
                      - evt-0002
                      - evt-0003
                    status: acknowledged
        '400':
          description: Некорректный набор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownEvent:
                  summary: eventId не входит в журнал
                  value: {"code": "ACK_EVENT_UNKNOWN", "message": "Unknown eventId evt-0009"}
                emptySet:
                  summary: Пустой набор eventId
                  value: {"code": "ACK_EVENTS_INVALID", "message": "eventIds must contain 1-1000 unique ids"}
                duplicateIds:
                  summary: Повтор внутри набора eventId
                  value: {"code": "ACK_EVENTS_INVALID", "message": "eventIds must contain no duplicates"}
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
  /api/incidents/{incidentId}/investigations:
    post:
      operationId: launchIncidentInvestigation
      security: [{coordinatorBearer: []}]
      summary: Запустить AI-расследование инцидента (KAN-40)
      description: |
        Асинхронный запуск расследования по карточке одного INC. Backend читает
        опубликованную карточку и свидетельства источников KAN-39 за последнее окно
        наблюдения, привязывает запуск к опубликованной `revision`, сохраняет факты
        (каждый со своим `evidenceId`), явные пробелы и запрос к модели, и только после
        этого ставит ответ модели в очередь. Тело ответа — текущее состояние запуска;
        результат читается через `GET /api/incidents/{incidentId}/investigations/{runId}`.

        У активного INC (`Assigned`, `WorkInProgress`) решение (`solution`) никогда не
        уходит модели. Реальный вызов модели включается профилем `ai` с ключом; без
        модели запуск отклоняется явным `503 AI_MODEL_NOT_CONFIGURED`, карточка INC
        остаётся доступной. Один и тот же INC можно расследовать повторно: запуски не
        переиспользуются и не перезаписываются.
      parameters:
        - {name: incidentId, in: path, required: true, schema: {$ref: '#/components/schemas/IncidentId'}}
      responses:
        '202':
          description: 'Запуск принят; модель отвечает асинхронно. Читай статус через `runId`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiInvestigationRun'
              examples:
                running:
                  summary: Факты собраны, модель ещё отвечает
                  value:
                    runId: 3f9c1d5e-2b47-49a1-8f6c-9d0e1a2b3c4d
                    incidentId: INC0000420001
                    status: running
                    revision: 42
                    stale: false
                    windowFrom: '2026-11-20T08:00:00Z'
                    windowTo: '2026-11-20T10:00:00Z'
                    hypothesis: null
                    nextStep: null
                    facts:
                      - evidenceId: itsm:INC0000420001
                        source: ITSM
                        serviceKey: svc-itsm-checkout
                        observedAt: '2026-11-20T09:05:00Z'
                        message: null
                        messageTruncated: null
                        level: HIGH
                        assignedCommand: 'Дежурные платёжных сервисов'
                        recordCount: null
                        value: null
                        serviceState: Assigned
                      - evidenceId: log:log-rec-1
                        source: LOG
                        serviceKey: svc-log-checkout
                        observedAt: '2026-11-20T09:15:00Z'
                        message: 'payment authorization timed out'
                        messageTruncated: false
                        level: WARN
                        assignedCommand: null
                        recordCount: null
                        value: null
                        serviceState: null
                      - evidenceId: diag:diag-rec-1
                        source: DATABASE
                        serviceKey: svc-db-checkout
                        observedAt: '2026-11-20T09:30:00Z'
                        message: null
                        messageTruncated: null
                        level: null
                        assignedCommand: null
                        recordCount: 42
                        value: 99
                        serviceState: null
                    unavailableSources: []
                    errorCode: null
                    errorMessage: null
                    createdAt: '2026-11-20T10:00:31.123456Z'
                    finishedAt: null
        '400':
          description: Идентификатор не в формате INC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidIncidentId:
                  summary: Идентификатор не в формате INC
                  value: {"code": "INVALID_INCIDENT_ID", "message": "incidentId must be an INC identifier such as INC000021095531"}
        '401':
          description: Требуется Bearer JWT координатора.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authRequired:
                  summary: Нет Bearer JWT
                  value: {"code": "HUMAN_AUTH_REQUIRED", "message": "Human access token is required"}
        '403':
          description: Нет локального допуска.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                coordinatorAccessDenied:
                  summary: Токен без локального допуска координатора
                  value: {"code": "COORDINATOR_ACCESS_DENIED", "message": "Coordinator access is not granted"}
        '404':
          description: INC не найден в публикации или не привязан к источникам свидетельств.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/IncidentNotFound'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: INC отсутствует в опубликованной версии
                  value:
                    code: INCIDENT_NOT_FOUND
                    message: Incident INC0000420009 not found
                    eventSeq: 43
                    revision: 42
                evidenceNotMapped:
                  summary: У INC нет явной привязки к сценарному прогону источников
                  value: {"code": "MCP_EVIDENCE_INCIDENT_NOT_MAPPED", "message": "Incident INC0000420009 has no explicit mapping to a scenario run"}
        '503':
          description: 'Расследование недоступно: не настроена модель или источники свидетельств.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                modelNotConfigured:
                  summary: Профиль модели или ключ не настроен
                  value: {"code": "AI_MODEL_NOT_CONFIGURED", "message": "The AI investigation model is not configured; enable the model profile and set its API key"}
                evidenceNotConfigured:
                  summary: Маппинг источников свидетельств не настроен
                  value: {"code": "AI_EVIDENCE_NOT_MAPPED", "message": "The evidence mapping required for an AI investigation is not configured"}
  '/api/incidents/{incidentId}/investigations/{runId}':
    get:
      operationId: getIncidentInvestigation
      security: [{coordinatorBearer: []}]
      summary: Прочитать запуск AI-расследования (KAN-40)
      description: |
        Возвращает один запуск: статус, привязанную `revision`, собранные факты со
        свидетельствами, явные пробелы, а для `completed` — гипотезу и следующий шаг.
        `stale` вычисляется при чтении: `true` означает, что опубликована более новая
        ревизия и ответ описывает старое состояние INC; сам ответ при этом сохранён и
        остаётся доступным. Запуск `failed` несёт явный код и причину ошибки вместо
        выдуманного ответа. Чужой `runId` (другой INC или несуществующий) — `404
        AI_RUN_NOT_FOUND`.
      parameters:
        - {name: incidentId, in: path, required: true, schema: {$ref: '#/components/schemas/IncidentId'}}
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
