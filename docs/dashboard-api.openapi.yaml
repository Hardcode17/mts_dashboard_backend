  '/api/dashboard/incidents/{incidentId}':
    get:
      operationId: getIncidentCard
      summary: Карточка инцидента (KAN-7)
      description: |
        Полная карточка. `deadline` — `null`, если срока нет (нет поля, `null` или
        техническое `0001-01-01T00:00:00Z` в снимке). `completionDate` и `solution` — `null` у
        активных и заполнены у завершённых. Ответ всегда несёт `eventSeq` и `revision` публикации,
        из которой он построен.
      parameters:
        - name: incidentId
          in: path
          required: true
          description: 'Строковый INC, URL-кодируется; числовой вид не принимается.'
          schema:
            $ref: '#/components/schemas/IncidentId'
          examples:
            withoutDeadline:
              value: "INC000021095532"
            research:
              value: "INC000021095539"
      responses:
        '200':
          description: Карточка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentCard'
              examples:
                withoutDeadline:
                  summary: 'Активный P4 без срока, в двух группах (fixture card-without-deadline)'
                  x-fixture: card-without-deadline
                  value:
                    id: INC000021095532
                    header: Часть заказов не оплачивается через СБП
                    description: Синтетическое описание для контрактных примеров KAN-20.
                    productName: Оплата заказов
                    productMasterId: BI_pay
                    service: checkout-api
                    serviceType: Клиентский
                    assignedGroupName: КЦ ИТ Координаторы Массовых Инцидентов
                    stateEnum: WorkInProgress
                    stateReason: null
                    priorityId: 4
                    submitDate: '2026-11-21T09:01:00Z'
                    lastAssignmentToTeamDateTime: '2026-11-21T09:01:00Z'
                    deadline: null
                    completionDate: null
                    solution: null
                    groupMemberships:
