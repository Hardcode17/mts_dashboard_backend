    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      operationId: retryNotificationDelivery
      summary: Повторить одну упавшую доставку (KAN-35)
      description: |
        Повторяет только доставку в состоянии `failed`. Повтор доставки в любом другом
        состоянии — идемпотентный no-op: `200` с текущим состоянием и без новой отправки,
        успешные доставки не дублируются. Одновременные повторы одной доставки сериализуются
        в одну новую попытку. `failureReason` — короткий код без адресов, токенов и URL.
      security:
        - coordinatorBearer: []
      responses:
        '200':
          description: Текущее состояние доставки; для `failed` — результат новой попытки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDelivery'
              examples:
                retriedSuccessfully:
                  summary: Упавшая доставка доставлена повторно
                  value:
                    id: 902
                    connectionId: 13
                    channel: telegram
                    state: sent
                    failureReason: null
                    attempts: 2
                    sentAt: '2026-11-21T09:33:40Z'
                    deliveredAt: null
                    readInChannelAt: null
                    readInAppAt: null
                    lastAttemptAt: '2026-11-21T09:33:40Z'
