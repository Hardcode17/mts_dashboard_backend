                          errorCode: ERR-17
                        header: Сбой приёма платежей на кассах
                        stateEnum: Assigned
                        priorityId: 4
                        submitDate: '2026-11-21T09:00:00Z'
                        submitDifferenceSeconds: 60
                        isDouble: false
                        isMaster: false
                      - incidentId: INC000021095538
                        score: 60
                        reasons:
                          - 'Совпадает сервис: «checkout-api»'
                          - 'Регистрации отличаются на 2 мин — в пределах окна 72 ч'
                        sharedAttributes:
                          productName: Оплата заказов
                          service: checkout-api
                          scenarioName: null
