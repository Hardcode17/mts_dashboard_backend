                    assignedEmployeeLogin: demo2
                    assignedEmployee: 'Дежурный 3 (demo2)'
                    stateEnum: WorkInProgress
                    priorityId: 2
                    submitDate: '2026-11-08T12:02:29Z'
                    deadline: '2026-11-22T12:02:29Z'
                    completionDate: null
                    solution: null
                    remainingSeconds: 86400
