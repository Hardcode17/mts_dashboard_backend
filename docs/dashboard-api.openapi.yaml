  /api/dashboard/users:
    get:
      operationId: listItsmUsers
      security: [{coordinatorBearer: []}]
      summary: Внешние исполнители ITSM для назначения из карточки
      description: |
        Справочник внешних сотрудников, прочитанный backend-proxy из `GET /user` внешней
        ITSM. Браузер никогда не обращается к ITSM напрямую: список отдаётся под
        человеческим Bearer JWT координатора (KAN-22, KAN-58).
      responses:
        '200':
          description: Справочник внешних сотрудников, доступных для назначения ответственными.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [login]
                  additionalProperties: false
                  properties:
                    sysId: {type: string}
                    login: {type: string}
                    displayName: {type: string}
                    groupName: {type: [string, 'null']}
              examples:
                standDirectory:
                  summary: Дежурные смены и инженеры групп стенда
                  value:
                    - {sysId: demo0, login: demo0, displayName: 'Дежурный 1 (demo0)', groupName: 'КЦ ИТ Координаторы Массовых Инцидентов'}
                    - {sysId: demo2, login: demo2, displayName: 'Дежурный 3 (demo2)', groupName: 'Support'}
        '401':
          description: Требуется Bearer JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authRequired:
                  summary: Нет Bearer JWT
                  value: {"code": "HUMAN_AUTH_REQUIRED", "message": "Human access token is required"}
        '403':
          description: Нет локального допуска.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                coordinatorAccessDenied:
                  summary: Токен без локального допуска координатора
                  value: {"code": "COORDINATOR_ACCESS_DENIED", "message": "Coordinator access is not granted"}
        '503':
          description: Внешняя ITSM недоступна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                itsmOffline:
                  summary: ITSM не отвечает
                  value: {"code": "ITSM_OFFLINE", "message": "ITSM is unavailable"}
  '/api/dashboard/incidents/{incidentId}':
    patch:
      operationId: updateIncidentCard
      security: [{coordinatorBearer: []}]
      summary: Изменить назначение, группу или статус во внешней ITSM
      description: |
        Координатор меняет инцидент прямо из дашборда: назначает ответственного из
        `GET /api/dashboard/users`, передаёт группу решения или переводит статус.
        Изменение сначала уходит в ITSM (`PATCH /itsm_incident/{sys_id}`); только после
        подтверждения backend обновляет локальное состояние и пишет автора в журнал.
        Ошибка ITSM оставляет локальные данные неизменными (KAN-57, KAN-58).
      parameters:
        - {name: incidentId, in: path, required: true, schema: {$ref: '#/components/schemas/IncidentId'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                assignedEmployeeLogin: {type: [string, 'null']}
                assignedEmployee: {type: [string, 'null']}
                assignedGroupName: {type: string, minLength: 1}
                stateEnum: {$ref: '#/components/schemas/ItsmIncidentState'}
                solution: {type: string}
            examples:
              assignResponsible:
                summary: Назначить ответственного из справочника
                value: {assignedEmployeeLogin: demo2}
              handOffToGroup:
                summary: Передать группе решения
                value: {assignedGroupName: Support}
              resolveWithSolution:
                summary: Завершить с решением
                value: {stateEnum: Resolved, solution: 'Восстановлен основной канал приёма платежей'}
      responses:
        '200':
          description: Обновлённая карточка после подтверждения ITSM.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncidentCard'}
              examples:
                afterAssignment:
                  summary: Карточка после назначения ответственного и смены группы
                  value:
                    id: INC000021931151
                    header: Сбой приёма платежей на кассах
