  '/api/dashboard/incidents/{incidentId}/confirmed-links':
    post:
      operationId: confirmIncidentLink
      summary: Подтвердить связь двух инцидентов (KAN-41)
      description: |
        Подтверждает связь двух опубликованных INC от имени координатора.
        У related_to номера упорядочены по возрастанию. У causes и duplicate_of
        направление идёт от INC в пути к INC в теле. Повтор возвращает ту же связь
        с исходными автором и временем. Связь видна в обеих карточках.
      security: [{coordinatorBearer: []}]
      parameters:
        - {name: incidentId, in: path, required: true, schema: {$ref: '#/components/schemas/IncidentId'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetIncidentId, kind]
              properties:
                targetIncidentId: {$ref: '#/components/schemas/IncidentId'}
                kind: {$ref: '#/components/schemas/IncidentLinkKind'}
            examples:
              relatedTo:
                summary: Подтвердить симметричную связь
                value: {targetIncidentId: INC000021095532, kind: related_to}
      responses:
        '200':
          description: Сохранённая связь, включая результат повтора.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfirmedIncidentLink'}
              examples:
                relatedTo:
                  summary: Подтверждённая связь с автором и временем
                  value:
                    id: 21
                    sourceIncidentId: INC000021095531
                    targetIncidentId: INC000021095532
                    kind: related_to
                    confirmedByUserId: 7
                    createdAt: '2026-11-21T09:00:00Z'
        '400':
          description: Недопустимые номер, тип связи или тело запроса.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                selfLink:
                  summary: Инцидент нельзя связать с собой
                  value: {code: INVALID_INCIDENT_LINK, message: An incident link needs two different incidents and a supported kind}
                invalidId:
                  summary: Неверный формат номера
                  value: {code: INVALID_INCIDENT_ID, message: incidentId must be an INC identifier such as INC000021095531}
                invalidBody:
                  summary: Неверный синтаксис запроса
                  value: {code: INVALID_REQUEST_BODY, message: Request body is malformed or missing}
        '401':
          description: Нет действительного Bearer JWT.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingToken:
                  summary: Нет токена координатора
                  value: {code: HUMAN_AUTH_REQUIRED, message: Human access token is required}
        '403':
          description: Пользователь не допущен к рабочему месту координатора.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                noAccess:
                  summary: Нет локального допуска
                  value: {code: COORDINATOR_ACCESS_DENIED, message: Coordinator access is not granted}
        '404':
          description: Один из INC отсутствует в опубликованных данных.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncidentNotFound'}
              examples:
                missingIncident:
                  summary: Целевой INC не найден
                  value:
                    code: INCIDENT_NOT_FOUND
                    message: Incident INC000021095532 not found
                    eventSeq: 43
                    revision: 42
