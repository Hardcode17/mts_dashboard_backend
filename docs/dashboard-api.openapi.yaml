                    id: 901
                    connectionId: 12
                    channel: email
                    state: sent
                    failureReason: null
                    attempts: 1
                    sentAt: '2026-11-21T09:30:12Z'
                    deliveredAt: null
                    readInChannelAt: null
                    readInAppAt: null
                    lastAttemptAt: '2026-11-21T09:30:12Z'
        '401':
          description: Нужен токен координатора.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                authenticationRequired:
                  summary: Нет действительного токена
                  value: { code: HUMAN_AUTH_REQUIRED, message: Human access token is required }
        '403':
          description: У пользователя нет локального допуска.
