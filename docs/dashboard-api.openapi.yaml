        - coordinatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationConnectionSettings' }
            examples:
              disableEmail:
                summary: Выключить подключение для P4
                value: { channel: email, address: coordinator@example.test, active: false, priorityIds: [4] }
