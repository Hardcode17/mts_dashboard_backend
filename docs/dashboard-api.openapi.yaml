  '/api/dashboard/incidents/{incidentId}/postmortem':
    get:
      operationId: getIncidentPostmortemDraft
      summary: Последний черновик постмортема (KAN-51)
      description: |
        Черновик фиксирует доступные факты при явном переходе в Resolved.
        Содержит до 100 записей истории, заметок и фактов последнего расследования.
        При недостатке данных список gaps указывает, какие источники недоступны.
        Поле rootCause содержит null, пока причина не подтверждена.
      security: [{coordinatorBearer: []}]
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/IncidentId'}
      responses:
        '200':
          description: Сохранённый черновик.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostmortemDraft'}
              examples:
                resolved:
                  summary: Смена наблюдала восстановление, источник диагностики недоступен
                  value:
                    incidentId: INC000021095531
                    resolutionEventSeq: 44
                    observedAt: '2026-11-21T13:45:00Z'
                    resolutionText: Сервис восстановлен
                    rootCause: null
                    timeline:
                      - eventSeq: 44
                        observedAt: '2026-11-21T13:45:00Z'
                        changeKind: UPDATED
                        beforeState: WorkInProgress
                        afterState: Resolved
                        href: /api/dashboard/incidents/INC000021095531/history
                    notes: []
                    evidence: []
                    gaps: [EVIDENCE_UNAVAILABLE]
        '400':
          description: Некорректный номер инцидента.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalidId:
                  summary: Ожидается строковый номер инцидента
                  value: {code: INVALID_INCIDENT_ID, message: 'incidentId must be an INC identifier such as INC000021095531'}
        '401':
          description: Требуется токен координатора.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                unauthorized:
                  summary: Токен отсутствует
                  value: {code: HUMAN_AUTH_REQUIRED, message: Human access token is required}
        '403':
          description: Нет допуска координатора.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                forbidden:
                  summary: Пользователю не выдан допуск
