  /api/dashboard/events:
    get:
      operationId: pollEvents
      summary: Polling изменений по eventSeq (KAN-7)
      description: |
        События с `eventSeq > sinceEventSeq`, по возрастанию. Два события одного INC
        (обновление и удаление) приходят разными `eventId` и `eventSeq`.
      parameters:
        - name: sinceEventSeq
          in: query
          required: true
          description: 'Последний обработанный `eventSeq`; `0` — с начала.'
          schema:
            $ref: '#/components/schemas/EventSeq'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Изменения.
          headers:
            ETag:
              description: '`eventSeq` выборки; `If-None-Match` с ним даёт `304`, когда новых событий нет.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatch'
              examples:
                twoEventsSameIncident:
                  summary: Обновление и удаление одного INC — два eventId (fixture events-poll-two-events)
                  x-fixture: events-poll-two-events
                  value:
                    eventSeq: 43
                    nextEventSeq: 43
                    stale: false
                    source:
                      sourceId: itcs-prod
                      kind: ITCS
                      revision: 42
                      sourceVersion: 42
                      lastReceivedAt: '2026-11-21T09:05:00.123456Z'
                      lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                      batchStatus: SUCCEEDED
                      stale: false
                      staleAfterSeconds: 90
                    events:
                      - eventId: evt-0002
                        type: upserted
                        eventSeq: 43
                        occurredAt: '2026-11-21T09:05:00.500000Z'
                        incident:
                          id: INC000021095533
                          groupMemberships:
                            - group: high
                              matchedRule: priorityId = 3
                      - eventId: evt-0003
                        type: removed
                        eventSeq: 43
                        occurredAt: '2026-11-21T09:05:00.500000Z'
                        incident:
                          id: INC000021095533
                          groupMemberships:
                            - group: high
                              matchedRule: priorityId = 3
                heartbeat:
                  summary: 'Изменений нет, событие-сердцебиение (fixture events-heartbeat)'
                  x-fixture: events-heartbeat
                  value:
                    eventSeq: 43
                    nextEventSeq: 43
                    stale: false
                    source:
                      sourceId: itcs-prod
                      kind: ITCS
                      revision: 42
                      sourceVersion: 42
                      lastReceivedAt: '2026-11-21T09:05:00.123456Z'
                      lastSuccessAt: '2026-11-21T09:05:01.000000Z'
                      batchStatus: SUCCEEDED
                      stale: false
                      staleAfterSeconds: 90
                    events:
                      - eventId: evt-0004
                        type: heartbeat
                        eventSeq: 43
                        occurredAt: '2026-11-21T09:05:00.500000Z'
                        incident: null
        '304':
          description: 'С указанного `eventSeq` изменений не было.'
        '400':
          description: Некорректный запрос.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSinceEventSeq:
                  summary: Обязательный sinceEventSeq отсутствует
                  value: {"code": "INVALID_EVENT_SEQ", "message": "sinceEventSeq is required"}
                eventSeqOverflow:
                  summary: sinceEventSeq вне int64
                  value: {"code": "INVALID_EVENT_SEQ", "message": "sinceEventSeq must be in [0, 9223372036854775807]"}
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
  /api/dashboard/events/ack:
    post:
      operationId: acknowledgeEvents
      summary: Подтвердить точный набор eventId (KAN-7)
      description: |
        Идемпотентно: повтор того же набора — тот же `200` и `eventSeq`. Порядок не
        важен. Набор сравнивается целиком: неизвестный, чужой или уже вытесненный `eventId` —
        `400 ACK_EVENT_UNKNOWN`, и ничего не подтверждается.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventAckRequest'
            examples:
              twoEvents:
                summary: Оба события INC000021095533 (fixture events-ack-request)
                x-fixture: events-ack-request
                value:
                  eventIds:
                    - evt-0002
                    - evt-0003
      responses:
        '200':
          description: 'Набор подтверждён; `eventSeq` — подтверждённая позиция.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAck'
              examples:
                twoEvents:
                  summary: Подтверждены evt-0002 и evt-0003 (fixture events-ack-response)
                  x-fixture: events-ack-response
                  value:
                    eventSeq: 43
                    confirmedEventIds:
                      - evt-0002
                      - evt-0003
                    status: acknowledged
        '400':
          description: Некорректный набор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unknownEvent:
                  summary: eventId не входит в журнал
                  value: {"code": "ACK_EVENT_UNKNOWN", "message": "Unknown eventId evt-0009"}
                emptySet:
                  summary: Пустой набор eventId
                  value: {"code": "ACK_EVENTS_INVALID", "message": "eventIds must contain 1-1000 unique ids"}
                duplicateIds:
                  summary: Повтор внутри набора eventId
                  value: {"code": "ACK_EVENTS_INVALID", "message": "eventIds must contain no duplicates"}
        '401':
          description: Нет допустимой сессии или токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cookieAuthRequired:
                  summary: Нет сессии интерфейса
                  value: {"code": "AUTH_REQUIRED", "message": "Authentication is required"}
components:
  securitySchemes:
    coordinatorBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Токен координатора Keycloak (`azp=dashboard-web`); после проверки подписи требуется локальный допуск (KAN-16, KAN-22). Токен импорта не подходит.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: 'Сессия интерфейса координатора; неаутентифицированный браузер перенаправляется на форму входа (`302`).'
    machineBearer:
      type: http
      scheme: bearer
      x-prospective: true
      description: |
        Предлагается, не развёрнуто: JWT Keycloak для машинного мониторинга.
        Проверяются `iss`, подпись JWKS, `exp`, `aud`; остальное — как `machineBearer` в
        `itsm-ingest.openapi.yaml`.
  schemas:
    IncidentId:
      type: string
      pattern: '^INC[0-9]{6,18}$'
      description: 'Строковый INC. Числовой JSON `id` недопустим.'
    UtcInstant:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|\+00:00)$'
      description: 'UTC, ISO-8601: `YYYY-MM-DDTHH:MM:SS[.ffffff]Z`. Иные смещения и локальное время не допускаются.'
    EventSeq:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
      description: 'Счётчик публикаций, версия блока статуса. Растёт на каждой применённой публикации, даже если состав INC не изменился.'
    PublishedRevision:
      type: integer
      format: int64
      minimum: 0
      description: 'Опубликованная версия источника из последнего успешного пакета. `0` — публикации ещё нет.'
    IncidentGroupKey:
      type: string
      enum:
        - critical
        - coordinator
        - high
        - research
      description: |
        `critical` — активный P4; `high` — активный P3; `coordinator` — активный или
        Research с назначением на координаторов массовых инцидентов; `research` —
        `stateEnum = Research` при любой дате устранения.
    ItsmIncidentState:
      type: string
      enum:
        - Assigned
        - WorkInProgress
        - Resolved
        - Closed
        - Research
    IncidentGroupMembership:
      type: object
      required:
        - group
        - matchedRule
      properties:
        group:
          $ref: '#/components/schemas/IncidentGroupKey'
        matchedRule:
          type: string
          description: 'Правило, по которому INC попал в группу.'
      additionalProperties: false
    IncidentSummary:
      type: object
      required:
        - id
        - stateEnum
        - priorityId
        - submitDate
        - deadline
        - groupMemberships
      description: Строка списка групп.
      properties:
        assignedEmployeeLogin: {type: [string, 'null']}
        assignedEmployee: {type: [string, 'null']}
        id:
          $ref: '#/components/schemas/IncidentId'
        productName:
          type:
            - string
            - 'null'
        assignedGroupName:
          type:
            - string
            - 'null'
        stateEnum:
          $ref: '#/components/schemas/ItsmIncidentState'
        priorityId:
          type: integer
          format: int32
          description: 'Исходный приоритет ITSM. Только P4 и P3 влияют на группы `critical` и `high`.'
        submitDate:
          $ref: '#/components/schemas/UtcInstant'
        deadline:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: '`null` — срока нет.'
        completionDate:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        groupMemberships:
          type: array
          description: 'Все группы INC, отсортированы по `group`.'
          items:
            $ref: '#/components/schemas/IncidentGroupMembership'
      additionalProperties: false
    IncidentCard:
      type: object
      description: Карточка INC (карточка в ITSM).
      required:
        - id
        - stateEnum
        - priorityId
        - submitDate
        - deadline
        - assignedEmployee
        - remainingSeconds
        - overdue
        - itsmUrl
        - itsmDemo
        - groupMemberships
        - eventSeq
        - revision
      properties:
        itsmUrl: {type: string, format: uri}
        remainingSeconds: {type: [integer, 'null']}
        overdue: {type: boolean}
        assignedEmployeeLogin: {type: [string, 'null']}
        assignedEmployee: {type: [string, 'null']}
        id:
          $ref: '#/components/schemas/IncidentId'
        header:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        productName:
          type:
            - string
            - 'null'
        productMasterId:
          type:
            - string
            - 'null'
        service:
          type:
            - string
            - 'null'
        serviceType:
          type:
            - string
            - 'null'
        assignedGroupName:
          type:
            - string
            - 'null'
        assignedEmployee:
          type:
            - string
            - 'null'
          description: 'Официальный исполнитель по данным ITSM, не внутреннее назначение дашборда.'
        stateEnum:
          $ref: '#/components/schemas/ItsmIncidentState'
        stateReason:
          type:
            - string
            - 'null'
        priorityId:
          type: integer
          format: int32
          description: 'Исходный приоритет ITSM без подмены.'
        submitDate:
          $ref: '#/components/schemas/UtcInstant'
        lastAssignmentToTeamDateTime:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        deadline:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: '`null` — срока нет; отсутствие или `0001-01-01T00:00:00Z` в снимке.'
        completionDate:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: 'Только у завершённых (`Resolved`, `Closed`, `Research`); у активных — `null`.'
        solution:
          type:
            - string
            - 'null'
          description: 'Только у завершённых; у активных — `null`.'
        remainingSeconds:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Срок минус серверное время, в секундах с округлением вниз. Без срока и вне Assigned/WorkInProgress — `null`.'
        overdue:
          type: boolean
          description: 'Только для Assigned/WorkInProgress со сроком, когда серверное время строго больше срока. Ровно в срок — `false`.'
        itsmUrl:
          type: string
          format: uri
          description: 'Абсолютный HTTP(S) URL этого INC в ITSM; не productUrl.'
        itsmDemo:
          type: boolean
          description: 'Показывать явную пометку демоцели, если `true`.'
        groupMemberships:
          type: array
          items:
            $ref: '#/components/schemas/IncidentGroupMembership'
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
      additionalProperties: false
    IncidentList:
      type: object
      required:
        - eventSeq
        - revision
        - beforeFirstSuccess
        - groups
        - items
        - nextCursor
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
        beforeFirstSuccess:
          type: boolean
          description: '`true`, пока нет ни одной опубликованной версии: списки пусты, группы пусты.'
        groups:
          type: array
          description: 'Группы дашборда в порядке отображения; при `beforeFirstSuccess` — `[]`.'
          items:
            $ref: '#/components/schemas/IncidentGroup'
        items:
          type: array
          items:
            $ref: '#/components/schemas/IncidentSummary'
        nextCursor:
          type:
            - string
            - 'null'
          description: '`null` — страниц больше нет.'
      additionalProperties: false
    IncidentGroup:
      type: object
      required:
        - key
        - title
        - rule
        - active
        - incidentCount
        - incidents
        - fixed
      description: 'Группа дашборда. Пустая группа — `incidents: []` и `incidentCount: 0`.'
      properties:
        key:
          $ref: '#/components/schemas/IncidentGroupKey'
        title:
          type: string
        rule:
          type: string
        active:
          type: boolean
          description: 'Активные — `critical`, `high`, `coordinator`; `research` — завершённая.'
        incidentCount:
          type: integer
          minimum: 0
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/IncidentSummary'
        fixed:
          anyOf:
            - $ref: '#/components/schemas/EventSeq'
            - type: 'null'
          description: '`null`: состав групп меняется с событиями, поэтому не фиксируется.'
      additionalProperties: false
    IncidentNotFound:
      type: object
      required:
        - code
        - message
        - eventSeq
        - revision
      properties:
        code:
          type: string
          const: INCIDENT_NOT_FOUND
        message:
          type: string
          minLength: 1
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
      additionalProperties: false
    SourceList:
      type: object
      required:
        - eventSeq
        - revision
        - sources
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
        revision:
          $ref: '#/components/schemas/PublishedRevision'
          description: Глобальная опубликованная ревизия изменений для интерфейса.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceStatus'
      additionalProperties: false
    SourceStatus:
      type: object
      required:
        - sourceId
        - kind
        - revision
        - sourceVersion
        - lastReceivedAt
        - lastSuccessAt
        - batchStatus
        - stale
        - staleAfterSeconds
      properties:
        sourceId:
          type: string
        kind:
          type: string
          enum:
            - ITCS
        revision:
          $ref: '#/components/schemas/PublishedRevision'
        sourceVersion:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: 'Последняя доставка. Не `revision` и не `eventSeq`.'
        lastReceivedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        lastSuccessAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        batchStatus:
          type:
            - string
            - 'null'
          enum:
            - RECEIVED
            - PROCESSING
            - SUCCEEDED
            - FAILED
            - null
          description: Статус последнего принятого пакета.
        stale:
          type: boolean
        staleAfterSeconds:
          type: integer
          minimum: 1
      additionalProperties: false
    IncidentChange:
      type: object
      required:
        - id
        - groupMemberships
      properties:
        id:
          $ref: '#/components/schemas/IncidentId'
        groupMemberships:
          type: array
          description: 'Группы INC после изменения; для `removed` — группы, в которых он был.'
          items:
            $ref: '#/components/schemas/IncidentGroupMembership'
      additionalProperties: false
    DashboardEvent:
      type: object
      required:
        - eventId
        - type
        - eventSeq
        - occurredAt
        - incident
      properties:
        eventId:
          type: string
          pattern: '^evt-[0-9]{4,}$'
        type:
          type: string
          enum:
            - upserted
            - removed
            - heartbeat
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Метка события; следующий опрос — с `nextEventSeq`.'
        occurredAt:
          $ref: '#/components/schemas/UtcInstant'
        incident:
          anyOf:
            - $ref: '#/components/schemas/IncidentChange'
            - type: 'null'
          description: '`null` только для `heartbeat`.'
      additionalProperties: false
    EventBatch:
      type: object
      required:
        - eventSeq
        - nextEventSeq
        - stale
        - source
        - events
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Текущий `eventSeq` публикации на момент ответа.'
        nextEventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Курсор следующего опроса (`0`, если продолжать нечем).'
        stale:
          type: boolean
          description: '`true` — данных нет давно; клиент показывает публикацию как устаревшую.'
        source:
          anyOf:
            - $ref: '#/components/schemas/SourceStatus'
            - type: 'null'
        events:
          type: array
          items:
            $ref: '#/components/schemas/DashboardEvent'
      additionalProperties: false
    EventAckRequest:
      type: object
      required:
        - eventIds
      properties:
        eventIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            pattern: '^evt-[0-9]{4,}$'
          description: 'Точный набор `eventId` из ответа `events`.'
      additionalProperties: false
    EventAck:
      type: object
      required:
        - eventSeq
        - confirmedEventIds
        - status
      properties:
        eventSeq:
          $ref: '#/components/schemas/EventSeq'
          description: 'Наивысший полностью подтверждённый `eventSeq`.'
        confirmedEventIds:
          type: array
          items:
            type: string
            pattern: '^evt-[0-9]{4,}$'
        status:
          type: string
          enum:
            - acknowledged
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
          minLength: 1
      additionalProperties: false
