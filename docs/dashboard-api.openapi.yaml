                  summary: Закрытый инцидент нельзя вернуть в работу
                  value: {"code": "INCIDENT_CONFLICT", "message": "Incident update conflicts with the current state"}
        '502':
          description: Некорректный ответ ITSM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                badResponse:
                  summary: ITSM вернула непригодный ответ
                  value: {"code": "ITSM_BAD_RESPONSE", "message": "Invalid response from ITSM"}
        '503':
          description: Внешняя ITSM недоступна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                itsmOffline:
                  summary: ITSM не отвечает
                  value: {"code": "ITSM_OFFLINE", "message": "ITSM is unavailable"}
