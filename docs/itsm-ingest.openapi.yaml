                duplicateRecord:
                  summary: Идентификатор INC повторяется в снимке
                  value: {"code": "ITSM_DUPLICATE_RECORD", "message": "ITSM snapshot contains duplicate id; record at index 1 repeats index 0"}
        '401':
          description: 'Нет, просрочен или невалиден машинный Bearer (issuer, подпись JWKS, audience). Ответляет точка входа машинной цепочки.'
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                machineAuthRequired:
                  summary: Нет или невалиден машинный Bearer
                  value: {"code": "ITSM_MACHINE_AUTH_REQUIRED", "message": "Machine bearer token is required"}
        '403':
          description: 'Токен без машинного `azp` или без права импорта.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                machineAccessDenied:
                  summary: Токен без машинного azp или права импорта
                  value: {"code": "ITSM_MACHINE_ACCESS_DENIED", "message": "Machine client identity or itsm import permission is missing"}
        '409':
          description: Конфликт ключа или версии; состояние БД не меняется.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                idempotencyConflict:
                  summary: Ключ переиспользован с другими данными
                  value: {"code": "ITSM_IDEMPOTENCY_CONFLICT", "message": "Idempotency-Key was already used with different request metadata or payload"}
                sourceVersionConflict:
                  summary: Источник и версия уже приняты с другим ключом
                  value: {"code": "ITSM_SOURCE_VERSION_CONFLICT", "message": "Source version was already accepted with a different idempotency key"}
        '413':
          description: 'Тело больше ограничения LoggerFilter (`REQUEST_BODY_TOO_LARGE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bodyTooLarge:
                  summary: Тело больше ограничения
                  value: {"code": "REQUEST_BODY_TOO_LARGE", "message": "Request body exceeds 1048576 bytes"}
        '415':
          description: 'Content-Type не `application/json`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedMediaType:
                  summary: Content-Type не application/json
                  value: {"code": "UNSUPPORTED_MEDIA_TYPE", "message": "Content type is not supported"}
        '429':
          description: Очередь заполнена или источник публикует первый снимок. Повторите запрос с теми же заголовками и телом.
          headers:
            Retry-After:
              required: false
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                intakeQueueFull:
                  summary: Очередь необработанных пакетов заполнена
                  value: {"code": "ITSM_INTAKE_QUEUE_FULL", "message": "ITSM intake queue is full (1000 outstanding batches)"}
        '503':
          description: Приёмник временно недоступен.
  '/api/integrations/itsm/batches/{batchId}':
    get:
      operationId: getItsmBatch
      summary: Состояние принятого пакета (deployed)
      description: 'Метаданные пакета без исходного payload. Пока пакет не обработан — `RECEIVED` или `PROCESSING`; после успеха — `SUCCEEDED`, иначе `FAILED` с `diagnostic`. Опубликованную `revision` возвращает `GET /api/snapshot/status`, а не этот маршрут. '
      security:
        - machineBearer: []
      parameters:
        - name: batchId
          in: path
          required: true
          description: 'Значение `Idempotency-Key` принятого пакета.'
          schema:
            type: string
            format: uuid
          examples:
            sourceBatch:
              value: 3f2c1b9e-6a43-4c1a-9a37-0e5d7b2d4c11
      responses:
        '200':
          description: Метаданные пакета.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItsmBatchMetadata'
              examples:
                received:
                  summary: Пакет в очереди (fixture ingest-batch-received-200)
                  x-fixture: ingest-batch-received-200
                  value: {"batchId": "3f2c1b9e-6a43-4c1a-9a37-0e5d7b2d4c11", "sourceId": "itcs-prod", "sourceVersion": 42, "receivedAt": "2026-11-21T09:05:00.123456Z", "status": "RECEIVED", "diagnostic": null, "nextAttemptAt": null}
                receivedAfterRetry:
                  summary: 'Пакет, для которого назначен повтор (fixture ingest-batch-next-attempt-200)'
                  x-fixture: ingest-batch-next-attempt-200
                  value: {"batchId": "5b8e2c4d-1f6a-4d3b-8e27-9c0a1b2d3e4f", "sourceId": "itcs-prod", "sourceVersion": 43, "receivedAt": "2026-11-21T09:05:30.100000Z", "status": "RECEIVED", "diagnostic": null, "nextAttemptAt": "2026-11-21T09:06:00.100000Z"}
                succeeded:
                  summary: Опубликованный пакет (fixture ingest-batch-succeeded-200)
                  x-fixture: ingest-batch-succeeded-200
                  value: {"batchId": "3f2c1b9e-6a43-4c1a-9a37-0e5d7b2d4c11", "sourceId": "itcs-prod", "sourceVersion": 42, "receivedAt": "2026-11-21T09:05:00.123456Z", "status": "SUCCEEDED", "diagnostic": "applied snapshot revision 42", "nextAttemptAt": null}
                invalidRecord:
                  summary: Терминальная ошибка валидации после приёма пакета
                  x-fixture: ingest-batch-invalid-200
                  value: {"batchId": "3f2c1b9e-6a43-4c1a-9a37-0e5d7b2d4c11", "sourceId": "itcs-prod", "sourceVersion": 42, "receivedAt": "2026-11-21T09:05:00.123456Z", "status": "FAILED", "diagnostic": "ITSM_INVALID_RECORD: ITSM record in snapshot at index 0 has invalid field id: must be a string", "nextAttemptAt": null, "waitingForVersion": null}
        '401':
          description: Нет или невалиден машинный Bearer.
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                machineAuthRequired:
                  summary: Нет или невалиден машинный Bearer
                  value: {"code": "ITSM_MACHINE_AUTH_REQUIRED", "message": "Machine bearer token is required"}
        '403':
          description: Токен без права импорта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                machineAccessDenied:
                  summary: Токен без машинного azp или права импорта
                  value: {"code": "ITSM_MACHINE_ACCESS_DENIED", "message": "Machine client identity or itsm import permission is missing"}
        '404':
          description: Пакет не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                batchNotFound:
                  summary: Пакет с таким batchId не найден
                  value: {"code": "ITSM_BATCH_NOT_FOUND", "message": "ITSM batch 9c1f0e5a-8d2b-4a7e-b3c4-5d6e7f809112 not found"}
  /api/snapshot/status:
    get:
      operationId: getSnapshotStatus
      summary: Опубликованная версия снимка и его свежесть (deployed)
      description: |
        Состояние данных для интерфейса и отправителя. Все даты — UTC, ISO-8601 (`Z` или `+00:00`), до микросекунд.
        - `lastReceivedAt` — приём последнего пакета; `202` не означает публикацию. - `lastSuccessAt` и `revision` — последняя успешная обработка; `null`, пока успеха не было. - `stale` — `true`, пока последний принятый пакет не обработан успешно, или если новых снимков не было дольше `ITSM_INTAKE_STALE_AFTER` (по умолчанию 90 с; при снимке каждые 30 с допускается пропуск до трёх тиков).
        `revision` — ревизия изменения, а не версия полученного снимка или `eventSeq`.
      security:
        - form-or-basic: []
        - machineBearerProspective: []
      responses:
        '200':
          description: Текущее состояние снимка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotStatus'
              examples:
                beforeFirstSuccess:
                  summary: 'Снимок принят, но ещё не опубликован — stale (fixture snapshot-status-stale)'
                  x-fixture: snapshot-status-stale
                  value: {"lastReceivedAt": "2026-11-21T09:05:00.123456Z", "lastSuccessAt": null, "revision": null, "stale": true}
                published:
                  summary: Опубликован revision 42 (fixture snapshot-status-published)
                  x-fixture: snapshot-status-published
                  value: {"lastReceivedAt": "2026-11-21T09:05:00.123456Z", "lastSuccessAt": "2026-11-21T09:05:01.000000Z", "revision": 42, "stale": false}
                neverReceived:
                  summary: Снимков ещё не было
                  value: {"lastReceivedAt": null, "lastSuccessAt": null, "revision": null, "stale": true}
        '302':
          description: 'Развёрнутая версия: неаутентифицированный запрос из браузера перенаправляется на форму входа. Machine-клиент получает `401` без формы. '
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
              examples:
                loginForm:
                  summary: 'HTML формы входа, на которую перенаправляет приложение'
                  value: '<!DOCTYPE html><html><body><form method="post" action="/login"></form></body></html> '
        '401':
          description: 'Нет аутентификации: предлагаемая машинная цепочка отвечает JSON-ошибкой.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                machineAuthRequired:
                  summary: Нет или невалиден машинный Bearer
                  value: {"code": "ITSM_MACHINE_AUTH_REQUIRED", "message": "Machine bearer token is required"}
components:
  securitySchemes:
    machineBearer:
      type: http
      scheme: bearer
      description: 'JWT машинного клиента Keycloak: проверяются `iss`, подпись JWKS, `exp` и `aud`. Право импорта — `azp` = `ITSM_INTEGRATION_AUTH_CLIENT_ID` и роль `itsm:import` в `realm_access.roles`, `resource_access.<client-id>.roles` или `roles`. Без настроек приёмник отклоняет все токены (fail closed). '
    form-or-basic:
      type: http
      scheme: basic
      description: 'Развёрнутая цепочка приложения: HTTP Basic и форма входа. В браузере без сессии — `302` на форму; для машинного клиента — `401` при неверных данных. '
      x-prospective: false
    machineBearerProspective:
      type: http
      scheme: bearer
      description: 'Предлагается, не развёрнуто: машинная цепочка для `GET /api/snapshot/status` с теми же правилами, что `machineBearer`. '
      x-prospective: true
    humanBearer:
      type: http
      scheme: bearer
      description: Пользовательский JWT при включённой конфигурации KAN-16.
  schemas:
    IncidentId:
      type: string
      description: 'Идентификатор INC всегда строка, даже если похож на число: `INC000021095531`. Внутри снимка уникален; числовой JSON `id` — ошибка.'
      pattern: '^INC[0-9]{6,18}$'
    UtcInstant:
      type: string
      format: date-time
      description: 'Момент времени в UTC: ISO-8601 с `Z` или `+00:00`, целые секунды или микросекунды (`2026-11-21T09:05:00Z`). Локальное время без зоны приёмник считает UTC. '
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|\+00:00)$'
      examples:
        - '2026-11-21T09:05:00Z'
        - '2026-11-21T09:05:00.123456Z'
    ItsmIncident:
      type: object
      description: 'Запись полного снимка ITCS (`character_problems.json`). Незаявленные поля сохраняются как есть. `deadline` может отсутствовать, быть `null` или техническим `0001-01-01T00:00:00Z` — всё это «без срока». '
      required:
        - id
        - stateEnum
        - priorityId
        - submitDate
        - productName
        - solution
      properties:
        id:
          $ref: '#/components/schemas/IncidentId'
        priorityId:
          type: integer
          minimum: 0
          description: '4 — наивысший, 3 — высокий, 2 — средний, 1 — низкий.'
        stateEnum:
          type: string
          enum:
            - Assigned
            - WorkInProgress
            - Resolved
            - Closed
            - Research
          description: 'Активные — `Assigned`, `WorkInProgress`; завершённые — `Resolved`, `Closed`, `Research`. У завершённых обязательны `completionDate` и `solution`; у активных `completionDate` — `null`. '
          x-completed-states:
            - Resolved
            - Closed
            - Research
        stateId:
          type:
            - integer
            - 'null'
          description: 'Числовой статус исходной системы, справочно.'
        state:
          type:
            - string
            - 'null'
        submitDate:
          $ref: '#/components/schemas/UtcInstant'
        lastAssignmentToTeamDateTime:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        deadline:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: 'Срок решения; отсутствие, `null` или `0001-01-01T00:00:00Z` — без срока.'
        completionDate:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        solution:
          type:
            - string
            - 'null'
        waitingExitDate:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        assignedGroupName:
          type:
            - string
            - 'null'
        productName:
          type: string
          minLength: 1
          maxLength: 300
          description: Непустое имя продукта для каталога.
        serviceType:
          type:
            - string
            - 'null'
      additionalProperties: true
    ItsmIncidentSnapshot:
      type: array
      description: 'Полный снимок текущей выгрузки, включая неизменившиеся INC; не список изменений. Пустой массив — снимок без записей.'
      items:
        $ref: '#/components/schemas/ItsmIncident'
    ItsmBatchAccepted:
      type: object
      required:
        - batchId
      properties:
        batchId:
          type: string
          format: uuid
          description: 'Равен `Idempotency-Key` и последнему сегменту `Location`.'
      additionalProperties: false
    ItsmBatchMetadata:
      type: object
      required:
        - batchId
        - sourceId
        - sourceVersion
        - receivedAt
        - status
      properties:
        batchId:
          type: string
          format: uuid
        sourceId:
          type: string
        sourceVersion:
          type: integer
          minimum: 1
          description: 'Версия доставки; не `revision` и не `eventSeq`.'
        receivedAt:
          $ref: '#/components/schemas/UtcInstant'
        status:
          type: string
          enum:
            - RECEIVED
            - PROCESSING
            - SUCCEEDED
            - FAILED
        diagnostic:
          type:
            - string
            - 'null'
          description: Безопасное описание; без payload и секретов.
        nextAttemptAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
          description: 'Время назначенного повтора; `null` — повтор не назначен.'
        waitingForVersion:
          type: [integer, 'null']
          minimum: 1
          description: Версия предшественника, которого ждёт пакет.
      additionalProperties: false
    SnapshotStatus:
      type: object
      required:
        - lastReceivedAt
        - lastSuccessAt
        - revision
        - stale
      properties:
        lastReceivedAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        lastSuccessAt:
          anyOf:
            - $ref: '#/components/schemas/UtcInstant'
            - type: 'null'
        revision:
          type:
            - integer
            - 'null'
          minimum: 1
          description: 'Наибольшая опубликованная ревизия изменений; `null` до первого успешного применения. Не растёт на `202` или неизменившемся снимке.'
        stale:
          type: boolean
          description: '`true`, пока последний принятый снимок не опубликован, или снимков нет дольше `ITSM_INTAKE_STALE_AFTER`. '
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - code
        - message
      description: 'Ошибка REST API (`GlobalExceptionHandler` или сервлет-фильтр); заголовок `X-Request-Id`.'
      properties:
        code:
          type: string
          minLength: 1
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
          minLength: 1
      additionalProperties: false
