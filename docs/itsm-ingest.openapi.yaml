openapi: 3.1.0
info:
  title: Приём полного снимка ITSM
  version: 1.0.0
  description: |
    Канонический контракт машинной интеграции ITCS → dashboard по KAN-20: отправитель KAN-53 и приёмник KAN-27. Реализовано в ветке KAN-27 (приёмник) и в `itsm-mock` (KAN-53, отправитель).
    ## Как читать документ
    Каждая операция описана один раз — в `paths`, по своему маршруту: `POST /api/integrations/itsm/batches` — машина ITCS передаёт полный снимок (машинный Bearer, массив INC, идентификатор и версия пакета в заголовках, `202` с `Location`); `GET /api/integrations/itsm/batches/{batchId}` — чтение состояния пакета; `GET /api/snapshot/status` — опубликованная версия и свежесть. Это общий для всех операций маршрут чтения (§ "Один канонический маршрут для каждого чтения").
    Исходящее событие того же приёма опубликовано отдельно в `webhooks` с теми же схемами и примерами (`POST /api/integrations/itsm/batches`). Семантика события остаётся webhook-овой и не зависит от того, в каком разделе её показывают.
    ## Что уже развёрнуто, а что предлагается
    - KAN-27 и KAN-55 реализуют приём, асинхронную публикацию и статус. Семантическая ошибка записи появляется после `202` как терминальный `FAILED` по `Location`, а не как HTTP `422`.
    - Клиент KAN-53 (`itsm-mock`) использует тот же POST, заголовки и массив INC. Предлагаемые `payload` и `Idempotent-Replayed` не возвращаются приёмником.
    - Общее состояние снимка и диагностический маршрут источника используют цепочку приложения. Чтения карточки, списка, polling и ack описаны отдельно в `dashboard-api.openapi.yaml`.
    ## Каждые 30 секунд — полный снимок, а не список изменений
    Подтверждённый контракт ITCS: отправитель каждые 30 секунд передаёт полный снимок текущей выгрузки — все INC, включая неизменившиеся. Это не дельта. Примеры `minimal` и `nextTick` отличаются ровно одним INC (`INC000021095533`).
    ## Версия источника, revision и eventSeq
    `X-Source-Version` — версия выгрузки отправителя (**sourceVersion**). `revision` в `GET /api/snapshot/status` — наибольшая опубликованная ревизия изменений (`null` до первого успешного применения). Неизменившийся снимок подтверждает наблюдение, не повышая ревизию. `eventSeq` (KAN-7) — отдельный курсор событий. `202` не публикует данные.
    ## Ошибки
    Все JSON-ошибки — `ErrorResponse` (`code`, `message`) и `X-Request-Id`. Коды стабильны, тексты `message` — нет.
    ## Примеры
    Примеры синтетические. Те же объекты лежат в `src/test/resources/openapi/synthetic/`; `*IT` сверяет примеры с фикстурами и валидирует их по `components.schemas`. Негативные фикстуры — в `src/test/resources/openapi/invalid/`.
paths:
  /api/integrations/itsm/batches:
    post:
      operationId: receiveItsmBatch
      summary: 'Принять полный снимок инцидентов (deployed, KAN-53 → KAN-27)'
      description: 'Тело — JSON-массив INC. Развёрнутая версия сохраняет его байт-в-байт; записи не переписываются и не проверяются (это KAN-21). Строгий JSON: иной верхний уровень или лишний JSON-значение — `400 ITSM_INVALID_PAYLOAD`, ничего не сохраняется. Массив `[]` допустим и тоже сохраняется. `202` подтверждает приём: публикация — позже, воркером. '
      security:
        - machineBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 'UUID пакета, он же `batchId` и последний сегмент `Location`. Повтор доставки сохраняет ключ, версию и байты; иные метаданные или байты — `409 ITSM_IDEMPOTENCY_CONFLICT`. '
          schema:
            type: string
            minLength: 36
            maxLength: 36
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          examples:
            sourceBatch:
              summary: Пакет версии 42
              value: 3f2c1b9e-6a43-4c1a-9a37-0e5d7b2d4c11
            nextTickBatch:
              summary: Пакет версии 43
              value: 5b8e2c4d-1f6a-4d3b-8e27-9c0a1b2d3e4f
        - name: X-Source-Id
          in: header
          required: true
          description: 'Постоянный идентификатор экземпляра источника: 1–128 видимых ASCII.'
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[\u0021-\u007E]{1,128}$'
          examples:
            itcs:
              value: itcs-prod
        - name: X-Source-Version
          in: header
          required: true
          description: 'Монотонная версия полного снимка: десятичное целое `int64 >= 1` без знака и ведущих нулей (максимум 9223372036854775807). Уникальна для источника: та же версия с другим ключом — `409 ITSM_SOURCE_VERSION_CONFLICT`. Развёрнутый приёмник не требует строгого возрастания. Не `revision` и не `eventSeq`. '
          schema:
            type: string
            pattern: '^[1-9][0-9]{0,18}$'
            x-format: int64
          examples:
            sourceBatch:
              value: 42
            nextTickBatch:
              value: 43
      requestBody:
        required: true
        description: 'Полный массив INC текущей выгрузки, включая неизменившиеся; `[]` допустим. `minimal` и `nextTick` — полные снимки через 30 секунд, отличаются лишь `priorityId` у `INC000021095533`. '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItsmIncidentSnapshot'
            examples:
              empty:
                summary: Полный снимок без активных записей
                value: []
              minimal:
                summary: 'Полный снимок в 09:05:00, два INC (fixture snapshot-minimal)'
                x-fixture: snapshot-minimal
                value: [{"id": "INC000021095531", "header": "Не проходят оплаты картой", "description": "Синтетическое описание для контрактных примеров KAN-20.", "productName": "Оплата заказов", "productMasterId": "BI_pay", "service": "checkout-api", "serviceType": "Клиентский", "scenarioName": "Оформление заказа", "submitDate": "2026-11-21T09:05:00Z", "lastAssignmentToTeamDateTime": "2026-11-21T09:05:00Z", "priorityId": 4, "priority": "Наивысший", "stateEnum": "Assigned", "stateId": 0, "state": "Assigned", "stateReason": null, "assignedGroupName": "КЦ ИТ Координаторы Массовых Инцидентов", "initiatorLogin": "synthetic.operator", "initiatorName": "Синтетический оператор", "deadline": "2026-11-21T12:00:00Z", "completionDate": null, "solution": null}, {"id": "INC000021095533", "header": "Замедлены возвраты", "description": "Синтетическое описание для контрактных примеров KAN-20.", "productName": "Оплата заказов", "productMasterId": "BI_pay", "service": "checkout-api", "serviceType": "Клиентский", "scenarioName": "Оформление заказа", "submitDate": "2026-11-21T09:02:00Z", "lastAssignmentToTeamDateTime": "2026-11-21T09:02:00Z", "priorityId": 3, "priority": "Высокий", "stateEnum": "WorkInProgress", "stateId": 2, "state": "WorkInProgress", "stateReason": null, "assignedGroupName": "Payment Ops", "initiatorLogin": "synthetic.operator", "initiatorName": "Синтетический оператор", "deadline": "2026-11-21T18:00:00Z", "completionDate": null, "solution": null}]
              nextTick:
                summary: 'Тот же снимок в 09:05:30, изменился только INC000021095533 (fixture snapshot-next-tick)'
                x-fixture: snapshot-next-tick
                value: [{"id": "INC000021095531", "header": "Не проходят оплаты картой", "description": "Синтетическое описание для контрактных примеров KAN-20.", "productName": "Оплата заказов", "productMasterId": "BI_pay", "service": "checkout-api", "serviceType": "Клиентский", "scenarioName": "Оформление заказа", "submitDate": "2026-11-21T09:05:00Z", "lastAssignmentToTeamDateTime": "2026-11-21T09:05:00Z", "priorityId": 4, "priority": "Наивысший", "stateEnum": "Assigned", "stateId": 0, "state": "Assigned", "stateReason": null, "assignedGroupName": "КЦ ИТ Координаторы Массовых Инцидентов", "initiatorLogin": "synthetic.operator", "initiatorName": "Синтетический оператор", "deadline": "2026-11-21T12:00:00Z", "completionDate": null, "solution": null}, {"id": "INC000021095533", "header": "Замедлены возвраты", "description": "Синтетическое описание для контрактных примеров KAN-20.", "productName": "Оплата заказов", "productMasterId": "BI_pay", "service": "checkout-api", "serviceType": "Клиентский", "scenarioName": "Оформление заказа", "submitDate": "2026-11-21T09:02:00Z", "lastAssignmentToTeamDateTime": "2026-11-21T09:02:00Z", "priorityId": 4, "priority": "Наивысший", "stateEnum": "WorkInProgress", "stateId": 2, "state": "WorkInProgress", "stateReason": null, "assignedGroupName": "Payment Ops", "initiatorLogin": "synthetic.operator", "initiatorName": "Синтетический оператор", "deadline": "2026-11-21T18:00:00Z", "completionDate": null, "solution": null}]
              sourceBatchRequest:
                summary: 'Снимок с INC без срока, P4 в двух группах, Research и второй версией (fixture source-batch-request)'
                x-fixture: source-batch-request
                value: [{"id": "INC000021095531", "header": "Не проходят оплаты картой", "description": "Синтетическое описание для контрактных примеров KAN-20.", "productName": "Оплата заказов", "productMasterId": "BI_pay", "service": "checkout-api", "serviceType": "Клиентский", "scenarioName": "Оформление заказа", "submitDate": "2026-11-21T09:05:00Z", "lastAssignmentToTeamDateTime": "2026-11-21T09:05:00Z", "priorityId": 4, "priority": "Наивысший", "stateEnum": "Assigned", "stateId": 0, "state": "Assigned", "stateReason": null, "assignedGroupName": "КЦ ИТ Координаторы Массовых Инцидентов", "initiatorLogin": "synthetic.operator", "initiatorName": "Синтетический оператор", "deadline": "2026-11-21T12:00:00Z", "completionDate": null, "solution": null}, {"id": "INC000021095532", "header": "Часть заказов не оплачивается через СБП", "description": "Синтетическое описание для контрактных примеров KAN-20.", "productName": "Оплата заказов", "productMasterId": "BI_pay", "service": "checkout-api", "serviceType": "Клиентский", "scenarioName": "Оформление заказа", "submitDate": "2026-11-21T09:01:00Z", "lastAssignmentToTeamDateTime": "2026-11-21T09:01:00Z", "priorityId": 4, "priority": "Наивысший", "stateEnum": "WorkInProgress", "stateId": 2, "state": "WorkInProgress", "stateReason": null, "assignedGroupName": "КЦ ИТ Координаторы Массовых Инцидентов", "initiatorLogin": "synthetic.operator", "initiatorName": "Синтетический оператор", "completionDate": null, "solution": null}, {"id": "INC000021095533", "header": "Замедлены возвраты", "description": "Синтетическое описание для контрактных примеров KAN-20.", "productName": "Оплата заказов", "productMasterId": "BI_pay", "service": "checkout-api", "serviceType": "Клиентский", "scenarioName": "Оформление заказа", "submitDate": "2026-11-21T09:02:00Z", "lastAssignmentToTeamDateTime": "2026-11-21T09:02:00Z", "priorityId": 3, "priority": "Высокий", "stateEnum": "WorkInProgress", "stateId": 2, "state": "WorkInProgress", "stateReason": null, "assignedGroupName": "Payment Ops", "initiatorLogin": "synthetic.operator", "initiatorName": "Синтетический оператор", "deadline": "2026-11-21T18:00:00Z", "completionDate": null, "solution": null}, {"id": "INC000021095534", "header": "Медленная загрузка каталога", "description": "Синтетическое описание для контрактных примеров KAN-20.", "productName": "Оплата заказов", "productMasterId": "BI_pay", "service": "checkout-api", "serviceType": "Клиентский", "scenarioName": "Оформление заказа", "submitDate": "2026-11-21T08:55:00Z", "lastAssignmentToTeamDateTime": "2026-11-21T08:55:00Z", "priorityId": 2, "priority": "Средний", "stateEnum": "Assigned", "stateId": 0, "state": "Assigned", "stateReason": null, "assignedGroupName": "Онлайн-магазин", "initiatorLogin": "synthetic.operator", "initiatorName": "Синтетический оператор", "deadline": "2026-11-22T09:00:00Z", "completionDate": null, "solution": null}, {"id": "INC000021095539", "header": "Ошибки авторизации в приложении", "description": "Синтетическое описание для контрактных примеров KAN-20.", "productName": "Оплата заказов", "productMasterId": "BI_pay", "service": "checkout-api", "serviceType": "Клиентский", "scenarioName": "Оформление заказа", "submitDate": "2026-11-20T15:00:00Z", "lastAssignmentToTeamDateTime": "2026-11-20T15:00:00Z", "priorityId": 3, "priority": "Высокий", "stateEnum": "Research", "stateId": 8, "state": "Research", "stateReason": "решено", "assignedGroupName": "КЦ ИТ Координаторы Массовых Инцидентов", "initiatorLogin": "synthetic.operator", "initiatorName": "Синтетический оператор", "deadline": "2026-11-20T20:00:00Z", "completionDate": "2026-11-20T19:40:00Z", "solution": "Перезапущен пул соединений БД"}, {"id": "INC000021095537", "header": "Виджет корзины показывал ошибку", "description": "Синтетическое описание для контрактных примеров KAN-20.", "productName": "Оплата заказов", "productMasterId": "BI_pay", "service": "checkout-api", "serviceType": "Клиентский", "scenarioName": "Оформление заказа", "submitDate": "2026-11-19T10:00:00Z", "lastAssignmentToTeamDateTime": "2026-11-19T10:00:00Z", "priorityId": 2, "priority": "Средний", "stateEnum": "Closed", "stateId": 10, "state": "Closed", "stateReason": "решено", "assignedGroupName": "Онлайн-магазин", "initiatorLogin": "synthetic.operator", "initiatorName": "Синтетический оператор", "deadline": "2026-11-19T18:00:00Z", "completionDate": "2026-11-19T16:30:00Z", "solution": "Откатан релиз виджета"}, {"id": "INC000021095538", "header": "Высокий процент отказов платёжного шлюза", "description": "Синтетическое описание для контрактных примеров KAN-20.", "productName": "Оплата заказов", "productMasterId": "BI_pay", "service": "checkout-api", "serviceType": "Клиентский", "scenarioName": "Оформление заказа", "submitDate": "2026-11-21T09:03:00Z", "lastAssignmentToTeamDateTime": "2026-11-21T09:03:00Z", "priorityId": 3, "priority": "Высокий", "stateEnum": "WorkInProgress", "stateId": 2, "state": "WorkInProgress", "stateReason": null, "assignedGroupName": "Оплата", "initiatorLogin": "synthetic.operator", "initiatorName": "Синтетический оператор", "deadline": "2026-11-24T18:00:00Z", "completionDate": null, "solution": null}]
      responses:
        '202':
          description: 'Пакет принят и зафиксирован до ответа. Первый приём и идемпотентный повтор возвращают одинаковые тело и `Location`. '
          headers:
            Location:
              required: true
              description: Относительный URI метаданных пакета; абсолютный строится от текущего хоста.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItsmBatchAccepted'
              examples:
                firstAccept:
                  summary: Первый приём (fixture ingest-accepted-202)
                  x-fixture: ingest-accepted-202
                  value: {"batchId": "3f2c1b9e-6a43-4c1a-9a37-0e5d7b2d4c11"}
                idempotentReplay:
                  summary: 'Повтор теми же байтами возвращает тот же batchId'
                  x-fixture: ingest-accepted-replay-202
                  value: {"batchId": "3f2c1b9e-6a43-4c1a-9a37-0e5d7b2d4c11"}
        '400':
          description: Некорректный вход; ничего не сохраняется.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidIdempotencyKey:
                  summary: Idempotency-Key не UUID
                  value: {"code": "ITSM_INVALID_IDEMPOTENCY_KEY", "message": "Idempotency-Key must be a UUID"}
                invalidSourceId:
                  summary: Источник не 1–128 видимых ASCII
                  value: {"code": "ITSM_INVALID_SOURCE_ID", "message": "X-Source-Id must be 1-128 visible ASCII characters"}
                invalidSourceVersion:
                  summary: Версия не положительное 64-битное целое
                  value: {"code": "ITSM_INVALID_SOURCE_VERSION", "message": "X-Source-Version must be a positive 64-bit integer"}
                invalidPayload:
                  summary: Тело не одиночный JSON-массив
                  value: {"code": "ITSM_INVALID_PAYLOAD", "message": "Request body must be a single JSON array"}
                invalidRecord:
                  summary: Запись отклонена проверкой KAN-21
                  value: {"code": "ITSM_INVALID_RECORD", "message": "ITSM record in snapshot at index 0 has invalid field id: must be a string"}
                duplicateRecord:
                  summary: Идентификатор INC повторяется в снимке
                  value: {"code": "ITSM_DUPLICATE_RECORD", "message": "ITSM snapshot contains duplicate id; record at index 1 repeats index 0"}
        '401':
          description: 'Нет, просрочен или невалиден машинный Bearer (issuer, подпись JWKS, audience). Ответляет точка входа машинной цепочки.'
          headers:
            WWW-Authenticate:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                machineAuthRequired:
                  summary: Нет или невалиден машинный Bearer
                  value: {"code": "ITSM_MACHINE_AUTH_REQUIRED", "message": "Machine bearer token is required"}
        '403':
          description: 'Токен без машинного `azp` или без права импорта.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                machineAccessDenied:
                  summary: Токен без машинного azp или права импорта
                  value: {"code": "ITSM_MACHINE_ACCESS_DENIED", "message": "Machine client identity or itsm import permission is missing"}
        '409':
          description: Конфликт ключа или версии; состояние БД не меняется.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                idempotencyConflict:
                  summary: Ключ переиспользован с другими данными
                  value: {"code": "ITSM_IDEMPOTENCY_CONFLICT", "message": "Idempotency-Key was already used with different request metadata or payload"}
                sourceVersionConflict:
                  summary: Источник и версия уже приняты с другим ключом
                  value: {"code": "ITSM_SOURCE_VERSION_CONFLICT", "message": "Source version was already accepted with a different idempotency key"}
        '413':
          description: 'Тело больше ограничения LoggerFilter (`REQUEST_BODY_TOO_LARGE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bodyTooLarge:
                  summary: Тело больше ограничения
                  value: {"code": "REQUEST_BODY_TOO_LARGE", "message": "Request body exceeds 1048576 bytes"}
        '415':
          description: 'Content-Type не `application/json`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedMediaType:
                  summary: Content-Type не application/json
                  value: {"code": "UNSUPPORTED_MEDIA_TYPE", "message": "Content type is not supported"}
        '429':
          description: Очередь заполнена или источник публикует первый снимок. Повторите запрос с теми же заголовками и телом.
          headers:
            Retry-After:
              required: false
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                intakeQueueFull:
                  summary: Очередь необработанных пакетов заполнена
                  value: {"code": "ITSM_INTAKE_QUEUE_FULL", "message": "ITSM intake queue is full (1000 outstanding batches)"}
        '503':
          description: Приёмник временно недоступен.
      x-event:
        source: ITCS
        delivery: server-to-server
        webhook: /api/integrations/itsm/batches
  '/api/integrations/itsm/batches/{batchId}':
    get:
      operationId: getItsmBatch
      summary: Состояние принятого пакета (deployed)
      description: 'Метаданные пакета без исходного payload. Пока пакет не обработан — `RECEIVED` или `PROCESSING`; после успеха — `SUCCEEDED`, иначе `FAILED` с `diagnostic`. Опубликованную `revision` возвращает `GET /api/snapshot/status`, а не этот маршрут. '
      security:
        - machineBearer: []
      parameters:
        - name: batchId
          in: path
          required: true
          description: 'Значение `Idempotency-Key` принятого пакета.'
          schema:
            type: string
            format: uuid
          examples:
            sourceBatch:
              value: 3f2c1b9e-6a43-4c1a-9a37-0e5d7b2d4c11
      responses:
        '200':
          description: Метаданные пакета.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItsmBatchMetadata'
              examples:
                received:
                  summary: Пакет в очереди (fixture ingest-batch-received-200)
                  x-fixture: ingest-batch-received-200
                  value: {"batchId": "3f2c1b9e-6a43-4c1a-9a37-0e5d7b2d4c11", "sourceId": "itcs-prod", "sourceVersion": 42, "receivedAt": "2026-11-21T09:05:00.123456Z", "status": "RECEIVED", "diagnostic": null, "nextAttemptAt": null}
                receivedAfterRetry:
