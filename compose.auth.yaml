name: mts-dashboard-auth

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8084}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - type: bind
        source: ${AUTH_REALM_FILE:?Set AUTH_REALM_FILE to the rendered realm JSON}
        target: /opt/keycloak/data/import/dashboard-realm.json
        read_only: true
        bind:
          create_host_path: false
      - keycloak-data:/opt/keycloak/data/h2
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8084}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth-postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: dashboard_auth
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?Set AUTH_POSTGRES_PASSWORD}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard_auth"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-backend:
    build: .
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/dashboard_auth
      SPRING_DATASOURCE_USERNAME: dashboard
      SPRING_DATASOURCE_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?Set AUTH_POSTGRES_PASSWORD}
      APP_AUTH_HUMAN_ISSUER: http://localhost:${KEYCLOAK_PORT:-8084}/realms/dashboard
      APP_AUTH_HUMAN_JWK_SET_URI: http://keycloak:8080/realms/dashboard/protocol/openid-connect/certs
      APP_AUTH_HUMAN_AUDIENCE: dashboard-api
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ITSM_INTEGRATION_AUTH_ISSUER: http://localhost:${KEYCLOAK_PORT:-8084}/realms/dashboard
      ITSM_INTEGRATION_AUTH_JWK_SET_URI: http://keycloak:8080/realms/dashboard/protocol/openid-connect/certs
      ITSM_INTEGRATION_AUTH_AUDIENCE: itsm-ingest
      ITSM_INTEGRATION_AUTH_CLIENT_ID: itsm-sender
    depends_on:
      keycloak:
        condition: service_healthy
      auth-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AUTH_BACKEND_PORT:-8091}:8080"

volumes:
  keycloak-data:
  auth-postgres-data:
