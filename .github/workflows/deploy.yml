name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, pi-web]
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: mts-dashboard-backend
      BACKEND_PORT: ${{ vars.BACKEND_PORT || '8081' }}
      BACKEND_ENV_FILE: ${{ vars.BACKEND_ENV_FILE || '/home/gha-runner/.config/mts-dashboard-backend/runtime.env' }}
      STAND_KEYCLOAK_URL: ${{ vars.STAND_KEYCLOAK_URL }}
      STAND_FRONTEND_URL: ${{ vars.STAND_FRONTEND_URL }}
      STAND_ENABLE_ITSM_MOCK: ${{ vars.STAND_ENABLE_ITSM_MOCK || 'false' }}
      FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '8080' }}
      MCC_GROUP_MODEL: ${{ vars.MCC_GROUP_MODEL }}
      MCC_OLLAMA_URL: ${{ vars.MCC_OLLAMA_URL }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout frontend
        uses: actions/checkout@v6
        with:
          repository: Hardcode17/mts_dashboard_front
          ref: ${{ vars.STAND_FRONTEND_REF || 'main' }}
          path: .stand-sources/frontend
          persist-credentials: false

      - name: Checkout ITSM fixture source
        if: env.STAND_ENABLE_ITSM_MOCK == 'true'
        uses: actions/checkout@v6
        with:
          repository: Hardcode17/mts_dashboard_data
          ref: ${{ vars.STAND_DATA_REF || 'main' }}
          path: .stand-sources/data
          persist-credentials: false

      - name: Prepare frontend and fixture configuration
        run: bash scripts/prepare-stand-sources.sh

      - name: Check source and runtime configuration
        run: |
          test -f gradlew || { echo 'Merge the backend source into main before deploying.'; exit 1; }
          bash scripts/prepare-runtime.sh
          docker info
          docker compose --env-file "$BACKEND_ENV_FILE" version
          docker volume create "${STAND_WORKSPACE_VOLUME:-mts-dashboard-front_workspace-data}" >/dev/null
          docker compose --env-file "$BACKEND_ENV_FILE" config --quiet

      - name: Build backend
        run: docker compose --env-file "$BACKEND_ENV_FILE" build --pull backend

      - name: Deploy and wait for healthcheck
        run: docker compose --env-file "$BACKEND_ENV_FILE" up -d --no-build --wait --wait-timeout 300 backend keycloak

      - name: Reconcile Keycloak browser client
        run: |
          python3 scripts/reconcile-keycloak-web-client.py

      - name: Verify database sample
        run: |
          count=$(docker compose --env-file "$BACKEND_ENV_FILE" exec -T postgres psql -U dashboard -d dashboard -Atc 'SELECT count(*) FROM deployment_sample')
          test "$count" -ge 3

      - name: Grant stand coordinator admission
        run: |
          issuer="${STAND_KEYCLOAK_URL%/}/realms/dashboard"
          subject=$(python3 scripts/stand-coordinator-subject.py "$BACKEND_ENV_FILE")
          docker compose --env-file "$BACKEND_ENV_FILE" exec -T postgres \
            psql -U dashboard -d dashboard \
            -v issuer="$issuer" -v subject="$subject" \
            -v login=coordinator -v display_name='Координатор' \
            -f - < scripts/grant-coordinator.sql
          echo "Admitted coordinator (sub=$subject) for $issuer"

      - name: Seed demo shift handover coordinators
        if: env.STAND_ENABLE_ITSM_MOCK == 'true'
        run: |
          issuer="${STAND_KEYCLOAK_URL%/}/realms/dashboard"
          roster=$(python3 scripts/stand-coordinator-subject.py "$BACKEND_ENV_FILE" --seed-handover)
          docker compose --env-file "$BACKEND_ENV_FILE" exec -T postgres \
            psql -U dashboard -d dashboard -v issuer="$issuer" -v roster="$roster" \
            -f - < scripts/seed-demo-shift-coordinators.sql

      - name: Start stand ITSM mock and verify two fresh snapshots
        if: env.STAND_ENABLE_ITSM_MOCK == 'true'
        run: bash scripts/deploy-stand-itsm.sh

      - name: Stop stand ITSM mock when disabled
        if: env.STAND_ENABLE_ITSM_MOCK == 'false'
        run: docker compose --env-file "$BACKEND_ENV_FILE" --profile itsm-mock stop itsm-mock

      - name: Deploy frontend and verify the unified stand
        run: bash scripts/deploy-stand-frontend.sh

      - name: Verify mentor examples in the coordinator workspace
        if: env.STAND_ENABLE_ITSM_MOCK == 'true'
        run: python3 scripts/verify-mentor-demo.py

      - name: Show deployment status
        run: docker compose --env-file "$BACKEND_ENV_FILE" ps

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose --env-file "$BACKEND_ENV_FILE" ps -a
          docker compose --env-file "$BACKEND_ENV_FILE" logs --tail 100 backend postgres keycloak
          docker compose --env-file "$BACKEND_ENV_FILE" --profile frontend logs --tail 100 frontend
          if [[ "$STAND_ENABLE_ITSM_MOCK" == true ]]; then
            docker compose --env-file "$BACKEND_ENV_FILE" --profile itsm-mock logs --tail 100 itsm-mock
          fi
