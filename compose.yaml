services:
  backend:
    build:
      context: .
    env_file:
      - ${BACKEND_ENV_FILE:?Set BACKEND_ENV_FILE to the runtime env file on Pi}
    environment:
      SERVER_PORT: "8080"
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    restart: unless-stopped
    healthcheck:
      # Default Spring Security protects /health; 401 also confirms HTTP startup.
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/health) && { [ \"$$code\" = 200 ] || [ \"$$code\" = 401 ]; }"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
