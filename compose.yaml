services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Runtime file must contain POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
    env_file:
      - ${BACKEND_ENV_FILE:?Set BACKEND_ENV_FILE to the runtime env file on Pi}
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${BACKEND_PROFILE:-demo}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dashboard
      SPRING_DATASOURCE_USERNAME: dashboard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Runtime file must contain POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:8080/health > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

volumes:
  postgres-data:
