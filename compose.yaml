services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Runtime file must contain POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
    env_file:
      - ${BACKEND_ENV_FILE:?Set BACKEND_ENV_FILE to the runtime env file on Pi}
    environment:
      DASHBOARD_ITSM_BASE_URL: ${DASHBOARD_ITSM_BASE_URL:-http://itsm-mock:8080}
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${BACKEND_PROFILE:-demo}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dashboard
      SPRING_DATASOURCE_USERNAME: dashboard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Runtime file must contain POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:8080/health > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  keycloak-volume-init:
    image: quay.io/keycloak/keycloak:26.4.7
    user: "0:0"
    entrypoint: ["/usr/bin/chown"]
    command: ["1000:0", "/opt/keycloak/data/h2"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - keycloak-data:/opt/keycloak/data/h2

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Runtime file must contain KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${STAND_KEYCLOAK_URL:?Set STAND_KEYCLOAK_URL to the browser-reachable Keycloak base URL}
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - type: bind
        source: ${AUTH_REALM_FILE:?Set AUTH_REALM_FILE to the rendered realm JSON}
        target: /opt/keycloak/data/import/dashboard-realm.json
        read_only: true
        bind:
          create_host_path: false
      - keycloak-data:/opt/keycloak/data/h2
    ports:
      - "127.0.0.1:8084:8080"
    depends_on:
      keycloak-volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s

  frontend:
    profiles: [frontend]
    build:
      context: ${STAND_FRONTEND_CONTEXT:-.}
      args:
        VITE_OIDC_AUTHORITY: ${STAND_OIDC_AUTHORITY:-}
      labels:
        org.opencontainers.image.revision: ${STAND_FRONTEND_REVISION:-local}
    ports:
      - "${FRONTEND_PORT:-8080}:3000"
    environment:
      BACKEND_URL: http://backend:8080
      KEYCLOAK_URL: http://keycloak:8080
      OIDC_AUTHORITY: ${STAND_OIDC_AUTHORITY:-}
      ITSM_MOCK_URL: ${STAND_ITSM_PAGE_URL:-}
      MCC_STATE_DIR: /var/lib/mcc
      MCC_GROUP_MODEL: ${MCC_GROUP_MODEL:-}
      MCC_OLLAMA_URL: ${MCC_OLLAMA_URL:-http://127.0.0.1:11434}
    volumes:
      - workspace-data:/var/lib/mcc
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  itsm-mock:
    profiles: [itsm-mock]
    labels:
      ru.hardcode.itsm-fixture-sha256: ${STAND_FIXTURE_SHA256:-none}
    build:
      context: .
      dockerfile: itsm-mock/Dockerfile
    environment:
      ITSM_MOCK_TARGET_URL: ${ITSM_MOCK_TARGET_URL:-http://backend:8080/api/integrations/itsm/batches}
      ITSM_MOCK_TOKEN_URL: ${ITSM_MOCK_TOKEN_URL:-}
      ITSM_MOCK_CLIENT_ID: ${ITSM_MOCK_CLIENT_ID:-}
      ITSM_MOCK_CLIENT_SECRET: ${ITSM_MOCK_CLIENT_SECRET:-${STAND_ITSM_SENDER_SECRET:-}}
      ITSM_MOCK_SOURCE_ID: ${ITSM_MOCK_SOURCE_ID:-demo-itsm}
      ITSM_MOCK_INTERVAL: ${ITSM_MOCK_INTERVAL:-PT30S}
      ITSM_MOCK_SCHEDULED: ${ITSM_MOCK_SCHEDULED:-true}
      ITSM_MOCK_SEED: ${ITSM_MOCK_SEED:-53}
      ITSM_MOCK_BATCH_SIZE: ${ITSM_MOCK_BATCH_SIZE:-12}
      ITSM_MOCK_TIMEOUT: ${ITSM_MOCK_TIMEOUT:-PT5S}
      ITSM_MOCK_RETRY_DELAY: ${ITSM_MOCK_RETRY_DELAY:-PT0.25S}
      ITSM_MOCK_MAX_ATTEMPTS: ${ITSM_MOCK_MAX_ATTEMPTS:-3}
      ITSM_MOCK_FIXTURE_FILE: ${ITSM_MOCK_FIXTURE_FILE:-}
    volumes:
      - itsm-mock-data:/var/lib/itsm-mock
      - type: bind
        source: ${STAND_FIXTURE_DIR:-./deploy/fixtures}
        target: /fixtures
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${ITSM_MOCK_PORT:-8082}:8080"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  keycloak-data:
  itsm-mock-data:
  workspace-data:
    external: true
    name: ${STAND_WORKSPACE_VOLUME:-mts-dashboard-front_workspace-data}
