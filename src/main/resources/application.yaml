spring:
  application:
    name: dashboard
  security:
    user:
      name: user

request-logging:
  max-cached-body-size: 1MB
  log-request-body: false

app:
  cors:
    # Browser origins of the SPA allowed to call /api/** (KAN-64). Defaults are the dev
    # origins registered as redirect URIs of the dashboard-web Keycloak client.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  auth:
    human:
      # Blank keeps the existing demo chain for API routes except /api/me, which rejects all tokens.
      issuer: ${APP_AUTH_HUMAN_ISSUER:}
      issuer-uri: ${APP_AUTH_HUMAN_ISSUER_URI:}
      jwk-set-uri: ${APP_AUTH_HUMAN_JWK_SET_URI:}
      audience: ${APP_AUTH_HUMAN_AUDIENCE:}
      clock-skew: ${APP_AUTH_HUMAN_CLOCK_SKEW:PT30S}
dashboard:
  itsm:
    # Base URL of the external ITSM (itsm-mock) used by the coordinator edits and the user directory.
    base-url: ${DASHBOARD_ITSM_BASE_URL:http://127.0.0.1:8082}
    # A browser-facing URL. The default points to the incident page of the optional local itsm-mock.
    link-template: "${DASHBOARD_ITSM_LINK_TEMPLATE:http://127.0.0.1:8082/itsm_incident/{incidentId}/page}"
    link-demo: ${DASHBOARD_ITSM_LINK_DEMO:true}
    connect-timeout: ${DASHBOARD_ITSM_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${DASHBOARD_ITSM_READ_TIMEOUT:PT5S}

deadline-risk:
  # KAN-82 model constants. Product decision: the feature-aware regression is the DEFAULT mode —
  # the team deliberately prefers the smart forecast (reassignments, stuck cards, assignee load,
  # group history) even though the plain threshold is marginally sharper on the UCI test
  # (F1 0.778 vs 0.769); the weights are retrained on real MTS history by the KAN-81 script.
  # The plain remaining-time threshold stays the simple fallback mode.
  mode: regression
  # Fallback mode (deadline-risk.mode: threshold): high when less than this many hours remain
  # until the deadline. Calibrated on UCI ServiceNow (KAN-81 baseline A, N = 32.92); recompute
  # on real MTS history.
  threshold-hours: 32.92
  # Fallback mode: medium inside the (threshold, buffer) zone, low above it. Default 2*N.
  buffer-hours: 65.84
  regression:
    # Default mode (deadline-risk.mode: regression): KAN-81 logistic regression without
    # standardization, reproduced from tools/deadline_risk_weights.json.
    weights:
      w0: 4.379061
      w1: 0.010472
      w2: 0.167612
      w3: -0.030004
      w4: 0.42397
      w5: 0.033348
      w6: 0.007605
      w7: -2.089877
    # Category boundaries on the raw score, tuned on train for a ~20% false-positive budget.
    thresholds:
      medium: -1.286237
      high: -0.913755
    # Feature bounds fixed by the offline notebook; the scorer clamps every feature to them.
    clamps:
      x1: {min: 0.0, max: 100.0}
      x2: {min: 0.0, max: 200.0}
      x3: {min: 0.0, max: 50.0}
      x4: {min: 0.0, max: 20.0}
      x5: {min: 0.0, max: 2160.0}
      x6: {min: 0.0, max: 100.0}
      x7: {min: 1.0, max: 4.0}
    # Floor for the deadline remainder in x1 so a passed deadline cannot divide by zero.
    min-remaining-hours: 0.25
    # Training medians by UCI priority (1 = critical, 4 = low), used until local history exists.
    priority-medians-hours: [52.8917, 67.7833, 27.0667, 30.4]
  # When a feature becomes a named reason of the assessment.
  reasons:
    stale-status-hours: 24
    assignee-open-threshold: 5


notifications:
  webhook:
    # Controlled receiver that stands in for the channel APIs of the stand (KAN-35). Blank keeps
    # the adapter configured but every attempt fails with the sanitized channel_unconfigured reason.
    url: ${NOTIFICATIONS_WEBHOOK_URL:}
    connect-timeout: ${NOTIFICATIONS_WEBHOOK_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${NOTIFICATIONS_WEBHOOK_READ_TIMEOUT:PT5S}

coordinator:
  access:
    user-client-ids: ${COORDINATOR_USER_CLIENT_IDS:dashboard-web}

itsm:
  intake:
    max-outstanding-batches: ${ITSM_INTAKE_MAX_OUTSTANDING_BATCHES:1000}
    stale-after: ${ITSM_INTAKE_STALE_AFTER:PT90S}
  publication:
    enabled: ${ITSM_PUBLICATION_ENABLED:true}
  worker:
    # Disable on instances that should accept requests without processing them.
    enabled: ${ITSM_WORKER_ENABLED:true}
    workers: ${ITSM_WORKER_WORKERS:2}
    max-attempts: ${ITSM_WORKER_MAX_ATTEMPTS:5}
    retry-base-delay: ${ITSM_WORKER_RETRY_BASE_DELAY:PT30S}
    poll-interval: ${ITSM_WORKER_POLL_INTERVAL:PT1S}
    drain-timeout: ${ITSM_WORKER_DRAIN_TIMEOUT:PT30S}
    recovery-interval: ${ITSM_WORKER_RECOVERY_INTERVAL:PT30S}
    recovery-heartbeat-timeout: ${ITSM_WORKER_RECOVERY_HEARTBEAT_TIMEOUT:PT10M}
  integration:
    auth:
      issuer: ${ITSM_INTEGRATION_AUTH_ISSUER:}
      jwk-set-uri: ${ITSM_INTEGRATION_AUTH_JWK_SET_URI:}
      audience: ${ITSM_INTEGRATION_AUTH_AUDIENCE:}
      client-id: ${ITSM_INTEGRATION_AUTH_CLIENT_ID:}
      import-role: ${ITSM_INTEGRATION_AUTH_IMPORT_ROLE:itsm:import}

mcp:
  evidence:
    # Read-only MCP evidence tools (KAN-39) exist only for one explicit demo mapping.
    # Blank defaults keep them fail-closed; set every identifier and the bounded observation
    # window. The tools run on the standard Streamable HTTP MCP transport at POST /mcp/evidence
    # and only when this mapping is complete (see application-evidence.yaml for the client
    # identity and the transport switch).
    demo:
      scenario-id: ${MCP_EVIDENCE_SCENARIO_ID:}
      incident-id: ${MCP_EVIDENCE_INCIDENT_ID:}
      scenario-run-id: ${MCP_EVIDENCE_SCENARIO_RUN_ID:}
      itsm-service-key: ${MCP_EVIDENCE_ITSM_SERVICE_KEY:}
      log-service-key: ${MCP_EVIDENCE_LOG_SERVICE_KEY:}
      database-service-key: ${MCP_EVIDENCE_DATABASE_SERVICE_KEY:}
      max-window: ${MCP_EVIDENCE_MAX_WINDOW:PT24H}
      # The only window calls may observe. Keep both blank to use the age below (now-counted,
      # bounded by max-window); set both as ISO-8601 instants to pin a fixed stand window.
      observation-window:
        from: ${MCP_EVIDENCE_WINDOW_FROM:}
        to: ${MCP_EVIDENCE_WINDOW_TO:}
      observation-window-age: ${MCP_EVIDENCE_WINDOW_AGE:PT24H}
      itsm:
        base-url: ${MCP_EVIDENCE_ITSM_BASE_URL:}
      log:
        base-url: ${MCP_EVIDENCE_LOG_BASE_URL:}
        customer-id: ${MCP_EVIDENCE_LOG_CUSTOMER_ID:}
      database:
        url: ${MCP_EVIDENCE_DB_URL:}
        username: ${MCP_EVIDENCE_DB_USERNAME:}
        password: ${MCP_EVIDENCE_DB_PASSWORD:}
        view: ${MCP_EVIDENCE_DB_VIEW:}
  dashboard:
    # Read-only MCP Dashboard tools (KAN-86) on the standard Streamable HTTP transport at
    # POST /mcp/dashboard. Fail-closed by default; cursors are HMAC-signed, so a secret is
    # required to continue snapshot walks. Access: an active coordinator (human JWT) or the
    # machine agent MVP with its dedicated audience/client/role (read-only, no ITSM write
    # scopes; assign_incident is not declared).
    enabled: ${MCP_DASHBOARD_ENABLED:false}
    cursor-secret: ${MCP_DASHBOARD_CURSOR_SECRET:}
    snapshot-fresh: ${MCP_DASHBOARD_SNAPSHOT_FRESH:PT60S}
    cursor-ttl: ${MCP_DASHBOARD_CURSOR_TTL:PT15M}
    changes-cursor-ttl: ${MCP_DASHBOARD_CHANGES_CURSOR_TTL:P7D}
    client:
      audience: ${MCP_DASHBOARD_CLIENT_AUDIENCE:}
      client-id: ${MCP_DASHBOARD_CLIENT_ID:}
      role: ${MCP_DASHBOARD_CLIENT_ROLE:mcp:dashboard:read}

ai:
  investigation:
    # KAN-40: launch and read of an AI investigation. The real model call is enabled by the
    # `ai` Spring profile together with this key; blank keeps every launch refused with an
    # explicit AI_MODEL_NOT_CONFIGURED status, and the incident card stays readable.
    model-api-key: ${DASHBOARD_AI_DEEPSEEK_API_KEY:}
    model-timeout: ${DASHBOARD_AI_MODEL_TIMEOUT:PT60S}
    workers: ${DASHBOARD_AI_WORKERS:2}
    queue-capacity: ${DASHBOARD_AI_QUEUE_CAPACITY:100}

logging:
  file:
    name: ./logs/dashboard.log
  pattern:
    level: "%5p [requestId=%X{requestId:--}]"
  level:
    root: INFO
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 14
      total-size-cap: 1GB
