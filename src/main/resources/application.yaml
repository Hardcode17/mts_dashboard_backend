spring:
  application:
    name: dashboard
  security:
    user:
      name: user

request-logging:
  max-cached-body-size: 1MB
  log-request-body: false

app:
  cors:
    # Browser origins of the SPA allowed to call /api/** (KAN-64). Defaults are the dev
    # origins registered as redirect URIs of the dashboard-web Keycloak client.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  auth:
    human:
      # Blank keeps the existing demo chain for API routes except /api/me, which rejects all tokens.
      issuer: ${APP_AUTH_HUMAN_ISSUER:}
      issuer-uri: ${APP_AUTH_HUMAN_ISSUER_URI:}
      jwk-set-uri: ${APP_AUTH_HUMAN_JWK_SET_URI:}
      audience: ${APP_AUTH_HUMAN_AUDIENCE:}
      clock-skew: ${APP_AUTH_HUMAN_CLOCK_SKEW:PT30S}
dashboard:
  itsm:
    # Base URL of the external ITSM (itsm-mock) used by the coordinator edits and the user directory.
    base-url: ${DASHBOARD_ITSM_BASE_URL:http://127.0.0.1:8082}
    # A browser-facing URL. The default points to the incident page of the optional local itsm-mock.
    link-template: "${DASHBOARD_ITSM_LINK_TEMPLATE:http://127.0.0.1:8082/itsm_incident/{incidentId}/page}"
    link-demo: ${DASHBOARD_ITSM_LINK_DEMO:true}
    connect-timeout: ${DASHBOARD_ITSM_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${DASHBOARD_ITSM_READ_TIMEOUT:PT5S}

coordinator:
  access:
    user-client-ids: ${COORDINATOR_USER_CLIENT_IDS:dashboard-web}

itsm:
  intake:
    max-outstanding-batches: ${ITSM_INTAKE_MAX_OUTSTANDING_BATCHES:1000}
    stale-after: ${ITSM_INTAKE_STALE_AFTER:PT90S}
  publication:
    enabled: ${ITSM_PUBLICATION_ENABLED:true}
  worker:
    # Disable on instances that should accept requests without processing them.
    enabled: ${ITSM_WORKER_ENABLED:true}
    workers: ${ITSM_WORKER_WORKERS:2}
    max-attempts: ${ITSM_WORKER_MAX_ATTEMPTS:5}
    retry-base-delay: ${ITSM_WORKER_RETRY_BASE_DELAY:PT30S}
    poll-interval: ${ITSM_WORKER_POLL_INTERVAL:PT1S}
    drain-timeout: ${ITSM_WORKER_DRAIN_TIMEOUT:PT30S}
    recovery-interval: ${ITSM_WORKER_RECOVERY_INTERVAL:PT30S}
    recovery-heartbeat-timeout: ${ITSM_WORKER_RECOVERY_HEARTBEAT_TIMEOUT:PT10M}
  integration:
    auth:
      issuer: ${ITSM_INTEGRATION_AUTH_ISSUER:}
      jwk-set-uri: ${ITSM_INTEGRATION_AUTH_JWK_SET_URI:}
      audience: ${ITSM_INTEGRATION_AUTH_AUDIENCE:}
      client-id: ${ITSM_INTEGRATION_AUTH_CLIENT_ID:}
      import-role: ${ITSM_INTEGRATION_AUTH_IMPORT_ROLE:itsm:import}

mcp:
  evidence:
    # Read-only MCP evidence tools (KAN-39) exist only for one explicit demo mapping.
    # Blank defaults keep them fail-closed; set every identifier and the bounded observation
    # window. The tools run on the standard Streamable HTTP MCP transport at POST /mcp/evidence
    # and only when this mapping is complete (see application-evidence.yaml for the client
    # identity and the transport switch).
    demo:
      scenario-id: ${MCP_EVIDENCE_SCENARIO_ID:}
      incident-id: ${MCP_EVIDENCE_INCIDENT_ID:}
      scenario-run-id: ${MCP_EVIDENCE_SCENARIO_RUN_ID:}
      itsm-service-key: ${MCP_EVIDENCE_ITSM_SERVICE_KEY:}
      log-service-key: ${MCP_EVIDENCE_LOG_SERVICE_KEY:}
      database-service-key: ${MCP_EVIDENCE_DATABASE_SERVICE_KEY:}
      max-window: ${MCP_EVIDENCE_MAX_WINDOW:PT24H}
      # The only window calls may observe. Keep both blank to use the age below (now-counted,
      # bounded by max-window); set both as ISO-8601 instants to pin a fixed stand window.
      observation-window:
        from: ${MCP_EVIDENCE_WINDOW_FROM:}
        to: ${MCP_EVIDENCE_WINDOW_TO:}
      observation-window-age: ${MCP_EVIDENCE_WINDOW_AGE:PT24H}
      itsm:
        base-url: ${MCP_EVIDENCE_ITSM_BASE_URL:}
      log:
        base-url: ${MCP_EVIDENCE_LOG_BASE_URL:}
        customer-id: ${MCP_EVIDENCE_LOG_CUSTOMER_ID:}
      database:
        url: ${MCP_EVIDENCE_DB_URL:}
        username: ${MCP_EVIDENCE_DB_USERNAME:}
        password: ${MCP_EVIDENCE_DB_PASSWORD:}
        view: ${MCP_EVIDENCE_DB_VIEW:}

logging:
  file:
    name: ./logs/dashboard.log
  pattern:
    level: "%5p [requestId=%X{requestId:--}]"
  level:
    root: INFO
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 14
      total-size-cap: 1GB
